name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate editable content
        run: python generate.py --validate-only

      - name: Build browser data
        run: python generate.py --output "$RUNNER_TEMP/bsfg-data"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check site/assets/app.js

      - name: Check repository for private local paths
        run: |
          if git grep -nE '/root/\\.openclaw|/home/[^/]+/\\.openclaw'; then
            echo 'Private local path found in tracked files.' >&2
            exit 1
          fi
