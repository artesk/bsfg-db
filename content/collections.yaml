  purchase_prices: 'ExCollectionData-ru.dat: два uint32 после имени и минимального уровня. Загрузчик smackw32.dll 0x21019411/0x2101941a
    → поля записи +0x10c/+0x110; преобразование 0x2100f6f8/0x2100f701 → UIExCollectionData +4/+8 (m_Price/m_RelictPrice).
    Interface.u: OnClickButtonWithHandle, UpdateOrCreateCollectionDisplayRow; SysString 8300/8301 — покупка реликтовой/обычной
    коллекции, 8303 — золота. Нулевое поле реликтовой цены не импортируется. Реликтовая цена импортируется только при m_bCanBeRelict
    (flag2=1); у ID 51 поле равно 50000000, но реликтовый вариант отключён и не публикуется.'
