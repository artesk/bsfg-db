title: Остров осужденных
intro: Остров осужденных — локация для охоты на «Осуждённых» и добычи предметов для улучшения ультимативных умений.
image:
  src: assets/guides/condemned-island.jpg
  alt: Персонаж среди монстров на Острове осужденных. Кадр из видео Monarh BSFG.
  width: 336
  height: 400
facts:
- label: Отправная точка
  text: Причал города «Осмун»
- label: Стоимость билета
  text: 10 000 золота
- label: Уровни монстров
  text: 69, 83, 90, 93 и 100
sections:
- heading: Как попасть на локацию
  bullets:
  - 'Отправная точка. Придите на причал города «Осмун» и обратитесь к NPC «Проводник Торвин».'
  - 'Стоимость перемещения. Купите у проводника билет за 10 000 золота, после чего он перенесёт персонажа на остров.'
  - 'Безопасная зона. Точка появления на острове является мирной зоной, где стоит NPC «Священник Серафион».'
- heading: Монстры и добыча
  bullets:
  - 'Виды противников. На острове обитают только монстры категории «Осуждённые»: 69-го, 83-го, 90-го и 93-го уровней на поверхности и 100-го уровня внутри пещеры за специальным порталом.'
  - 'Усложнение по мере продвижения. Чем дальше персонаж уходит вглубь острова, тем сильнее и выше уровнем становятся враги.'
  - 'Особый лут. С монстров каждого тира выпадают островные предметы «Процесс» соответствующего ранга — от I до V.'
  - 'Обычный лут. Помимо предметов для ультимативных умений, с монстров падают стандартные ресурсы, экипировка питомца и прочая добыча, аналогичная монстрам открытого мира того же уровня.'
- heading: Прокачка ультимативных умений
  paragraphs:
  - Для каждого этапа улучшения ультимативного умения требуется определённый уровень персонажа и предмет «Вердикт». Его можно создать у NPC «Священник Серафион» в обмен на 30 штук соответствующего «Процесса».
  table:
    columns: [Уровень умения, Требуемый уровень персонажа, Необходимый предмет, Рецепт у NPC «Священник Серафион»]
    rows:
    - ['1-й', '70-й', Вердикт I, '«Процесс I» — 30 шт.']
    - ['2-й', '84-й', Вердикт II, '«Процесс II» — 30 шт.']
    - ['3-й', '90-й', Вердикт III, '«Процесс III» — 30 шт.']
    - ['4-й', '93-й', Вердикт IV, '«Процесс IV» — 30 шт.']
    - ['5-й', '100-й', Вердикт V, '«Процесс V» — 30 шт.']
