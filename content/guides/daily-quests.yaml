title: Ежедневные задания
intro: Ежедневные задания — восемь лёгких квестов, которые обновляются каждый день. Выполните любые три, чтобы получить дополнительную «Рекомендацию делегата».
image:
  src: assets/guides/daily-quests.png
  alt: Меню с восемью ежедневными заданиями и условием получения «Рекомендации делегата» за выполнение любых трёх.
  width: 552
  height: 186
facts:
- label: Доступно заданий
  text: 8 каждый день
- label: Для рекомендации
  text: Любые 3 задания
- label: Билет опыта
  text: +15% на 1 час
sections:
- heading: Как открыть ежедневные задания
  paragraphs:
  - 'Откройте «Книгу апокалипсиса» сочетанием Alt+B и выберите «Задания».'
- heading: Как получить «Рекомендацию делегата»
  paragraphs:
  - За выполнение любых трёх ежедневных заданий вы получите одну «Рекомендацию делегата». Эта награда выдаётся дополнительно к рекомендации, которую можно ежедневно получить с «Разведки».
  - За ежедневные задания можно получить только одну бонусную рекомендацию в день. Выполнение шести заданий не даст вторую рекомендацию.
- heading: Флаги зоны высадки
  paragraphs:
  - Выполните ежедневное задание «Флаги зоны высадки». Получить его можно у Обелиска героев в столице.
- heading: Задания территорий
  paragraphs:
  - Выполните хотя бы одно задание территорий.
  - Если вы выполнили все задания территорий, доступные на вашем уровне, один раз в сутки можно получить дополнительное задание. Для этого снова станет доступно одно из уже пройденных заданий на ваш уровень.
- heading: Кристаллы душ
  paragraphs:
  - Выполните ежедневное задание «Кристаллы душ», получив минимум 30 необходимых предметов. Найти ведьм, знающих о кристаллах, поможет Делегат в столице.
- heading: Жалование
  paragraphs:
  - Получите 3 000 жалования за боевые действия расы, чтобы получить в награду «Билет опыта».
  - Билет на один час увеличивает получение опыта и сноровки при охоте на монстров на 15%.
- heading: Письма из столицы
  paragraphs:
  - Выполните за день хотя бы три задания из писем.
  - Если вы выполнили все просьбы жителей столицы из писем, один раз в сутки можно получить дополнительное письмо. Для этого снова станет доступно одно из уже пройденных писем на ваш уровень.
- heading: Охота на главарей
  paragraphs:
  - Выполните ежедневное задание «Охота на главарей». Получить его можно у Делегата в столице.
- heading: Арена смерти
  paragraphs:
  - Один раз в сутки одержите победу на Арене смерти. Для победы убейте максимальное количество противников во время боя.
  - В награду вы получите в три раза больше славы за победу на арене.
- heading: Задания аванпостов
  paragraphs:
  - Выполните любые три задания аванпостов в течение одного дня. Получить задания можно у центральной башни аванпоста.
- heading: Итоговые награды
  paragraphs:
  - 'За выполнение всех ежедневных заданий можно получить:'
  bullets:
  - Одну бонусную «Рекомендацию делегата».
  - Два дополнительных задания — письмо из столицы и задание территорий.
  - «Билет опыта», который на один час увеличивает получение опыта и сноровки при охоте на монстров на 15%.
  - Дополнительную славу на Арене смерти — втрое больше за победу.
sources:
- label: 'Описание системы ежедневных заданий и скриншот меню: материал сообщества, 17 ноября 2026.'
