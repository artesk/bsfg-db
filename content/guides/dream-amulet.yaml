title: Амулет Сновидений
intro: Амулет Сновидений в игре BSFG — это предмет для безопасной ночной охоты на монстров, который спасает персонажа от смерти при нападении врагов.
image:
  src: assets/guides/dream-amulet.png
  alt: Спящий персонаж под сияющим защитным куполом в окружении монстров ночью.
  width: 500
  height: 300
facts:
- label: Время действия
  text: 00:00–10:00
- label: Зарядка
  text: 5 минут
- label: Заряды защиты
  text: '12'
- label: Нокаут
  text: 5 минут
sections:
- heading: Где получить и где найти
  bullets:
  - 'Предмет можно купить в «Личном кабинете»: «Магазин» → «Пакет услуг “Профессионал”».'
  - Предмет хранится в инвентаре во вкладке «Другое».
- heading: Как работает и активируется
  bullets:
  - 'Время действия. Амулет функционирует исключительно ночью — с 00:00 до 10:00.'
  - 'Зарядка. При включении автоматической охоты в строке усилений появляется иконка зарядки. Зарядка длится 5 минут, после чего персонаж получает 12 зарядов защиты.'
  - 'Перезарядка. Пока у персонажа остаётся хотя бы 1 заряд, повторная зарядка не запускается. Если перезапустить автоохоту, амулет начнёт накапливать силу заново.'
- heading: Расход и сброс зарядов
  bullets:
  - 'Срабатывание защиты. При получении смертельного урона тратится 1 заряд, а персонаж впадает в состояние нокаута на 5 минут и полностью восстанавливает здоровье. В нокауте героя нельзя убить или ограбить. Спустя 5 минут он сам встаёт и продолжает бить монстров.'
  - 'Условия полного сброса. Все накопленные заряды мгновенно сгорают, если персонаж отойдёт от точки активации баффа дальше чем на 4000 единиц, использует телепорт или перемещение, либо если вы отключите автоохоту.'
- heading: Как досрочно выйти из нокаута
  bullets:
  - 'Телепорт в столицу. Зажмите клавишу Alt и кликните левой кнопкой мыши по иконке усиления, чтобы мгновенно перенести персонажа в столицу.'
  - 'Отмена на месте. Отключите автоматическую охоту, чтобы персонаж сразу встал на текущей точке, но при этом все оставшиеся заряды амулета обнулятся.'
sources:
- label: 'Описание механики и иллюстрация: материал сообщества, 16 ноября 2026.'
