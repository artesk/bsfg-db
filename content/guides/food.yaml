title: Еда в BSFG
intro: Обычная еда делится на четыре категории — на атаку, на защиту, на критическую атаку и скорость, а также комплексную. В каждой категории есть пять уровней качества.
facts:
- label: Категории обычной еды
  text: '4'
- label: Качество обычной еды
  text: 5 уровней
- label: Драконья еда
  text: 3 ранга, 12–24 часа
sections:
- heading: Названия и характеристики
  paragraphs:
  - Названия блюд различаются у Империи, Альянса, Доминиона, Орды, Союза и Легиона. Характеристики еды одинаковы для всех этих фракций.
- heading: Еда на атаку
  paragraphs:
  - Повышает переносимый вес, физическую и магическую атаку, силу лечения и восстановление боевого духа (ЦП).
  table:
    columns: [Уровень, Переносимый вес, Физическая и магическая атака, Сила лечения, Восстановление боевого духа]
    rows:
    - ['1-й', '+100%', '+1,5%', '+2%', '+1%']
    - ['2-й', '+200%', '+2,5%', '+4%', '+2%']
    - ['3-й', '+400%', '+3,5%', '+6%', '+3%']
    - ['4-й', '+600%', '+4,5%', '+8%', '+4%']
    - ['5-й', '+800%', '+6%', '+11%', '+5,5%']
- heading: Еда на защиту
  paragraphs:
  - Повышает переносимый вес, физическую и магическую защиту. Защитные бонусы действуют в любой броне.
  table:
    columns: [Уровень, Переносимый вес, Физическая защита, Магическая защита]
    rows:
    - ['1-й', '+100%', '+3%', '+3%']
    - ['2-й', '+200%', '+5%', '+5%']
    - ['3-й', '+400%', '+7%', '+7%']
    - ['4-й', '+600%', '+9%', '+9%']
    - ['5-й', '+800%', '+12%', '+12%']
- heading: Еда на критическую атаку и скорость
  paragraphs:
  - Повышает переносимый вес, силу физического и магического критического удара, а также скорость бега. Бонус скорости действует только в лёгкой броне.
  table:
    columns: [Уровень, Переносимый вес, Сила физического крита, Сила магического крита, Скорость бега в лёгкой броне]
    rows:
    - ['1-й', '+100%', '+1,5%', '+1%', '+3 ед.']
    - ['2-й', '+200%', '+2,5%', '+1,5%', '+5 ед.']
    - ['3-й', '+400%', '+3,5%', '+2%', '+7 ед.']
    - ['4-й', '+600%', '+4,5%', '+2,5%', '+9 ед.']
    - ['5-й', '+800%', '+6%', '+3%', '+12 ед.']
- heading: Комплексная еда
  paragraphs:
  - Объединяет все бонусы трёх предыдущих категорий одного уровня качества и даёт втрое больше переносимого веса. Бонус скорости бега действует только в лёгкой броне.
  - В парных значениях атаки, защиты и силы крита сначала указан физический бонус, затем магический. В колонке лечения и боевого духа сначала указана сила лечения, затем восстановление боевого духа.
  table:
    columns: [Уровень, Переносимый вес, Атака (физ. / маг.), Защита (физ. / маг.), Сила крита (физ. / маг.), Лечение / боевой дух, Скорость в лёгкой броне]
    rows:
    - ['1-й', '+300%', '+1,5% / +1,5%', '+3% / +3%', '+1,5% / +1%', '+2% / +1%', '+3 ед.']
    - ['2-й', '+600%', '+2,5% / +2,5%', '+5% / +5%', '+2,5% / +1,5%', '+4% / +2%', '+5 ед.']
    - ['3-й', '+1200%', '+3,5% / +3,5%', '+7% / +7%', '+3,5% / +2%', '+6% / +3%', '+7 ед.']
    - ['4-й', '+1800%', '+4,5% / +4,5%', '+9% / +9%', '+4,5% / +2,5%', '+8% / +4%', '+9 ед.']
    - ['5-й', '+2400%', '+6% / +6%', '+12% / +12%', '+6% / +3%', '+11% / +5,5%', '+12 ед.']
  note: Значения силы крита, лечения, восстановления боевого духа и скорости для комплексной еды 5-го уровня выведены из правила объединения бонусов трёх категорий. В исходной таблице эти ячейки были пустыми; требуется подтверждение.
- heading: Драконья еда
  paragraphs:
  - Драконья еда — улучшенная еда с повышенными характеристиками, добавленная в октябре 2025 года. Её получают в «Котле» личного домика.
  - В официальном анонсе «Порядок в Хаосе» описаны получение и использование драконьей еды. Точные числовые таблицы её бонусов в этом гайде пока не приведены.
  bullets:
  - 'Качество. Есть три ранга: «Элитная», «Мастер» и «Грандмастер».'
  - 'Требование к экипировке. Для активации требуется надетый пояс соответствующего качества.'
  - 'Длительность эффекта. Базовое время действия усиления — 12 часов.'
  - 'Удвоение длительности. «Серп колдуна» при использовании драконьей еды увеличивает время действия усиления с 12 до 24 часов.'
- heading: Как получить драконью еду
  paragraphs:
  - Драконья еда приобретается в «Котле» личного домика. Для покупки нужны три компонента.
  bullets:
  - Обычная еда — базовый добываемый или создаваемый материал еды.
  - Драконит — его добывают с драконов-боссов, аванпостов драконита и специальных сундуков.
  - Золото.
  note: Количество необходимых драконита и золота зависит от качества выбранной еды — «Элитная», «Мастер» или «Грандмастер».
sources:
