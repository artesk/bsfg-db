title: Форпост
intro: Форпост «Терра Инкогнита» — осадная активность рядом с аванпостом «Креос», на границе с «Терра Инкогнита».
facts:
- label: Дни осады
  text: Пятница, воскресенье
- label: Время
  text: 20:00–21:00 по Москве
- label: Расположение
  text: Рядом с аванпостом «Креос»
sections:
- heading: Захват и защита форпоста
  paragraphs:
  - Форпост захватывается по тем же правилам, что и драконитовый аванпост. Чтобы получить награду за финальное удержание, важно сохранить контроль к окончанию осады.
  - Форпост защищают четыре мортиры. Пока все они не уничтожены, атаковать «Командира форпоста» нельзя.
  - По сторонам форпоста стоят четыре защитные башни. Уничтожение каждой уменьшает запас жизненных сил мортир и облегчает дальнейший штурм.
  - «Командир форпоста» атакует несколько целей одновременно. Его урон зависит от максимального запаса жизненных сил каждой цели.
- heading: Выстрелы мортир и гарнизон
  paragraphs:
  - Мортиры поражают основную цель и несколько целей рядом с ней. Урон зависит от максимального запаса жизненных сил каждой цели.
  - Интервал между выстрелами каждой мортиры определяется отдельно и случайным образом — от 30 до 60 секунд. Следите за каждой мортирой независимо от остальных.
  - При потере мортирой каждых 25% жизненных сил рядом с ней появляются два NPC «Гарнизон». У каждого из них вдвое меньше жизненных сил, чем у хранителя аванпоста.
- heading: Объекты поддержки
  paragraphs:
  - С началом осады появляются «Караван форпоста», «Палатка лекаря» и «Арсенал». За уничтожение объекта бонус получает союз рас, который нанёс последний удар.
  - После уничтожения каждый объект восстанавливается через 10 минут. Это время возрождения объекта; длительность бафов указана отдельно в таблице.
  table:
    columns: [Объект, Эффект, Длительность]
    rows:
    - - Караван форпоста
      - Получаемые жалование и драконит увеличиваются на 35%.
      - 10 минут
    - - Палатка лекаря
      - Полностью восстанавливает жизненные силы, боевой дух и стамину. Повышает PvP-защиту на 15%. Дополнительно восстанавливает мортирам и «Командиру форпоста» 30% жизненных сил.
      - Восстановление — сразу; PvP-защита — 10 минут
    - - Арсенал
      - Повышает PvP-урон на 5% и осадный урон на 50%.
      - 5 минут
  note: Бонус каравана +35% уточнён по подсказке клиента игры.
- heading: Награды
  bullets:
  - За перезахват все находящиеся рядом игроки получают драконит и жалование.
  - За финальное удержание выдаётся повышенная награда по сравнению с обычным драконитовым аванпостом, а также 5 «Монет хроник».
- heading: Перемещение и умения архонта
  paragraphs:
  - Представители расы, владеющей форпостом, и союзной ей расы могут переместиться к нему через меню Alt+B, выбрав форпост в списке аванпостов.
  - На территории форпоста можно использовать все умения архонта, включая «Врата расы» и «Призыв расы», как на обычном аванпосте.
