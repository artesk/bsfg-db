entries:
- id: special-skill-levels
  date: '2026-11-16'
  title: Все пять уровней специальных умений
  changes:
  - Добавлены уровни 2–5 для 148 специальных умений профессий (Ульты)
- id: sibyl-card-parameters
  date: '2026-11-16'
  title: 'Карты Сивиллы: характеристики по уровням'
  changes:
  - Добавлены таблицы характеристик 30 карт Сивиллы для уровней 1–15.
  - Данные во всех новых таблицах отмечены как требующие верификации.
  links:
  - label: Открыть карты Сивиллы
    href: '#/specifications/sibyl-cards'
- id: dream-amulet-guide
  date: '2026-11-16'
  title: Добавлен гайд «Амулет Сновидений»
  changes:
  - 'В разделе «Гайды» появился материал об Амулете Сновидений: где его получить и как использовать для ночной автоохоты.'
  - Описаны время действия, зарядка, расход и сброс зарядов, защита в нокауте и способы досрочного выхода.
  links:
  - label: Читать гайд «Амулет Сновидений»
    href: '#/guides/dream-amulet'
- id: collections-catalog
  date: '2026-11-16'
  title: 'Коллекции: состав, бонусы и цены'
  changes:
  - 'В базе появился раздел со 127 коллекциями: бонусами, составом и количеством необходимых предметов.'
  - Добавлены поиск по названию, предмету или характеристике и фильтр по нужному бонусу.
  - Единый фильтр расы меняет состав во всех коллекциях с расовыми предметами; у каждого предмета есть иконка.
  - Указаны цены покупки коллекций за золото вместо сбора и дополнительные предметы и цены для реликтовых коллекций.
  links:
  - label: Открыть коллекции
    href: '#/collections'
- id: forpost-guide
  date: '2026-11-15'
  title: Добавлен гайд «Форпост»
  changes:
  - 'В разделе «Гайды» появился материал об осаде форпоста «Терра Инкогнита»: расписание, защита, награды и перемещение.'
  - Описаны бонусы каравана, палатки лекаря и арсенала, получение бафов за последний удар и случайный интервал выстрелов каждой мортиры от 30 до 60 секунд.
  links:
  - label: Читать гайд «Форпост»
    href: '#/guides/forpost'
- id: sibyl-card-upgrades
  date: '2026-11-15'
  title: 'Карты Сивиллы: требования и улучшение'
  changes:
  - Добавлена таблица затрат на улучшение карт с 1-го по 9-й уровень.
  - Для всех 15 уровней карт указаны требования к уровню персонажа.
  - Стоимость улучшения карт 10–15-го уровней пока неизвестна и будет дополняться по мере сбора данных.
  links:
  - label: Перейти к картам Сивиллы
    href: '#/specifications/sibyl-cards'
