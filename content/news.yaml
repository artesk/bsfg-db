entries:
- id: client-data-2026-11-18
  date: '2026-11-18'
  title: Обновлены «Круговая оборона», награды за службу и коллекция
  changes:
  - Обновлены описания «Круговой обороны» у 13 профессий и всех семи уровней «Эха». Прежние численные
    эффекты обороны перенесены в архивный раздел карточек.
  - В наградах за военную службу исправлены бонусы скорости атаки и чтения заклинаний на уровнях 14–39.
  - Для коллекции «Каменной Элегии» больше не требуется 50 «Отголосков характера».
  links:
  - label: Профессии
    href: '#/professions'
  - label: Умения Эха
    href: '#/professions/echo'
  - label: Награды за военную службу
    href: '#/specifications/military-service'
  - label: Коллекции
    href: '#/collections'
- id: talent-reference
  date: '2026-11-18'
  title: Все шесть талантов в одном справочнике
  changes:
  - В «Характеристиках» появился раздел «Таланты» с бонусами всех шести талантов с 1-го по 200-й уровень по данным официальной базы BSFG.
  - Можно выбрать любой уровень, открыть полную таблицу и посмотреть умения, которые открываются на 50-м, 100-м и 150-м уровнях.
  links:
  - label: Открыть таланты
    href: '#/specifications/talents'
- id: armor-jewelry-enchantments
  date: '2026-11-18'
  title: Зачарование брони и бижутерии
  changes:
  - В «Характеристиках» появился справочник по чаркам с манускриптов для брони и бижутерии.
  - Можно выбрать слот и уровень, найти нужный бонус по названию и раскрыть его значения по всем доступным уровням. В справочнике указаны пределы пяти качеств манускриптов.
  - На карточках указано, верхнее это свойство или нижнее. По строке подсказки можно отфильтровать бонусы.
  links:
  - label: Открыть зачарование брони и бижутерии
    href: '#/specifications/enchant-armor'
- id: catalog-ux
  date: '2026-11-17'
  title: Удобнее искать и просматривать базу
  changes:
  - На телефонах разделы сайта открываются компактным меню, а обе версии карты собраны в одном пункте.
  - Каталоги запоминают поиск и фильтры на время открытой вкладки. При возврате в список восстанавливается место просмотра, а выбранный ранг сохраняется при смене категории экипировки или оружия.
  - Поиск умений охватывает все разделы профессии и показывает, где найдено каждое совпадение.
  - В каталоге профессий результаты расположены выше, а фильтр классов на телефонах можно раскрыть по необходимости.
  - Описания и характеристики стали крупнее, а кнопки выбора уровня умения удобнее нажимать.
  links:
  - label: Открыть профессии
    href: '#/professions'
  - label: Открыть экипировку
    href: '#/items/equipment'
  - label: Открыть оружие
    href: '#/items/weapons'
- id: client-data-2026-11-17
  date: '2026-11-17'
  title: Обновлены «Подавление», браслеты и защита белья
  changes:
  - 'Обновлены все пять уровней «Подавления» Тирана: бонус своей физической атаки и снижение физической и магической атаки цели составляют 10–25% на 3 секунды с обновлением при попаданиях.'
  - 'Исправлены описания PvP-бонусов инкрустированного браслета уровней 12–20: теперь указаны значения от 3.4% до 5%.'
  - В каталоге экипировки физическая защита 196 предметов белья увеличена на 20.
  links:
  - label: Умения Тирана
    href: '#/professions/tyrant'
  - label: Трофеи боссов
    href: '#/specifications/boss-trophies'
  - label: Каталог экипировки
    href: '#/items/equipment'
- id: food-guide
  date: '2026-11-17'
  title: Добавлен гайд «Еда в BSFG»
  changes:
  - Добавлены таблицы бонусов пяти уровней обычной еды на атаку, защиту, критическую атаку и скорость, а также комплексной еды.
  - Описаны ранги драконьей еды, требования к поясу, получение в личном домике и продление действия с помощью «Серпа колдуна».
  links:
  - label: Читать гайд «Еда в BSFG»
    href: '#/guides/food'
- id: daily-quests-guide
  date: '2026-11-17'
  title: Добавлен гайд «Ежедневные задания»
  changes:
  - В разделе «Гайды» появился материал о восьми ежедневных заданиях с условиями выполнения и наградами.
  - Описаны получение бонусной «Рекомендации делегата» за любые три задания, дополнительные письма и задания территорий, «Билет опыта» и повышенная награда славой на Арене смерти.
  links:
  - label: Читать гайд «Ежедневные задания»
    href: '#/guides/daily-quests'
- id: condemned-island-guide
  date: '2026-11-17'
  title: Добавлен гайд «Остров осужденных»
  changes:
  - 'В разделе «Гайды» появился иллюстрированный материал об Острове осужденных: как попасть на локацию, какие монстры её населяют и что с них выпадает.'
  - Добавлена таблица улучшения ультимативных умений с 1-го по 5-й уровень с требованиями к уровню персонажа и обменом «Процессов» на «Вердикты».
  links:
  - label: Читать гайд «Остров осужденных»
    href: '#/guides/condemned-island'
- id: special-skill-levels
  date: '2026-11-16'
  title: Все пять уровней специальных умений
  changes:
  - Добавлены уровни 2–5 для 148 специальных умений профессий (Ульты)
- id: sibyl-card-parameters
  date: '2026-11-16'
  title: 'Карты Сивиллы: характеристики по уровням'
  changes:
  - Добавлены таблицы характеристик 30 карт Сивиллы для уровней 1–15.
  - Данные во всех новых таблицах отмечены как требующие верификации.
  links:
  - label: Открыть карты Сивиллы
    href: '#/specifications/sibyl-cards'
- id: dream-amulet-guide
  date: '2026-11-16'
  title: Добавлен гайд «Амулет Сновидений»
  changes:
  - 'В разделе «Гайды» появился материал об Амулете Сновидений: где его получить и как использовать для ночной автоохоты.'
  - Описаны время действия, зарядка, расход и сброс зарядов, защита в нокауте и способы досрочного выхода.
  links:
  - label: Читать гайд «Амулет Сновидений»
    href: '#/guides/dream-amulet'
- id: collections-catalog
  date: '2026-11-16'
  title: 'Коллекции: состав, бонусы и цены'
  changes:
  - 'В базе появился раздел со 127 коллекциями: бонусами, составом и количеством необходимых предметов.'
  - Добавлены поиск по названию, предмету или характеристике и фильтр по нужному бонусу.
  - Единый фильтр расы меняет состав во всех коллекциях с расовыми предметами; у каждого предмета есть иконка.
  - Указаны цены покупки коллекций за золото вместо сбора и дополнительные предметы и цены для реликтовых коллекций.
  links:
  - label: Открыть коллекции
    href: '#/collections'
- id: forpost-guide
  date: '2026-11-15'
  title: Добавлен гайд «Форпост»
  changes:
  - 'В разделе «Гайды» появился материал об осаде форпоста «Терра Инкогнита»: расписание, защита, награды и перемещение.'
  - Описаны бонусы каравана, палатки лекаря и арсенала, получение бафов за последний удар и случайный интервал выстрелов каждой мортиры от 30 до 60 секунд.
  links:
  - label: Читать гайд «Форпост»
    href: '#/guides/forpost'
- id: sibyl-card-upgrades
  date: '2026-11-15'
  title: 'Карты Сивиллы: требования и улучшение'
  changes:
  - Добавлена таблица затрат на улучшение карт с 1-го по 9-й уровень.
  - Для всех 15 уровней карт указаны требования к уровню персонажа.
  - Стоимость улучшения карт 10–15-го уровней пока неизвестна и будет дополняться по мере сбора данных.
  links:
  - label: Перейти к картам Сивиллы
    href: '#/specifications/sibyl-cards'
