source:
  data_sha256: 691d0cec4b039491d50a56d6baffcdb62963866a505e4c0a4c30433305b0e1fc
  original_url: https://db.bsfg.online/profession/adept/
profession:
  descriptions:
  - Орден магов воздуха Доминиона зародился в незапамятные времена. Они используют заклинания, направленные
    в основном на уничтожение противника в минимальное короткое время. Все их заклинания так или иначе
    предназначены для нанесения грубых прямых атак магией воздуха, и не отличаются особой хитростью и
    изощрённостью, но при этом весьма эффективны.
  - Маг Темных Эльфов, посвятивший себя ветру. Лишь одно его имя вгоняет страх во врагов. Его мощь сокрушительных
    заклятий сродни порывам ветра, неожиданным, сбивающим с ног. Лишь им одним ведомо заклятие демонического
    ветра, разрывающее плоть потоком воздуха огромной мощи, и передающее часть здоровья, маны и боевого
    духа врага Адепту. Чародеи передали часть своих знаний Адептам, и теперь Адепты способны на короткое
    время защитить свою группу от проклятий и ускоряют чтение собственных заклинаний, а также имеют заклинания,
    позволяющие избавляться от проклятий врага.
