source:
  data_sha256: baf2cccb2a8418d30b884be559a06b64fa9e491c7bdc0b74b80a5acddaed3fd6
  original_url: https://db.bsfg.online/profession/albatross/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Воины, которые, взяв в руки древний меч, способны сокрушить практически любого противника. Хорошо
    защищенные и мощные, но медлительные Альбатросы без страха идут вперед. Оглушая своим большим мечом,
    наносит серию сокрушительных атак, рассекая плоть врагов до костей.
  - Альбатросы — это элита Легиона, его авангард. На ряду с Кондорами, рядом с Драконами, они ведут свою
    расу в бой. Одни из самых крепких воинов Легиона. Обладают невероятной живучестью, даже получая удары,
    Альбатросы становятся все сильнее и сильнее. Этих воинов невозможно остановить, они незамедлительно
    налетают на своего противника и не оставляют ему шанса на спасение. Альбатросы легко могут справиться
    даже с несколькими противниками. При виде мощных крыльев Альбатроса, враги встают в ступор и им остается
    только ждать, когда сокрушительные удары сразят их.
  parser_version: 1.0.0
