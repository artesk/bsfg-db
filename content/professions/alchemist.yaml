source:
  data_sha256: f2f3117ee616d73aadc5f972e6256855cc4a8f4cd605b431265ed8334f460f36
  original_url: https://db.bsfg.online/profession/alchemist/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Школа химиков Союза зародилась в незапамятные времена. В бою они используют взрывные смеси, направленные
    в основном на уничтожение противника в минимальное короткое время. Все их гранаты так или иначе предназначены
    для нанесения грубых прямых атак, и не отличаются особой хитроситью и изощрённостью, но при этом весьма
    эффективны.
  - 'Алхимики возвели технологию взрывов в ранг искусства, и это утверждение не лишено смысла. Результаты
    многих десяток лет исследований дали свои результаты: открыв новый реагент, алхимики получили в свой
    арсенал бомбы огромной мощности, сила которых равна или даже превышает разрушительные заклинания различных
    школ магии, а их Ртутная Бомба на сегодняшний день – самое страшное массовое оружие, которое когда-либо
    было изобретено в этом мире вечной войны. Но и у этого оружия есть свои недостатки: реагент, который
    необходим для взрыва этих бомб очень быстро приходит в негодность, для этого все Лаборанты Союза обеспечены
    комплектами для его смешивания. При использовании этих бомб задача лаборанта – быстро смешать и передать
    реагент алхимику, поэтому для эффективного уничтожения врагов алхимик и лаборант должны работать в
    паре.'
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/alhimik.jpg
