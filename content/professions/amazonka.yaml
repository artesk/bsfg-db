source:
  client_release: 2026.11.06.171000
profession:
  class_id: 6330
  descriptions:
  - Лучница Белатто — Боевое содружество девушек Беллато, известное как Амазонки, — это закрытое для любого
    мужчины братство, а точнее, сестринство, занимающееся охотой как на монстров, так и на людей.
  - 'Амазонка — Долгие годы охоты в опасных лесах и болотах закалили тело и разум, а также научили пользоваться
    уловками и приёмами, которые другие могли бы назвать подлыми, но в дикой природе побеждает самый приспособленный.
    Правда, у такой закалки есть и обратная сторона монеты: даже для сородичей их поведение стало диковатым
    и грубым.'
  parser_version: client-1.0.0
