profession:
  descriptions:
  - После многолетней междоусобной войны, родной мир Белатто был практически уничтожен. Ненависть Белатто
    друг к другу и их уникальная магия привлекли взор древнего зла, таинственной сущности, пожирающей
    целые миры. Поскольку Белатто были разрозненны, им не удалось одолеть эту угрозу. Единственный выход
    был — покинуть свой родной мир. Маги Белатто — Друиды — открыли портал в неизведанный мир, но для
    них это была последняя надежда на спасение. Оказалось, что в их новом доме также не все спокойно и
    в нем идет война между шестью фракциями разных рас, которые увидели в Белатто сильных союзников и
    каждый хотел видеть их в своих рядах. Но даже объединение ради спасения расы не позволило забыть им
    о старом конфликте и Белатто начали присоединяться к другим расам, с которыми у них совпадали цели
    и убеждения. Бойцы Белатто — искусно владеют парными мечами, а легкая броня не сковывает их движения.
    Бойцы Белатто всегда ведут бой вместе со своим преданным питомцем. Питомец всегда готов прикрыть своего
    хозяина и разделить с ним повреждения от атак врагов. Бойцы Белатто способны быстро переместиться
    к врагу и нанести ему мощные удары двумя мечами.
  - Со временем связь между Бойцом Белатто и его питомцем крепнет все сильней. Таких Воинов называют Дрессировщики.
    Опыт дрессировки позволяет им выбирать себе спутника. Каждый из них готов выполнять приказы Дрессировщика
    беспрекословно. Питомцы, чтобы не разочаровать своего хозяина, реагируют на любое его действие. Но
    и Дрессировщик относится к своему питомцу с уважением. В бою они прикрывают друг друга и всячески
    помогают. Вдвоем они очень быстро расправляются со всеми, кто встанет у них на пути.
