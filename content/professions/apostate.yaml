  - entries:
    - branch: one
      description: Отступник достает лук, увеличивая свою скорость бега на 4. При этом Вы сможете пользоваться
        только умениями и магией. Умение *Пинок* будет использоваться на расстоянии и у него сильно сокращен
        откат. Умение *Приговор* будет использоваться на расстоянии, увеличена скорость применения, сокращен
        откат, но немного снижен урон. Умение *Прыжок* будет притягивать противника к Вам, увеличена скорость
        применения и сокращен откат. Умение *Защищенный удар* будет использоваться на расстоянии. Нельзя
        одновременно использовать с умением *Оружие Отступника*.
      effects:
      - kind: value
        text: 'Скорость передвижения (Любая броня): 4ед.'
      - kind: value
        text: 'Дальность атаки: 1000'
