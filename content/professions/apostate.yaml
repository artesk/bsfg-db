source:
  data_sha256: 02f2e70a828c73f0484766807437b97d7b98aa8500bebe09a80bda8568f97fcc
  original_url: https://db.bsfg.online/profession/apostate/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Изменник, отступивший от своих убеждений становится ренегатом. Быстрый и легкий воин вооруженный одноручным
    мечем. хорошо показывает себя как в бою лицом к лицу, так и в погоне за убегающим противником. В бою
    мастерски использует различные уловки для обмана противника.
  - Универсальный легкий воин, легко находит подход к любому противнику. Искусно владеет разными типами
    оружия, но как основу использует одноручный меч, имеет сильные умения, и множество контроля. Отступник
    – хитроумный убийца, который всеми способами избегает контроля противника.
  parser_version: 1.0.0
