source:
  data_sha256: c5d470173e8e57b5b6bb7a652634a779b580197c930404d4b02e4d0bf5dee4ee
  original_url: https://db.bsfg.online/profession/archmage/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Орден магов огня Империи зародился в незапамятные времена. Они используют заклинания, направленные
    в основном на уничтожение противника в минимальное короткое время. Все их заклинания так или иначе
    предназначены для нанесения грубых прямых атак магией огня, и не отличаются особой хитростью и изощрённостью,
    но при этом весьма эффективны.
  - 'Некоторые маги отказались покидать пределы школы магии огня. Они продолжили свои кропотливые труды
    в области изучения стихии Огня, и плоды их работы не заставили себя долго ждать: разрушительная мощь
    огненной стихии значительно превосходила силу старых заклинаний общей школы магии. Так у Империи появились
    очень мощные маги огненной стихии, их стали называть Архимагами. Со временем они вытеснили все остальные
    направления стихийной магии, в том числе и за счёт хорошего взаимодействия на поле боя с рыцарями
    ордена Феникса, заливающими огнём ряды врага и ослабляющие их защиту от огненной стихии.'
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/arhi.jpg
  schema_version: 1
