source:
  data_sha256: 4868c6f300aa7ba3d02136933e65daf0af5567592e347df8267f855c79b03ee2
  original_url: https://db.bsfg.online/profession/arhitector/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Подмастерья — ученики архитекторов. Им ещё рано обучаться искусству создания сложных устройств, на
    этом этапе они обучаются ремеслу изготовления вещей и сбора материалов для этого. Также они проходят
    усиленные тренировки с оружием ближнего боя, не уступая по силе своим собратьям, изучающим боевые
    профессии, но при этом имеют меньшее число приёмов для каждого вида оружия.
  - 'Архитекторы — это профессиональные ремесленники Союза, так их назвали из-за того, что они также занимаются
    строительством домов. Но не всегда им приходится заниматься мирными делами: архитекторы обучены мастерски
    управляться с механизмами, и умеют собирать на поле боя оборонительные и атакующие механизмы. Предметом
    особой гордости архитекторов является осадная пушка и боевая машина, которой архитектор управляет,
    находясь внутри неё.Благодаря изучению техники, архитекторы, также как специалисты и канониры, способны
    быстро и эффективно починить любой механизм прямо на боле боя, а так же могут загрузить в свои пушки
    улучшенные снаряды, что увеличивает их скорострельность и повреждения.'
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/arhitektor.jpg
