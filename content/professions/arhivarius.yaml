profession:
  descriptions:
  - Чтец Белатто — маг Белатто, специализирующийся на нанесении большого урона по врагу. В своем арсенале
    имеет большое количество заклинаний, которые направлены на нанесение урона врагу.
  - Архивариус — Чтецы Белатто посветившие всю жизнь изучению гримуаров о всех смертных грехах, благодаря
    этому научились извлекать пользу из этих знаний. С помощью этих древних архивов способны как усиливать
    себя, там и побеждать противников.
