profession:
  descriptions:
  - Подмастерье — ученик художника. Он обучается как искусству создания вещей и сбора материалов, так
    и искусству боевой магии. Также подмастерья владеют особой магической техникой, которая способна создать
    вокруг него на некоторое время барьер, защищающий их от любых атак и магии.
  - В каждом обществе, в каждой расе, были личности, которые умели быть полезны всем и всегда. В рядах
    Темных Эльфов таких называют художниками. Художники – мастера производства оружия и экипировки для
    воинов Доминиона В битвах художники полезны умением установить Защитный Обелиск, атакующий и способный
    парализовать противников ударами молний. И только художники, благодаря глубокими познаниями магии,
    способны на чудо воскрешения мёртвого.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/hudojnik.jpg
  schema_version: 1
