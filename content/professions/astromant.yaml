source:
  client_release: 2026.11.06.171000
profession:
  class_id: 6334
  descriptions:
  - Заклинатель пустоты — Маги глубокого космоса или заклинатели пустоты, черпающие силу из антиматерии,
    способные управлять законами гравитации и силой звёзд. До недавнего времени об их существовании не
    было известно. Как оказалось, их целью была истинная мощь, что сможет устрашать врагов самим своим
    существованием. По какой-то причине они вышли из тени на всеобщее обозрение.
  - Астромант — Астроманты жаждут продемонстрировать свою силу, а быть может, уже добились своей цели.
    Хотя сами они говорят, что причина в том, что звёзды этого мира удивительны и ни на что не похожи,
    и потому они жаждут показать всем, сколь прекрасны и величественны звёзды над небосводом и сколь смертоносны
    они могут быть в бою.
