profession:
  descriptions:
  - Берсерки — воины, использующие двуручный меч, как свой единственный вид оружия. Их лёгкая броня позволяет
    им быстро сокращать дистанцию до противника и быстро наносить серии мощных ударов, а при необходимости,
    так же быстро отступать.
  - Люди, чьи сердца охватила жажда мести, и разум погрузился во тьму — теряют свое истинное лицо. Они
    становятся жестокими и беспощадными к врагам, воинами, способными одним лишь взглядом вселить ужас
    в души своих противников. Используя двуручный меч и черную пантеру, мстители с легкостью расправляются
    с любым противником. Они принадлежат самим себе, они не способны на сострадание, им неведомо чувство
    жалости, и у них лишь одна цель — месть.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/mstitel.jpg
