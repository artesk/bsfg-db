  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Воин орды — легкий воин Орды, вооруженный двуручным мечом. Владеет различными стилями боя, такими
    как наносить повышенный урон, размашистыми ударами атаковать врагов вокруг себя, атаковать врага с
    невероятной скоростью и даже восстанавливать здоровье своими ударами.
  - Варвар — Варвары неудержимые воины, которые вступив в бой уже не могут остановиться. Чем больше они
    атакуют врага, тем быстрее становятся их атаки. Пронзающий крик этих воинов способен как вселить ужас
    во врагов, так и придать сил своим союзникам. К тому же они могут быстро передвигаться по полю боя
    при помощи прыжков.
