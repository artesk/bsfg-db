source:
  data_sha256: df5c1e3f36565c6ebedff34da364bf4dfef6b3b2754ccb61e427af14d33cc691
  original_url: https://db.bsfg.online/profession/berkut/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Их крепкие перья под час выдерживают даже больший натиск чем стальные доспехи дварфов. Защищаясь магическими
    символами беркуты всегда впереди и всегда на защите своих отрядов.
  - Вояки, достойно проявившие себя на полях брани. Защитники, спасшие не одну жизнь. С символом и острой
    шпагой на перевес они способны стоять в одиночку против десятков воинов. Не всякий сможет пройти сложнейший
    путь и стать Легионером Беркутов, но те кто дошел до него — дойдет до победы.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/berkut.jpg
