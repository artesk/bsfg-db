source:
  data_sha256: 9f6f235f4ec8c3f6ff3269820f22db0ea6ffe274eead066f88dec73b94b23b4d
  original_url: https://db.bsfg.online/profession/berserker/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Бойцы избрали своим оружием парные топоры и молоты, они эффективны в сражениях против одиночных противников,
    но имеют очень ограниченные возможности нанесения урона по площади и контроля противника.
  - Берсерки – неистовые воины союза. Их боевое искусство зародилось в незапамятные времена и долгое время
    оставалось тайной за семью печатями. Среди представителей своей расы их считают безумцами, тем не
    менее, они пользуются большим уважением. Берсерки всегда участвовали во всех крупных битвах, яростно
    уничтожая врагов Союза. Присутствие берсерков на поле боя вселяет во врагов ужас. Тренировки берсерков
    кажутся настоящим безумием. Эти воины балансируют на грани жизни и смерти, впадая в боевую ярость
    и сокрушая врага всей своей мощью, забывая о собственной защите.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/berserker.jpg
