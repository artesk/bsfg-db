profession:
  descriptions:
  - 'Относится к классу лекарей, но обладает уникальной способностью создавать связь с союзником или с
    врагом. Владеет несколькими способами связи: Лечебный и Усиляющий лучи, каждый из которых по разному
    влияет на цель. В зависимости от ситуации Знахари Белатто могут либо повысить выживаемость союзника
    и при этом дополнительно восстанавливать его жизненные силы, либо повысить его атакующие и защитные
    характеристики, оказывая поддержку другими навыками.'
  - Бишопы специализируются на оказании долговременной поддержки своих союзником. Владеют уникальной способностью
    воскрешения, которая позволяет поднимать из мертвых одновременно несколько павших воинов. Способны
    буквально вытащить союзника из пыла битвы или самому переместиться к нему и оказать помощь в нелегком
    сражении. При этом, читая молитву, сдерживать огромный урон врагов.
  parser_version: 1.0.0
