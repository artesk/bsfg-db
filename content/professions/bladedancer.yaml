source:
  data_sha256: 3259dbee001aac585fbd482444bdc9142a292a380c84f79b545fd0e723002a53
  original_url: https://db.bsfg.online/profession/bladedancer/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Боевые танцоры тёмных эльфов обучены мастерству боя с парными клинками. Они сочетают это изящное искусство
    боя с боевыми танцами, ослабляющими врага и усиливающими союзников. Облачённые в лёгкие доспехи, быстро
    вклиниваясь в строй врага в пылу битвы, они способны подорвать силы противников и обеспечить победу
    для великого Доминиона.
  - C рождения они обучались искусству владеть двумя клинками. Они смелы и целеустремленны. Их изящные
    клинки отражают луну в ночном небе, переливаясь серебряным светом. Танцоры смерти бесстрашно мчатся
    в гущу битвы, сметая с пути и рассекая врагов, ломаются щиты, пробиваются доспехи. Их танец смерти
    в гуще сражения подобен ветру, он подхватывает и разжигает огонь в сердцах воинов Доминиона, даруя
    силы дня новой стремительной атаки. Танцы призывают силы, от которых враги каменеют, а особый стиль
    боя позволяет Танцорам Смерти ранить сразу несколько врагов ядовитыми клинками.
