profession:
  descriptions:
  - Помощник — маг банды, который специализируется на нанесении большого магического урона. При помощи
    кандалов способен затруднить передвижение врагов вокруг себя. Может кинуть союзнику спасательный круг,
    тем самым спасти его от печальной учести.
  - ''
