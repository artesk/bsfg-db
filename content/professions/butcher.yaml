source:
  data_sha256: c43b37268b348a0480d948a794b7e6664c58e5bbfd01b06ca2b70adb839db23f
  original_url: https://db.bsfg.online/profession/butcher/
profession:
  descriptions:
  - 'Потрошители Орды обучаются использованию большого кривого ножа, который в Орде называют *когтем*.
    Они использую этого коготь для нанесения мощнейших пронзающих ударов в незащищённые участки брони
    противника, нанося серьёзные повреждения. Потрошителя развивают свою скорость, незаметность и способности
    к уклонению от ударав, пренебрегая тренировками прямой защиты от ударов, это делает их весьма опасными
    в тылу врага: зазевавшийся противник станет лёгкой добычей потрошителя.'
  - Один из самых опасных воинов орды. Он полагается на свой острый тесак и собственную огромную физическую
    мощь и предпочитает использовать самую лёгкую броню, что позволяет ему проводить молниеносные атаки
    в незащищённые места противников и с лёгкостью догонять их. Его массивное тело позволяет выдерживать
    огромный урон, но в то же время не даёт эффективно уклоняться от атак. В бою мясники могут пополнять
    свой запас сил и восстанавливаться за счёт поедания плоти своих противников, как живых, так и павших.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/myasnik.jpg
  schema_version: 1
