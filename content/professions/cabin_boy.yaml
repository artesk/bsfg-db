  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Салага — убийца банды, которому поручают уничтожение противников в тылу врага. Наносит огромный урон,
    особенно по слабозащищенным противникам. Салаги очень ловкие и способны уворачиваться от всех фиксированных
    повреждений.
  - Казалось бы, юнгами обычно называют тех, кто еще не стал пиратом, менее опытных бандитов. Но это обманчивое
    впечатление, сгубившее немало воинов всех рас. Юнгами их называют лишь потому, что они носят не так
    много оружия как пираты, но управляются они с ним, закаленные в бесконечных набегах и грабежах, ничуть
    не хуже. Ловкость, полученная юнгами на кораблях, позволяет им подкратываться к своим целям и наносить
    устрашающие раны. Регулярные прыжки с мачты на мачту натренировали юнг до такого состояния, что даже
    внешне неуклюжий орк прыгает не хуже эльфа. Броня мало что значит против юнги, а особенно отличившиеся
    и богатые носят с собой скорострельный арбалет. Как утверждают выжившие, а их немного, скорость стрельбы
    этого арбалета превосходит любые ожидания, говоря о том, что Черная борода украл у дворфов Союза не
    только свою пистоль. Обезьяна с гра… — последние слова моряка.
