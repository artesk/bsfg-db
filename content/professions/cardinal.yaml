source:
  data_sha256: f379abf434f23a54ffc466825a391198fa2da80ed5f3c2e22e069c4666957029
  original_url: https://db.bsfg.online/profession/cardinal/
profession:
  descriptions:
  - Епископы глубоко изучают не только магию огня, но и прочие магические дисциплины. В их арсенале есть
    немного заклинаний, направленных на уничтожение противника, и масса заклинаний, способных нейтрализовать
    как одного, так и нескольких противников сразу, сделать их слабыми и незащищёнными, заставить заснуть
    или бежать в страхе целый строй, или же сильно отравить и поджечь своего противника.
  - Никогда раннее священная магия не использовалась для уничтожения существ из плоти и крови, но времена
    изменились, и в преддверии великой войны, Имперская гильдия магии создала из лекарей и адептов светлой
    магии новые боевые единицы, и нарекла их кардиналами. Используя знания, приобретенные ими при изучении
    различных школ магии, и специальному обучению в Школе Огня, они сплели и подчинили себе, не только
    светлую сторону магии, но и стихию огня, сплавляя священную магию с огнём воедино. В данный момент,
    каждый кардинал — это страшный противник для любого врага Империи, который может как помочь своим
    союзникам, так сжечь врага в пламени святой инквизиции.
