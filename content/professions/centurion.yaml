source:
  data_sha256: bfb631670c6f215186e702432e09d1335a4817bd5086c49298792cd82bca1f6b
  original_url: https://db.bsfg.online/profession/centurion/
profession:
  descriptions:
  - Воевода — Тяжелые воины Орды, обучившиеся владению сразу двумя типами оружия. На одном уровне умеют
    обращаться с копьем и двуручным молотом. Идущие только вперед, ведущие за собой всю Орду, они не страшатся
    врагов, сколько бы их не было.
  - Центурион — прошедшие суровые тренировки воеводы становятся еще более грозными Центурионами, способные
    одновременно сражаться в несколькими противниками. Обладают повышенными защитными характеристиками
    и мощными массовыми атаками. Имеют повышенную чувствительность к магии лечения и восстановления.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2023/10/centurion.jpg
  schema_version: 1
