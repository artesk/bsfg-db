source:
  data_sha256: 33a68c3a0ed35315658c908c5fceab05f474e1aacb910434462e557b36b9412b
  original_url: https://db.bsfg.online/profession/champion/
profession:
  descriptions:
  - Воины Альянса владеют особой техникой боя двумя кинжалами. Их кинжалы не ищут слабых мест в броне
    противника, мастера кинжалов наделяют их мощью,которая делает кинжалы настолько прочными, что те разрезают
    даже тяжёлые доспехи. Нанося длинные серии таких ударов, они уничтожают противника. Мастера кинжалов
    также владеют особыми стойками, увеличивающими их атаку, либо защиту, и могут заморозить противника
    ледяным выстрелом, выпущенным с помощью кинжалов.
  - Ещё совсем недавно, они жили в горах, на окраине своей страны, закаляя тело и душу, воспитывая волю,
    тренируясь начиная с появления первых солнечных лучей, и не покладая рук до самого заката. Они — воплощение
    чистейшей Эльфийской силы. Чемпионы перемещаются с большой скоростью по полю боя, настигая зазевавшихся
    врагов. Их особые тренировки позволяют быстро восстанавливать здоровье во время бега. Чемпионы не
    обычные бойцы, они – те, кто постиг многие древние искусства ведения боя, они могут использовать силы
    природы, оглушая противников разрядами Силы, либо призвать на помощь стихию воды, замораживая врагов
    и восстанавливая своё здоровье. Они давным-давно забыли о таких словах, как боль, страх, отчаяние
    и поражение. Они сокрушают всё на своём пути, метая оглушающие молнии, и замораживая убегающих врагов.
