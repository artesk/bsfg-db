profession:
  descriptions:
  - Главари — почитаемые за свое мужество и силу орки. Вооруженные двумя молотами и закованные в тяжелую
    броню, главари наставляют на путь истинный и готовят к бою молодых орков. Главари врываются в бой
    с яростными криками, вдохновляющими всю орду. Благодаря огромной силе и потрясающей выносливости способны
    проводить целые серии ужасающих ударов.
  - Самые громадные и сильные орки становятся Вождями, которые в первых рядах ведут в бой Орду. Специализируется
    Вождь на многочисленных умениях поддержки союзников и контроля врагов. В бою предпочитает использовать
    парные топоры и тяжелую броню. Большое количество здоровья, умения восстановления боевого духа в комбинации
    с тяжелой броней делают этого орка очень живучим, врагам придется изрядно попотеть, чтобы уложить
    его.
  parser_version: 1.0.0
