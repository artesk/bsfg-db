profession:
  descriptions:
  - Инженер Союза, специализирующийся на манипуляциях со временем. Обладает уникальными навыками контроля
    противников — остановка времени. Враг, для которого время остановилось, не только не может контролировать
    свое тело, но и для него останавливаются жизненные процессы, т.е жизненные силы и боевой бух не восстанавливаются
    и лечить их бесполезно. Быстрый воин в легкой броне, вооруженный мощным двуручным мечом и способный
    контролировать время — качества, вселяющие ужас в любых противников.
  - Долгое и упорное изучение и познание в области времени сделали Хроноса крайне опасным противником.
    Он способен остановить время не только для конкретного врага, а создавать вокруг себя временной разлом
    и все попавшие в него враги познают силу времени. Способный останавливать время для врагов, Хронос
    научился ускорять его для себя, что позволяет ему очень быстро восстанавливаться прямо посреди боя,
    либо очень быстро оказываться рядом с врагом.
