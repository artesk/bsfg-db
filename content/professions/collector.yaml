profession:
  descriptions:
  - Мастер Белатто — Мастер войны Белатто, использующий двуручный меч. Имеет склонность к сбору различных
    уникальных предметов и реликвий, например таких, как Флейта злоба, позволяющая свести с ума противников
    и спровоцировать их бездомно атаковать. Имеет навыки ювелирного мастерства, что позволяет ему создавать
    камни инкрустации и усиливать свою экипировку.
  - Коллекционер — склонность к сбору уникальных реликвий переросла в настоящую одержимость. В хранилище
    Коллекционера находится целая куча различных артефактов и реликвий, которые обладают к тому же еще
    и уникальными свойствами — делают его неуязвимым, позволяют переместиться в другую точку на поле боя
    или предавая его атакам дополнительную мощь. Даже побеждая врагов, Коллекционер найдет, что можно
    забрать у них в качестве трофея. Имеет навыки торговли, а также его опыт исследования и навыки поиска
    предметов помогают ему быстрее их отыскать.
