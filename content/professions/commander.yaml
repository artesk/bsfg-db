profession:
  descriptions:
  - Военачальник — тяжелые воины Империи, идущие на бой в первых рядах. Мастерски владеют несколькими
    видами оружия и полагается только на свои физические способности.
  - 'Полководец — Военачальники, достигшие уровня Полководца, становятся настоящими лидерами, которые
    ведут свою расу за собой. Увеличивают свои характеристики при большом скоплении союзников. Имеют повышенный
    осадный урон. Однако, любому Полководцу предстоит сделать выбор, с каким оружием они поведут Империю
    в бой: двуручный меч, двуручный молот или копье. В зависимости от этого выбора их стиль боя может
    координально поменяться.'
