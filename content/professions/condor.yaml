source:
  data_sha256: be67e0398771a7d9faed2f6cb35f12cc606f5a18abbff25caea3e8b85335a983
  original_url: https://db.bsfg.online/profession/condor/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Кондоры считают себя братьями Воронов. Вооруженные древним мечом и арбалетом они владеют ими на достойном
    уровне. Способен контролировать свои защитные навыки и наносить огромные повреждения массивными ударами.
  - Бок о бок с собратьями они проходят любые кровавые бойни. Легионера Кондоров невозможно удивить и
    очень легко вывести из себя. Рывок, удар, и цель у ваших ног. Опытный Кондор всегда помнит о том,
    что если противник обратился в бегство, он всегда сможет взорвать ту метку, которой он его отметил…
  parser_version: 1.0.0
