source:
  data_sha256: 15804cccdfcaa50a294a5a1eb86faed5c88d3864ab244c58a0d69279ef622bef
  original_url: https://db.bsfg.online/profession/corshun/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Рядовые Коршунов обычно находятся в тех же отрядах, что и рядовые Сов. Задача коршунов — восстановление
    боевого духа и маны союзников. Главным умением коршунов было и остается назначение меток на союзниках.
    Союзник с меткой получает дополнительные усиления коршуна.
  - Легионер Коршунов начинает использовать все умения связанные с меткой, такие как нанесение урона,
    отравление и проклятие противников. Но вместе с этим коршун остается легионером поддержки. Для этого
    у него есть усиливающие и защищающие умения, которые могут выручить союзников не хуже, чем умения
    легионеров Сов.
