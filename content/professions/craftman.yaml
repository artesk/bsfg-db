profession:
  descriptions:
  - Подмастерье — ученик ремесленника. Он обучается как искусству создания вещей и сбора материалов, так
    и боевому искусству владения двуручным молотом. Подмастерье использует лёгкую броня, что даёт ему
    преимущество в скорости, и любой, до кого он сможет добраться, будет оглушён ударом его молота. Подмастерье
    также владеет навыками, полученными в ходе охоты, которые делают его более быстрым и ловким.
  - Ремесленники — мастера на все руки. Именно они снабжают Империю оружием и обмундированием.Смастерить
    сбалансированный лук, выковать качественную кирасу,или изготовить прекрасное ювелирное изделие, это
    всё работа ремесленника. Однако, застать ремесленника, раздувающего меха кузницы или корпеющего над
    станком можно далеко не всегда. Довольно часто они сопровождают армию Империи в её походах. Находясь
    на передовой,эти верные подданные Императора способны установить особый оборонительный кристалл, атакующий
    врагов,осмелившихся подойти слишком близко и излечивающий раны слуг Императора. Основным орудием труда
    ремесленников является кузнечный молот, в следствие чего они неплохо обращаются с оглушающим оружием,
    и могу оказать сопротивление врагу, посчитавшего этого воина слишком слабой целью. И пусть враги ремесленника
    почувствуют на себе то, что чувствует наковальня под мощными ударами кузнеца!
