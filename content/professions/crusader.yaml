source:
  data_sha256: 1113095691145f88e80fbce03bc383493fd33b0de5ddf635a9d2e73ee3a09688
  original_url: https://db.bsfg.online/profession/crusader/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Оруженосцы Империи с детства обучались военному делу и подвергались тяжелым тренировкам. Облаченные
    в тяжелые доспехи и щитом, а к тому же с молотом в руках, они всегда идут в бой впереди всех и способны
    сдерживать огромный урон противников, провоцируя их на атаку.
  - Оруженосцы, которые прошли множество битв и обладающие огромным опытом вести сражения могут стать
    Крестоносцами. Крестоносцы буквально пропитаны сражениями и обладают уникальными способностями, которые
    позволяют ему защищать своих союзников от атак врагов, а при необходимости даже спасать их от смерти.
    Авангард Империи, который ведет всех за собой только вперед.
  parser_version: 1.0.0
