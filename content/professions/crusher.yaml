profession:
  descriptions:
  - Безумец — мастер войны Союза, использующий для атак пару молотов. Предпочитает полагаться только на
    свою собственную силу, из-за чего не имеет атакующих умений, но располагает навыками ослабления и
    контроля врагов.
  - Крушитель — игнорируя стамину врагов наносят им урон своими атаками, сокращая быстро расстояние до
    врага Крушители врываются в самую гущу сражения и мощными критическими атаками отправляют врагов либо
    в бегство, либо на тот свет.
