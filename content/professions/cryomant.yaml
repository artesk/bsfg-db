source:
  data_sha256: 23af27087c647ba69f4b7db22d9242f4d184aafc652c0d14331e808c99c5c821
  original_url: https://db.bsfg.online/profession/cryomant/
profession:
  descriptions:
  - Несмотря на то, что Ледяной мечник одет в робу, он является тяжелым воином Альянса. Овладев магией
    холода мечник способен не только наносить большой урон, но и всячески портить жизнь своим врагам.
    Также он может похвастаться своей скоростью, что позволяет ему достаточно быстро перемещаться по полю
    боя. Вооруженный двуручным мечом Ледяной мечник способен наносить огромный урон по очень большой площади
    и по большому количеству врагов.
  - Криомант — это Ледяной мечник, который овладел магией льда и двуручным мечом в совершенстве. Теперь
    его знаний хватает применять свою магию для защиты, а атакующие способности становятся еще опасней.
    Способный призвать целую Комету и при помощи Скольжения быстро переместиться к врагу Криомант наносит
    огромный урон большому количеству противников вокруг себя. Каждым ударом заряжая свой меч силой холода
    он наносит все больше и больше урона. А убивая своих врагов он способен заморозить все вокруг его
    трупа и также добить следующего врага, попавшего в эту ледяную ловушку.
