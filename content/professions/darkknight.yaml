source:
  data_sha256: d7ffb754dc2f0d9322fa55727ce0016842feb97b71791b0b524e3618f58e83f2
  original_url: https://db.bsfg.online/profession/darkknight/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Эти воины избрали для себя путь защитника, того, кто стоит в первых рядах в атаке, и прикрывает спины
    своих союзников при отступлении. Экипированные тяжёлой броней и щитом, они обучены особому мастерству
    защиты, которое позволяет им с лёгкостью отражать атаки с помощью щита, и легко переносят вред, причиняемый
    даже самыми сокрушительными заклинаниями. Это единственные воины, способные использовать свой щит,
    как оружие, но при этом они вынуждены использовать одноручное оружие, поэтому их атакующий потенциал
    меньше, чем у других воинов.
  - Мрачные рыцари тёмных эльфов, облаченные в металлические доспехи, которые часто украшены устрашающими
    шипами, всегда выступают в авангарде войск Доминиона, для того, чтобы принять на себя основной удар
    сил противника, и внести замешательство во вражеские ряды. Помимо натренированного тела и крепкой
    брони, отлично защищающей от оружия и когтей животных, и воины имеют некоторые познания в темной магии.
    Тёмные рыцари способны внушать страх одним лишь своим видом, но для того, что бы вселить в чужих солдат
    истинный ужас и панику им приходится прибегнуть к волшебству.
