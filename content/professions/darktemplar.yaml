source:
  data_sha256: 8fca65adf756643d33317c70aec0bcad2961373803f26e22ea3c9b2f5f432026
  original_url: https://db.bsfg.online/profession/darktemplar/
profession:
  descriptions:
  - Мастера клинков — это воины в тяжёлых доспехах, которые могут одинаково хорошо использовать как двуручные
    мечи, так и парные. Их атаки всегда очень сильны и отличаются большой точностью, в сражении лицом
    к лицу мало кто сможет устоять против такого противника, который сочетает в себе хорошую защиту от
    ударов и большую атакующую мощь.
  - Мастера меча — воины Доминиона, использующие двуручный меч для нанесения мощных атак по своим противникам.
    Легкая броня позволяет им быстро приближаться к врагам для атаки, либо отступить в сложных ситуациях.
    Мастера меча обучались не только прямым мощным атакам противников в лоб, но и как нанести смертельные
    удары ничего не подозревающему врагу. Способные становиться абсолютно незримыми, они ждут свою жертву
    в сумраке, либо напротив избегают нежеланных гостей.
