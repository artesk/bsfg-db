  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Колдуны глубоко изучают не только магию воздуха, но и прочие магические дисциплины. В их арсенале
    есть немного заклинаний, направленных на уничтожение противника, и масса заклинаний, способных нейтрализовать
    как одного, так и нескольких противников сразу, сделать их слабыми и незащищёнными, заставить заснуть
    или бежать в страхе целый строй, или же сильно отравить и заставить гнить плоть своего противника.
  - Чернокнижники – выходцы из подземной школы тёмной магии, если кто-то и знает, что такое тьма – то
    это они. Досконально изучив природу тёмной магии и вооруженные зловещими метлами, они способны произносить
    заклинания и проклятия с названиями, само сочетание букв которых уже есть сила. Отравить, испугать,
    усыпить, наконец, просто и вульгарно убить — все это могут сделать чернокнижники. И горе тем, кто
    назовет их книжными червями — очень сложно сбежать от настигающего тебя на метле чернокнижника, способного
    передвигаться быстрее иных лошадей. А что до их увлечения книгами — поглощение ради себя — вот главная
    их цель, и после изучения библиотек чернокнижниками, на их полках остается лишь пыль и редкие обрывки
    страниц.
