source:
  data_sha256: bc8af0171be02bc5ab077619fbdb161741eedbd74d540be985dc99d499ed7a91
  original_url: https://db.bsfg.online/profession/de_priest/
profession:
  descriptions:
  - Лекари — воины поддержки. Они исцеляют раны воинов, которые те поучают в сражении, снимают проклятия,
    устраняют яды, а также накладывают заклинания, увеличивающие силы воинов. Они — те, без кого ведение
    войны было бы просто невозможным, либо на войне всегда было бы столько потерь, что вскоре некому стало
    бы воевать. Лекари также имеют определённый набор дисциплин для самообороны, чтобы суметь противостоять
    врагу, если тот застигнет его врасплох.
  - Несмотря на сущность своего народа, не все маги темных эльфов, пошли по пути разрушения. Среди них
    нашлись те, кто решил поддерживать и исцелять своих братьев в баталиях. Жрецы – маги способные не
    только за секунды поднять физические способности своего отряда или исцелить его, но и ослабить членов
    вражеской армии. Они отлично защищены от атак с помощью особого умения ухода в тени, где противники
    не могут их достать, а скорость их перемещения увеличена, а умение телепортироваться и излечивать
    своих союзников вызывает большое уважение в рядах Доминиона.
