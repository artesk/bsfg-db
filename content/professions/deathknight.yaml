source:
  data_sha256: 4621313eee0ba9bce40c554d00826b84eb88db7237edc459bb27d25471a35a16
  original_url: https://db.bsfg.online/profession/deathknight/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Облаченные в тяжелые доспехи воины тьмы несут смерть своим противникам. Пренебрегая болью и по локоть
    в крови они темными клинками прорезают себе путь по трупам врагов. Каждый удар рыцаря смерти калечит
    своих врагов вызывая ужасные раны и горе тем, кто встретит их в бою.
  - Темный воин вооруженный парой острых мечей. Облачен в тяжелые нечестивые доспехи, обездвиживающие
    атаковавших его врагов. Мастерски использует сильные кратковременные усиления, позволяющие сделать
    его атаки быстрыми, а умения еще более смертоносными. Изо дня в день падшие совершенствуют свое мастерство
    владения проклятыми мечами, что бы с легкостью косить своих врагов. В решающий момент способны призвать
    ужасающий двуручный меч. Да начнется жатва!
  parser_version: 1.0.0
