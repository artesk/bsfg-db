source:
  data_sha256: 3a79a9fd6091de087c7ae04980064e98d39af049b47ed9ba74ed370ac234e3f6
  original_url: https://db.bsfg.online/profession/demonolog/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Воины Альянса, которые освоили владение одноручным мечом в совершенстве. Первые светлые эльфы, которые
    пошли по темному пути, пути использования темной магии. Используя в своем арсенале боевые книги, Экзорцисты
    преобретают знания, которые помогаю им либо сокрушить противника максимально быстро, либо защититься
    от их атак. Их знаний достаточно не только для того, чтобы проклинать противников, нанося при этом
    огромный урон, но и для снятия проклятий с себя и союзников. Знания темной магии позволяют Экзорцисту
    отправлять его врагов в астральный мир, ослабляя их физические способности. Являясь хорошо защищенными
    бойцами, они очень опасные противники как в ближнему бою, так и на расстоянии.
  - Демонологи посвятили жизнь поиску и убийству демонов в этом мире. Проводя в путишествиях и боях с
    демонами не один год, они освоили некоторые приемы своих заклятых врагов, с помощью которых они могут
    увеличивать свои защитные и атакующие способности. Знание ментальной основы мира, которой их обучали
    для борьбы, Демонологи способны быстро перемещаться из одной точки в другую. Также эти знания помогают
    им поддерживать связь с миром усопших и души умерших помогают Демонологам с борьбе со злом. Со временем
    демонов становилось все меньше и меньше… Демонологи продолжали свой поход, но постепенно долгие поиски
    и отсутствие в родных краях сводило их с ума. Демонов они встречали все реже и им мерещилась демоническая
    сущность практически во всех кто им попадался на пути. Поскольку в каждом можно найти какую-то долю
    зла, используя темную магию, Демонологи могут проявить эту демоническую сущность в каждом своем противнике,
    превращая их в исчадий подземного мира.
