profession:
  descriptions:
  - Варвары — безжалостные воины в тяжёлых доспехах, предпочитающие в качестве оружия двуручные топоры
    или молоты. Они используют их, чтобы повреждать всех врагов вокруг себя или оглушать их. Жажда битвы
    Варваров воодушевляет их союзников сражаться ещё яростнее и поднимает боевой дух.
  - Эти воины по праву зовутся Деспотами. Как и все орки, они особо остро чувствуют природу, но, в отличие
    от многих, избрали источником своих сил почву. Сотрясая землю, они вздымают в воздух её частицы. Разнообразные
    разломы, освоенные Деспотами, вызывают различную магическую пыль. Один из видов залепляет неприятелям
    глаза, не позволяя наносить наиболее опасные удары; другой — затрудняет дыхание, мешая прочтению заклинаний;
    третий – дурманит голову, делая противников восприимчивыми к оглушающим ударам. Частицы тверди въедаются
    в кожу, ослабляя врагов Орды и разъедая их плоть. Предпочитающие тяжелую броню и двуручные молоты
    Деспоты могут запросто ворваться в толпу неприятелей и быстро *пустить пыль в глаза*, однако после
    этого им лучше поскорее отступить на исходные позиции, так как, не смотря на недюжинное здоровье,
    под шквалом вражеских ударов они вряд ли смогут долго выстоять.
