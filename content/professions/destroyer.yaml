profession:
  descriptions:
  - Воины копья — это лёгкая пехота, быстрая и опасная. Застигая врага врасплох, даже один воин сможет
    задержать и оттеснить врага назад. Многие приёмы воинов копья способны поражать сразу нескольких врагов,
    повреждая и оглушая их, а умение метать копья не позволит врагам сбежать.
  - Что такое война? Это, в первую очередь, разрушение и смерть. Отборные элитные воины Орды тренируются
    исключительно по этому принципу. Ужасное понятие Разрушение для них превратилось в смысл существования.
    Работая тяжелыми копьями и алебардами, Разрушители ломают любые вражеские ряды и способны отправить
    в мир иной сразу нескольких неудачников всего одним сильным ударом. Лишь немногим удается выжить в
    схватке с Разрушителями, но тем, кому так сильно повезло, на всю жизнь запомнятся душераздирающие
    боевые кличи несущих разрушение.
