source:
  data_sha256: 67eb7f1244da3227ada05f46c9a464567f57948949e1bbbe378390c716c6528d
  original_url: https://db.bsfg.online/profession/deversant/
profession:
  descriptions:
  - Союз долгое время не имел стрелков, поскольку их комплекция не позволяла эффективно стрелять из лука,
    но Союз пошёл своим путём и разработали свое оружие дальнего боя — ружья. Воины Союза изучают все
    возможные уязвимости в броне противника и используют их, дополняя свою атакующую мощь использованием
    различных бомб, ослабляющих врагов. Всё это делает Мастеров Ружья достойными противниками.
  - Искусство владения оружием дальнего боя всегда давалось Союзу с большим трудом из-за физических характеристик
    бойцов этой расы, но они призвали к себе на службу технологии, компенсируя свои недостатки отличным
    знанием слабых точек в защите врагов и использованием особых технологичных боеприпасов. Диверсанты
    также отлично знают все слабые точки в защитных сооружениях врага, и при некоторой удаче способны
    с одного выстрела уничтожать их. Они обладают способностью найти слабое место в броне врага, и ещё
    больше ослабить его защиту, разрушая броню в незащищённой точке. Также диверсанты используют бронебойные
    патроны, которые наносят мощные раны врагу и особые патроны с поджигающими и оглушающими зарядами.
