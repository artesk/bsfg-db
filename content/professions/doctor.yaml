profession:
  descriptions:
  - Санитары — воины поддержки. Они лечат раны воинов, которые те поучают в сражении, нейтрализуют эффекты
    проклятий, устраняют яды, а также используют медикаменты, увеличивающие силы воинов. Они — те, без
    кого ведение войны было бы просто невозможным, либо на войне всегда было бы столько потерь, что вскоре
    некому стало бы воевать. Лекари также имеют определённый набор гранат и смесей для самообороны, чтобы
    суметь противостоять врагу, если тот застигнет его врасплох.
  - Познания в химии использовались дварфами не только для создания смертоносных ядов, паралитических
    газов и взрывчатых смесей. Добытые алхимиками ингредиенты исследовались особой кастой общества дварфов
    — докторами, — и в результате стали применяться в качестве лекарственных препаратов. Только Доктор
    точно знает, в каких количествах можно принимать медикаменты, и потому в боевом отряде он незаменим.
    С помощью снадобий, он может быстро исцелить и излечить от болезни раненого дварфа. Особые пилюли,
    выданные Доктором перед боем, придают бойцам небывалую бодрость и стойкость.
