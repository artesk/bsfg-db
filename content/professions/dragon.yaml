profession:
  descriptions:
  - 'Главное правило новобранцев драконов: силен не тот кто бьет, а тот кто выдержит удар. Поэтому они
    обучаются ремеслу отражения атак противников. Также в арсенале Драконов есть множество способов заставить
    противника сойти с ума, нападая на все что движется.'
  - Получив все необходимые навыки в контроле над свои телом и выносливости новобранцы драконов отправляются
    в хромовые горы, где обучаются магическому превращению в огнедышащих драконов. Дракон — символ стойкости
    и веры для любого воина Легиона, поэтому только избранные доводят искусство огня до совершенства.
