  client_release: 2026.11.06.171000
profession:
  descriptions:
  - С двумя шпагами и огромным боевым потенциалом, новичок Орлов каждую минуту способен избирать новую
    тактику. Этот воистину многогранный боец способен противостоять как магам, так и бойцам в равной степени.
  - Подобно алмазу обработанному ювелиром — новичек Орлов становиться Легионером и каждая его грань только
    улучшается со временем. Ему известны все возможности парирования, а удары его окровавленными шпагами
    заставят противника сожалеть о начавшемся бое.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/orel.jpg
  schema_version: 1
