source:
  client_release: 2026.11.06.171000
profession:
  class_id: 6328
  descriptions:
  - Лучник Белатто — Парадоксально, но лучник Эхо больше полагается на свой слух, нежели на зрение. Некоторые
    Эхо даже ослепляют себя, дабы обострить чувства до предела. Тайны этой профессии передаются в очень
    закрытых сообществах, из-за чего изначальное происхождение неизвестно и остались лишь слухи. В бою
    используют короткий лук, который позволяет наносит быстрые звуковые атаки.
  - Эхо — Некогда существовала группа наёмников, игравших на инструментах в свободное от боёв время и
    до того отточивших слух, что их начали сторониться даже союзники, ведь не было места, где их бы не
    уловил чуткий слух наёмников. Как следствие, гробовая тишина, всюду следовавшая за Эхо, стала самым
    тяжёлым испытанием для бывших музыкантов. Теперь для них существует только одна музыка — музыка битвы.
