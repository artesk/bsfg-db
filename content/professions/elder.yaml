profession:
  descriptions:
  - Боевые маги Орды. Хранители древних знаний школы магии земли. Самые мудрые представители расы орков,
    которые используют в качестве оружия жезлы и боевые книги. Способны взывать к духам предков, устанавливая
    на поле боя тотем в их честь, усиливая себя и своих союзников. Очень опасные противники на дальнем
    расстоянии, но и близко к ним лучше не приближаться, так как они способны наносить быстрые разрушительные
    атаки ближним врагам.
  - Не кто не сомневается в мудрости и силе Старейшин. Эти маги, как ни кто другой, умеют использовать
    силу земли, что позволяет им без труда обрушивать всю мощь магии на своих врагов. Сама земля помогает
    им на поле боя, из-за чего врагам крайне тяжело подобраться к Старейшине. Окутывая ноги врагов корнями
    или превращая почву в зыбучие пески, Старейшина наносит разрушительные удары. Магия земли помогает
    Старейшине избавиться от любых проклятий и даже стать абсолютно бессмертным. Не кому не следует недооценивать
    этого мага.
