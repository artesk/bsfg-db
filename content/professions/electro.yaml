profession:
  descriptions:
  - Гильдия наёмников союза в давние времена создала искусство боя на острых как бритва небольших топорах,
    созданных особым способом. Такие топоры способны прорезать даже тяжёлый доспех, нанося сильные порезы
    его владельцу. Наёмники используют только лёгкие доспехи и обучаются ремеслу быстрого убийства и скрытности,
    пренебрегая защитными тренировками. Не позавидуешь магу, который будет иметь неосторожность подпустить
    к себе наёмника, он врядли проживёт дольше нескольких секунд, после чего наёмнику скорее всего удастся
    уйти безнаказанным. Наёмники, которые зашли далеко в своём ремесле, могут быть приняты в особую гильдию,
    и постичь там тайны молний.
  - Электро – так называют в рядах Союза тех, кто посвятил свою жизнь изучению и использованию электричества,
    и превратил его в мощное оружие. Электро используют механизмы, вырабатывающие, накапливающие и использующие
    электричество для ведения боя. Их броня и топоры соединены воедино с электромеханизмом. Эти технологии
    позволяют усиливать боевые характеристики воина, а также поражать противников разрядами, пропуская
    их через лезвия своих топоров.
