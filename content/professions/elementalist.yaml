source:
  data_sha256: 6c621fbc526cb3daaa78da2b149bfa6fa0531f061545c674d067d2f0f1be9865
  original_url: https://db.bsfg.online/profession/elementalist/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Орден магов воды Альянса зародился в незапамятные времена. Они используют заклинания, направленные
    в основном на уничтожение противника в минимальное короткое время. Все их заклинания так или иначе
    предназначены для нанесения грубых прямых атак магией воды, и не отличаются особой хитростью и изощрённостью,
    но при этом весьма эффективны.
  - Элементалисты посвятили свою жизнь изучению различных стихий магии, они проникли в тайны стихий, подвластных
    другим расам, и поставили их себе на службу. Атаки их элементов разрушительны и передают часть своей
    силы магу, значительно усиливая его, а сам элементалист получает меньше повреждений от атак стихиями
    земли, воды, воздуха и ветра. Сплавляя элементы воедино, элементалист способен прочитать заклинание
    огромной мощности, и уничтожить им своего противника.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/elementalist.jpg
