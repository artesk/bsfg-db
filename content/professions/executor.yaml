source:
  data_sha256: 79ab0d12b024b82ddf37ad0c2ec223e3ac64715da968b50cb953245397c1e411
  original_url: https://db.bsfg.online/profession/executor/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Мечники — это тяжёлая пехота, использующая двуручные мечи, как своё основное оружие. Их атаки всегда
    очень сильны и отличаются большой точностью, в сражении лицом к лицу мало кто сможет устоять против
    такого противника, который сочетает в себе хорошую защиту от ударов и большую атакующую мощь.
  - Эти воины сеют на поле боя смерть, а в сердцах неприятеля – ужас. Обрушивая свои яростные удары на
    врагов Орды, они прорубают себе путь сквозь вражьи ряды, не щадя никого. Палачи – непревзойдённые
    мастера ближнего боя, которые не нуждаются в помощи магии и хитрых уловок, побеждая врагов своей силой
    и умением, защищённые тяжёлыми доспехами. Двуручный меч – их излюбленное оружие, несущее великую силу
    разрушения в руках настоящего мастера.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/palach.jpg
