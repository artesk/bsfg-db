source:
  data_sha256: 71d2519b158c66351169d29e0baa30d8973b563de52367243d546b0547a041b7
  original_url: https://db.bsfg.online/profession/expert/
profession:
  descriptions:
  - Академики обучены базовым приёмам лечения, но больше специализируются на работе с взрывчаткой и прочими
    смесями. Они способны усилить способности специалистов по взрывчатке в своём отряде, увеличивая их
    атакующую мощь и скорость использования смесей. Они могут быстро восстанавливать запасы маны и боевой
    дух своей группы, и в случае необходимости открывать портал в столицу с помощью особого механизма
    для экстренного отступления. В отличие от санитаров, их боевой потенциал несколько выше, поэтому академики
    могут причинить противнику ощутимый ущерб, если тот недооценит их.
  - Эксперты — это особый класс специалистов, которые обучались как в школе докторов, так и в школе алхимиков
    и техников. Благодаря своим знаниям в этих областях, они одновременно могут быть и грозными метателями
    гранат, и неплохими лекарями. Эксперты хорошо изучили взрывы и технику метания гранат, они способны
    ощутимо улучшить повреждения и скорость бросков гранат, как собственную, так и у своей группы. Они
    также разработали технологию, которая позволяет долгое время хранить особые взрывные смеси, которые
    используют алхимики, и могут снабжать их ими при необходимости, затрачивая на это минимум своего времени,
    единственным минусом является то, что смеси при хранении теряют часть своей разрушительной силы, и
    менее эффективны, чем у лаборната.
