  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Легкий, маневренный боец, вооруженный арбалетом для стрельбы на дальних расстояниях и шпагой для ведения
    ближних боев.
  - Опытный Сокол стреляет не хуже любого лучника, его способности всегда держаться на расстоянии и убивать
    противников поражают. Чем раньше Сокол увидел противника, тем меньше его шансы на выживание. Ни одна
    битва не обходиться без участия этих быстрых и смертоносных Легионеров.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/sokol.jpg
