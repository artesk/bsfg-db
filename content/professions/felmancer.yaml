profession:
  descriptions:
  - Заклинатель тьмы — маг Доминиона, специализирующийся на нанесении большого точечного урона по врагу,
    используя магию тьмы.
  - Сквернамант — посветив себя в изучение углубленной школы магии тьмы, Сквернамант превзошел всех известных
    магов в этой сфере. Обширные познания в магии тьмы делают его очень опасным противником, способный
    за несколько мгновений превратить поле боя в безжизненную пустошь.
  parser_version: 1.0.0
