profession:
  descriptions:
  - Используя боевой посох и стихию воздушных потоков рядовые финисты оттачивают свои умения с каждым
    примененным заклинанием усиливая свою магическую силу. Вся жизнь рядового финиста сосредоточена в
    поисках и приручении своей птицы Финиста.
  - Те рядовые, что смогли найти и приручить птицу Финист становятся легионерами. Для них открываются
    новые способности разрушения. Совместно с Финистом легионер обрушивает во врагов шквал магических
    ударов, а если дела на поле боя стали ухудшаться легионер может защитить свою птицу и отступить при
    этом не теряя концентрации на противнике.
