source:
  data_sha256: f7ec77d0cbd58685a7c863b54493e192a2d1376112f82e63b4a3a767c8c569f4
  original_url: https://db.bsfg.online/profession/flibuster/
profession:
  descriptions:
  - Вышибала — мастер войны, специализирующийся на истреблении групп врагов. Одетый в легкую броню и имея
    навык быстрого перемещения к цели делает его быстрым и опасным противником. А используя парное оружие
    позволяет ему наносить молниеносные удары по своим противникам.
  - Флибустьер — более защищенный и живучий Вышибала. Его атаки становятся еще мощнее, а тактика ведения
    боя еще хитрее. Чувствуя, что он проигрывает бой способен избежать смерти, притворяясь мертвым. Его
    атаки могут быть на столько сильными, что противник даже не сможет излечиться от таких ран. Одним
    своим присутствием на поле боя он заставляет врагов вокруг терять боевой дух.
  parser_version: 1.0.0
