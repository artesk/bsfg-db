profession:
  descriptions:
  - Лучник Империи, который все свое свободное время учился обращению с оружием дальнего боя. Обладают
    высокой регенерацией от природы. Способны наносить большое количество выстрелов за короткий промежуток
    времени.
  - Гамбит — это стрелок, который не тратил свое время на овладение ненужными на его взгляд навыки и тратил
    все время на совершенствование своих навыком обращения с луком.
