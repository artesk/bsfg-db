source:
  data_sha256: 53bdc923086a871b1cb081c062140a163bdb6afa6f440fcdc82f9c87b53acebb
  original_url: https://db.bsfg.online/profession/ghost/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Кинжальщики Доминиона — тихие, бесшумные убийцы. Засады в неожиданные местах, удары в спину, обворовывание
    поверженных противников — всё это ремесло кинжальщиков. Только они могут незаметно пробраться в тыл
    противника, и незаметно убить опасного мага или лучника на позиции, и так же бесшумно и быстро исчезнуть
    до прибытия подкреплений, ослабляя вражеские ряды с тыла.
  - Воины – призраки, великолепные мастера кинжала, специально тренированные для борьбы с вражескими магами.
    Их тела отражают проклятья, одним прикосновением кинжала они способны уничтожить всю ментальную энергию
    противника, а высокая скорость передвижения не оставит даже небольшой группе вражеских колдунов шанса
    на выживание.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/prizrak.jpg
