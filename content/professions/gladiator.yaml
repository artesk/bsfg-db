source:
  data_sha256: 652e55024b2fe5a8619a15b46bee07b0a66ead0599fc7382d55a7e0cdc3fd18d
  original_url: https://db.bsfg.online/profession/gladiator/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Дуэлисты, бывшие бойцы арены — это воины в лёгких доспехах, быстрые и ловкие. В качестве оружия они
    предпочитают использовать парные мечи. В особой школе дуэлистов их обучают особому умению заставлять
    свои клинки вибрировать, усиливая урон, который наносят их приёмы врагу, и даже атаковать врагов на
    расстоянии или вокруг себя. Вспоследствии такие воины часто становятся Гладиаторами.
  - Искусство владения сдвоенными мечами передается от отца к сыну. Постигшие эту тайну, способны наносить
    большой урон, используя парные мечи. И не только в ближнем бою, но и на расстоянии. Помимо физического
    развития, они постигают и духовные тайны. Концентрируя свою силу в клинках, они могут обрушить её
    на противников. Применяемые ими серии ударов требуют большой подвижности, поэтому в бой они вступают
    в лёгкой броне.
