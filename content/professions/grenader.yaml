profession:
  descriptions:
  - С развитием технологий у Союза росло и количество воинов, обладающих специфичными навыками. Солдаты
    — это лёгкие воины Союза, вооруженные огнестрельным оружием и ведущие бой на средней дистанции. Выстрелы
    из ружья требуют перезарядку, что делает технику боя Солдата уникальной. Солдаты способны быстро ворваться
    на поле боя, нанеся при этом урон противникам вокруг, и нанести огромный урон из подствольника своего
    ружья.В арсенале Солдата имеются гранаты, одни из которых наносят урон противникам, а другие оглушают
    врагов.
  - Гренадеры прошли такое количеств битв и принимали участи во стольких войнах, что не кто уже и не вспомнит
    их число… Атакуя на средней дистанции они наносят большой урон врагу, но и во время перезарядки они
    могут дать отпор и использовать штык-нож для атаки в ближнем бою. Изучая оружейное дело они способны
    улучшать свое ружье. В сложных ситуациях у Гренадера есть козырь — обойма с большим количеством патронов,
    которая позволит ему стрелять без перезарядки. Гренадеры отлично ориентируются на местности, что позволяет
    им выслеживать своих врагов. Гренадер обладает навыками оказания первой помощи и способен залечивать
    свои раны.
