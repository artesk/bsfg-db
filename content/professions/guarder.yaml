profession:
  descriptions:
  - Воины хирда — это тяжёлая пехота, оснащённая копьями. Когда хирд движется вперёд, именно они разбивают
    построение врага и оттесняют его назад. Точность их атак очень высока, а приёмы позволяют повреждать
    и оглушать сразу нескольких противников сразу, разрушая их наступление и сохраняя хирд.
  - Стражи – единственные бойцы союза, использующие копья и алебарды, они всегда были основой хирда. Облачённые
    в тяжёлые доспехи и обученные мастерству защиты, эти воины способны подолгу сдерживать наступающие
    силы врага, держа строй, а также вести эффективное наступление. Они идут в бой в первых рядах, сламывая
    сопротивление врага, прорубая брешь в защите его рядов, куда затем устремляются основные атакующие
    силы. Их легендарная выносливость позволяет выдерживать самые страшные атаки магией, а броня – не
    обращать внимания на вражьи стрелы.
