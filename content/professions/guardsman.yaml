  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Боец Империи — Легкий воин Империи, специализирующийся на нанесении урона своими умениями, используя
    парные кинжалы. Легкая броня помогает ему быстро перемещаться по полю боя и приносить огромную пользу
    в том месте, где это необходимо.
  - Гвардеец — одно из элитных званий Империи. Воины с таким званиям обладают особыми навыками, которые
    делают их особо опасными противниками. В их арсенале появляется еще больше способностей для нанесения
    урона по врагам, но при этом они обучены и оборонительным техникам.
  parser_version: 1.0.0
