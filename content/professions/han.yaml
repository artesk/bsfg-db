  original_url: https://db.bsfg.online/profession/han/
profession:
  descriptions:
  - Глава — рыцарь Орды, использующий двуручный меч. В отличии от остальных своих собратьев по классу
    имеет в своем арсенале более разрушительные способности, в замен же не уделял должного внимания умениям,
    которые способны контролировать противников.
  - Хан — Ханы неудержимые бойцы, которые в лоб бросаются на своих врагов, их невозможно ни оглушить,
    ни парализовать, а тем более испугать. Их атаки становятся еще более разрушительные. Однако, их защитные
    характеристики также находятся на высоком уровне. А высокая природная регенерация позволяет им не
    только быстро восстанавливаться, но и быстрее заживлять кровоточащие раны или излечиваться от отравлений.
  parser_version: 1.0.0
