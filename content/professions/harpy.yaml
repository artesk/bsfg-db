profession:
  descriptions:
  - Рядовой Гарпий — боевой маг Легиона, который посвятил всего себя изучению молний и способу приручить
    ее. Освоив магию грома, они являются очень сильными магами, которые способны своими атаками возвращать
    полученный урон и проклинать врагов. Непрерывно атакуя врага, Рядовой Гарпий способны показать врагу
    всю мощь магии грома, когда они даже не могут сдвинуться с места.
  - 'Легионеры Гарпий освоили магию грома в совершенстве. Приручив молнии, Легионеры Гарпий способны использовать
    ее не только для защиты от атак врага, но и для нанесения им дополнительного урона. В арсенале Легионера
    имеются самые различные заклинания: от удара молнии, которая выводит противника на некоторое время
    из боя, до мощных энергетических разрядов, которые наносят огромный урон противникам вокруг. Легионер
    может при помощи молний ослаблять противника, что позволит расправится с ним максимально быстро.'
  parser_version: 1.0.0
