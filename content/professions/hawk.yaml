source:
  data_sha256: 4bf568b310021d8e7a832efc099b524997eb6dc2faf0b6c4191c9e6ab4ce1355
  original_url: https://db.bsfg.online/profession/hawk/
profession:
  descriptions:
  - Вооруженные шпагой, рядовые Ястребы всегда путешествуют налегке. Их умению фехтования позавидуют даже
    Соколы. Ястребы также обладают навыками стрельбы с арбалета. Выбор есть всегда.
  - Быстрый и хитрый Легионер закружит противника в бесконечных атаках, а если силы на исходе всегда может
    отступить и достав арбалет продолжить бой на расстоянии. Ловкий и находчивый боец представляет достойного
    конкурента среди подобных. Если ястреб вызвал Вас на дуэль, ничего хорошего от этого ждать не стоит.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/yastreb.jpg
