source:
  data_sha256: 8ecc5dcd69052da9e0ec3dce4fddfaa03feefe7ec8ae90fa02686b475ca00048
  original_url: https://db.bsfg.online/profession/headhunter/
profession:
  descriptions:
  - Воры и прирожденные убийцы, мастера скрытности и бесшумного преследования. Молниеносные атаки кинжальщиков
    всегда достигают цели и с легкостью прорезают легкую броню лучников и магов, а убив бесшумно свою
    жертву также быстро исчезают с глаз врагов.
  - Эльф, который не чтит традиции предков, а сбор у дуба для него пустые слова. Единственный светлый
    воин, который идет на войну не ради расы или клана, а исключительно ради наживы. Мастерское владение
    кинжалом и превосходные навыки выслеживания жертвы делают его превосходным бойцом для быстрых убийств.
    Резкие и точные удары легко находят уязвимости в доспехах врага, а сильные умения контроля не позволят
    жертве избежать своей участи. Этот убийца никогда не останется без награды!
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2020/02/naemnik.jpg
  schema_version: 1
