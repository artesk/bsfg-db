source:
  data_sha256: 18ce2aed52b8bc7e5e87d5fcb16899c7db50694524fc860f066f0f5fefcc2871
  original_url: https://db.bsfg.online/profession/healer/
profession:
  descriptions:
  - Лекари — воины поддержки. Они исцеляют раны воинов, которые те поучают в сражении, снимают проклятия,
    устраняют яды, а также накладывают заклинания, увеличивающие силы воинов. Они — те, без кого ведение
    войны было бы просто невозможным, либо на войне всегда было бы столько потерь, что вскоре некому стало
    бы воевать. Лекари также имеют определённый набор дисциплин для самообороны, чтобы суметь противостоять
    врагу, если тот застигнет его врасплох.
  - Среди орков, называемых одиночками только теми, кто понятия не имеет о сплоченности этого народа,
    есть действительно альтруистичные мистики. Не смотря на свойственную всем зеленокожим воинственность,
    они в первую очередь задумываются не о совершенствовании боевых умений, а о тренировке навыков врачевания.
    Они избрали себе амулеты в форме тотемов и научились вселять в разумных духи тотемных животных. Воины,
    поддерживаемые этими духами, становятся поистине несокрушимыми, и боевой дух их непоколебим, когда
    они чувствуют надёжную поддержку повелителей тотемов. Кроме того, целители владеют особыми мантрами,
    которые усиливают боевой дух союзников и даже делают отдельных воинов неуязвимыми на некоторое время.
    Ко всему прочему, целители, будучи воспитаны в традициях орды, отлично управляются с посохом, используя
    его как оружие для нанесения ударов, проводя по нему магические силы и оглушая врагов.
