source:
  data_sha256: f78fc3c17665401e4e5ca9f3f845566ab70ee60c05e2a0add0c61e026f405aca
  original_url: https://db.bsfg.online/profession/hell_knight/
profession:
  descriptions:
  - Мечники — это тяжёлая пехота, использующая двуручные мечи, как своё основное оружие. Их атаки всегда
    очень сильны и отличаются большой точностью, в сражении лицом к лицу мало кто сможет устоять против
    такого противника, который сочетает в себе хорошую защиту от ударов и большую атакующую мощь.
  - Рыцари, отступившие от церкви и веры в бога, поглощенные страстью запретных знаний, они углубились
    в изучение оккультных наук. Годы исследований не прошли даром. Темная магия открыла перед ними возможность
    поглощать жизненную энергию противника и призывать страшных демонов пекла. Темные заклинания не страшны
    рыцарям ада, присягнувшим силам зла на верность, им не страшна даже сама смерть. Их знания позволяют
    им высасывать жизни из противников, а с помощью особых заклинаний, враги, которые атакуют Рыцаря Ада,
    цепенеют от ужаса.
