      description: Вы выбрали путь мастера войны. Вы получаете иммунитет к оглушениям, провокациям и сну.
        Вы получаете возможность атаковать несколько целей вокруг себя. Ваша физическая атака увеличена
        на 130%+7000, физическую защиту на 10%, магическую защита на 23%, сила физических умений на 17%
        и запас жизненных сил на 3%, регенерация жизненных сил и боевого духа по 1.65%, а также при большом
        скоплении врагов увеличивает магическую защиту на 25% и снижается урон от класса стрелков на 25%.
        Ваши атаки периодически будут наносить дополнительный фиксированный урон, а также замедлять и
        наносить кровоточащую рану стрелкам, убийцам и легким воинам, снижать физическую защиту магическим
        классам и накладывать сильное кровотечение, снижение скорость бега, физической защиты и атаки
        рыцарям и тяжелым воинам. Увеличена защита от всех классов, кроме легких воинов и убийц, на 25%,
