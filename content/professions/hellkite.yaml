profession:
  descriptions:
  - Как ни кто другой эти орки любят издеваться над своими врагами. Владеют огромным количеством техник,
    которые замедляют врагов, а комбинации этих техник способны снизить боевой дух любого врага. Обладают
    большой живучестью и являются крайне опасными и неприятными противниками.
  - Мастер войны Орды, который для расправы с толпами врагов использует парные топоры. Обладает невероятной
    силой и всегда рвется в бой, провоцирую своих врагов на атаку, нанося им сокрушительные удары.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2020/09/izverg.jpg
  schema_version: 1
