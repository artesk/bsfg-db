  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Затворники — воины, использующие двуручный меч, способные наносить сокрушающие атаки по своим врагам.
    Носят легкую броню, чтобы быстрее перемещаться по миру. Их образ жизни привел к тому, что они научились
    мастерски сливаться с окружающей средой, становясь практически незаметными для окружающих.
  - Отшельники — сильные и быстрые бойцы, способные наносить сокрушительные удары и имеют повышенную стойкость
    к магическим атакам. Отшельники долгое время находились вдали от своей расы, в следствии чего приобрели
    невероятную стойкость к замедлениям и способность противостоять проклятиям. Даже сама смерть не властна
    над ними, что спасает их в самой сложной ситуации. Высокая сила, мощные умения и немалая живучесть
    делает Отшельников крайне опасными противниками на поле боя.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/otshelnik.jpg
  schema_version: 1
