  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Мастер ружей — стрелок Империи, который использует ружье для нанесения урона. Обладает уникальными
    навыками и умениями для своей расы. Используя различные патроны он может как нанести повышенный урон,
    так и поджечь или парализовать врага. Уникальность использования ружья заключается в том, что ему
    требуется постоянная перезарядка.
  - Охотник за головами — Охотники за головами, на ряду с ружьями, также научились использовать магию
    огня, при помощи которой способны усиливать свои характеристики, либо вообще становиться неуявимым
    для вражеских атак. Получают дополнительные навыки для улучшения обращения с ружьями.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2022/04/hh.jpg
