source:
  data_sha256: e92d8c8df3496d1d4932698be5ae3741bc6739be4e999b9ee5db3ee1e2345f37
  original_url: https://db.bsfg.online/profession/hunter/
profession:
  descriptions:
  - Эльфы всегда заботились о природе, балансе добра и зла. Некоторый из них уходили в леса и становились
    отшельниками — егерями. Главное оружие егеря кинжалы и лук. Своими мощными атаками они уничтожают
    противников леса в считанные секунды.
  - Охотник — мастер лука и житель леса, тесно контактирующий с природой. Путешествуя по обширным равнинам
    и густым лесам, охотники научились выслеживать и приручать диких животных, таких как волки, подавляя
    их природную агрессию и заставляя служить себе. Мастера ловушек и засад, охотники могут скрытся в
    покрове леса, становясь почти неуязвимыми. Верный зверь, лук, острый глаз и хитрость – основной набор,
    никогда не подводящий охотника в критической ситуации.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/ohotnik.jpg
