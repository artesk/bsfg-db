profession:
  descriptions:
  - Влияние церкви на людей Империи настолько сильное, что она начала обучение не только лекарей, но и
    магического отряда воинов. Воины веры брали уроки школы магии огня у Архимагов Империи и в некоторых
    моментах даже превзошли своих учителей. Вооруженные жезлами и боевыми книгами, Воины веры наносят
    колоссальный урон противникам и более защищены от их атак.
  - Инквизиторы — Воины веры, которые не захотели останавливаться на достигнутом и решили познать всю
    разрушительную мощь святого огня. Они научились применять некоторые свои способности так далеко от
    цели, что противник становится практически беззащитным и ничего не успевает предпринять. Все свои
    знания и умения Инквизиторы используют, чтобы нанести как можно больше урона врагам Империи. Но не
    только огонь дает Инквизиторам силу, но и знания света. Две эти школы магии позволяют очень долго
    контролировать сознание врагов. Взывая к свету, вооружаясь при этом клинком инквизиции, эти маги становятся
    крайне опасными противниками.
