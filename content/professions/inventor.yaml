  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Невероятные мастера инженерного дела, которые достигли высочайших вершин становятся эрудитами. Каждый
    их механизм несет смерть их врагам, будь то мощная пушка изрыгающая огонь, шустрые роботы или даже
    небольшие механизмы отвлекающие внимание.
  - Маг, использует комбинацию новейших технологий и разрушительной магию в бою. Его изобретения способны
    в мгновение ока испепелить врагов, а наномеханизмы быстро восстановить полученные повреждения брони.
    Полностью зависит от скорости чтения заклинаний и магической атаки, но при этом вооружен ружьем!
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2020/02/inventor2.jpg
  schema_version: 1
