profession:
  descriptions:
  - Шкет — стрелок банды, который наносит огромный урон из стрелкового оружия. Крайне ловок и способен
    увернуться от всех атак врагов. С своем арсенале имеет запас очень легких снарядов, которыми он способен
    стрелять на максимальной скорости.
  - ''
