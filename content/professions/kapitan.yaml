profession:
  descriptions:
  - Вояка — рыцарь банды, который берет весь удар на себя и защищает своих соратников. Его атаки на столько
    сильны, что способны ломать броню врага. При этом он крайне хорошо защищен и мастерски владеет свои
    щитом, укрываясь которым он практически не получает повреждений.
  - ''
