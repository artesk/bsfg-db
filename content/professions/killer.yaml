profession:
  descriptions:
  - Кинжальщики Доминиона — тихие, бесшумные убийцы. Засады в неожиданные местах, удары в спину, обворовывание
    поверженных противников — всё это ремесло кинжальщиков. Только они могут незаметно пробраться в тыл
    противника, и незаметно убить опасного мага или лучника на позиции, и так же бесшумно и быстро исчезнуть
    до прибытия подкреплений, ослабляя вражеские ряды с тыла.
  - Иногда, решающую роль в сражениях, решают не огромные армии, стоящие на поле брани, а скрытое уничтожение
    ключевых фигур вражеского войска. И как нельзя лучше для этой цели, подходят Ассасины – самые тренированные
    мастера кинжала из всех воинов Доминиона. Предпочитая использовать легкую броню, они избегают нападения
    в открытую, нанося быстрые и точные удары в спину врагу. Но не стоит расслабляться видя хрупкий вид
    этого воина, его силы вполне достаточно, что бы особым приемом повернуть противника спиной, и в ту
    же секунду поразить его кинжалом.
