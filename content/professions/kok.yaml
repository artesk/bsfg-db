profession:
  descriptions:
  - Повар — лекарь банды, специализирующийся на лечении своих союзников и способен снимать с них различные
    проклятия. На поле боя поддерживает своих союзников, увеличивая их атакующие характеристики. Не стоит
    забывать, что он способен швырнуть во врага своим котлом, оглушив его.
  - ''
