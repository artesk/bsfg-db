  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Каждый рядовой колибри уверен, что только быстрые атаки и бесконечные маневрирования на поле боя помогут
    им достичь победы в бою. Невероятно сильны на дальних дистанциях и настолько же слабы в ближнем бою,
    любое промедление или малейшая ошибка может окончиться для них смертью на поле боя.
  - Колибри — самые юркие и маленькие воины легиона, которые в мгновение ока перемещаются по полю боя.
    Увеличенная дальность атаки и несколько прыжков позволяют им с легкостью избегать ответных атак. Основная
    цель легионеров колибри — не дать врагу подобраться к ним, ведь своей мобильностью они обязаны легким
    доспехам, которые не могут хорошо сдерживать урон.
  parser_version: 1.0.0
