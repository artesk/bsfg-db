profession:
  descriptions:
  - Матрос — тяжелый воин, использующий двуручный меч. Однако, он способен время от времени использовать
    и другое оружие, такое как кинжал или ружье. Способен выслеживать добычу, что делает его крайне быстрым
    при охоте на монстров. Но любой мастрос не откажется от кружки рома!
  - Корсар — Матрос, который без страха идет в бой. Пока ему не грозит смертельная опасность с ним всегда
    его верный попугай, который всегда ему сообщит о приближении врага. Также он способен устанавливать
    карабельную пушку, которая нанесет сильный урон противникам и отбросит их выстрелом. Проклинает противника,
    вселяя в него ужас, но легко притягивает его обратно к себе своим крюком. Поскольку Корсар выше по
    званию своих младших соратников, он может себе позволить пить ром не в одиночку, а вместе с боевыми
    товарищами.
  parser_version: 1.0.0
