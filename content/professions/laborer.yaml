  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Ассистенты хорошо обучены использованию различных смесей и гранат для эффективного использования их
    против врага. В их арсенале есть немного гранат, направленных на уничтожение противника, и масса смесей,
    способных нейтрализовать как одного, так и нескольких противников сразу, сделать их слабыми и незащищёнными,
    заставить заснуть или бежать в страхе целый строй, или же сильно отравить и сжечь кислотой своего
    противника.
  - Когда ставится вопрос о качестве и количестве, выбор Лаборанта – количество. Они не занимаются многолетними
    исследованиями особых взрывчатых веществ, как это делают алхимики, а лишь улучшают уже давно известные
    и проверенные смеси. Лаборанты создали на основе смесей старого образца более мощные и разрушительные
    бомбы, значительно увеличив их заряд, и улучшили взрывную силу, а также добавили к взрывчатке дополнительные
    элементы, так или иначе нейтрализующие противника.
