source:
  data_sha256: ab7729b4d9338755daadfd9881bc4f1494379041d5aed0cebee67f2dfca85777
  original_url: https://db.bsfg.online/profession/likantrop/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Эти воины используют острые когти, разрывающие броню и плоть своих врагов. Они отлично приспособлены
    для боёв против одиночных противников, но эффективно сражаться против нескольких противников не могут.
  - Сталкеры, выбравшие путь звериного начала могут превращаться в свирепых хищников. Эти монстры могут
    разорвать своего противника за несколько секунд. У противников доминиона ходит много легенд о прыгающих
    из темноты ночи огромных волках, противостоять которым практически невозможно.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/likan.jpg
  schema_version: 1
