profession:
  descriptions:
  - Картовед — чародей банды. Способен наносить сильный магический урон по противнику, кроме того чем
    дальше противник, тем больший урон он получит. Отравить группу врагов прокисшим пойлом? Не вопрос!
    Даже при смерти Картовед проклинает врагов, усыпляя их. Также он способен сливаться с окружающей средой
    и становиться полностью невидимым.
  - Лоцман — следующее звание Картоведа. В его арсенале появляется все больше проклятий. Даже простые
    атаки будут проклинать врагов и усиливать самого Лоцмана. Также он имеет способность повышенной выживаемости,
    например он способен превратиться в камень и игнорировать любые повреждения, а потом внезапно выйти
    из этого состояния и нанести огромный урон по врагам, которые его окружили.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2021/12/pLoc.jpg
  schema_version: 1
