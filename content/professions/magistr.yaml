source:
  data_sha256: abed208c2b23494d65f68ff1f9df22efd249331ce3f6a0e83d7665b3f5906318
  original_url: https://db.bsfg.online/profession/magistr/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Орден магов воды Альянса зародился в незапамятные времена. Они используют заклинания, направленные
    в основном на уничтожение противника в минимальное короткое время. Все их заклинания так или иначе
    предназначены для нанесения грубых прямых атак магией воды, и не отличаются особой хитроситью и изощрённостью,
    но при этом весьма эффективны.
  - Магистры — волшебники, посвятившие себя изучению магии Воды. В отличие от большинства других магов,
    они не пытаются взять стихию под контроль, но договариваются и познают ее. Это позволяет им получать
    благословление воды, усиливающее произносимые ими заклинаниями мощными потомками ледяной Воды. Магистры
    способны создавать кокон льда, защищающий их от атака врагов, мгновенно перемещаться, используя эфирные
    потоки влаги вокруг и даже заставить воду выйти на поверхность в самой сухой пустыне. Их навыки и
    понимание стихии Воды настолько сильны, что магистры способны отбрасывать противников мощнейшими потоками
    Воды и промораживать промокших врагов до состояния ледяных статуй.
