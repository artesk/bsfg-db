source:
  data_sha256: f4967cd493ece14f2eb2638b2b91b647291251e227caa6e2e9106ac43a046a77
  original_url: https://db.bsfg.online/profession/marouder/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Лёгкий воин Орды, способный быстро перемещаться по полю боя и наносить огромный урон своим врагам.
    Влядея двумя огромными топорами, является очень опасным противником, который может швырнуть эти топоры
    сбив с толку врага и стремительно перейти в ближний бой, в котором ему практически нет равных. Злодей
    способен выстоять практически против любого противника, ведь когда его атакуют — он впадает в ярость
    и становится еше опасней.
  - Мародеры — безнравственные налетчики Орды, которым чужды мараль, закон и честь. На поле боя они способны
    прибегать к подлым хитростям, таким как — обезоружить противника, увеличивая свои шансы на победу.
    Способны отлично маскироваться, что помогает им незаметно подкрадываться к врагам и грабить их. Мародеры
    всегда находятся в поисках добычи и практически не спят, из-за этого со временем у них выработался
    иммунитет к усыпляющим заклинаниям. Убийство врагов прибавляет им сил. Мародеры по сути своей являются
    преступниками даже в Орде и не раз их наказывали публично… От многочисленных ударов плети их шкура
    на спине стала намного толще. И главное запомнить нужно одно — чем сильнее Вы бьете Мародера, тем
    сильней он ударит Вас в ответ.
