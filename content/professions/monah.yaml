source:
  data_sha256: 14a9ff6513b9dc451601870da734cf06694f51d7aed4493fd8a5cb1eedc5f1c0
  original_url: https://db.bsfg.online/profession/monah/
profession:
  descriptions:
  - Колдуны глубоко изучают не только магию земли, но и прочие магические дисциплины. В их арсенале есть
    немного заклинаний, направленных на уничтожение противника, и масса заклинаний, способных нейтрализовать
    как одного, так и нескольких противников сразу, сделать их слабыми и незащищёнными, заставить заснуть
    или бежать в страхе целый строй, или же сильно отравить и сжечь своего противника.
  - Итогом длительных медитаций и аскетического образа жизни для этих иноков стал абсолютный контроль
    над собственным духом и понимание природы жизненных сил. Благодаря этому, Монахи стали способны контролировать
    часть сил природы вокруг себя, используя для этого стихию земли. Сама природа калечит врагов вокруг
    монаха, и защищает его самого. Отравляя плоть бойцов, и опустошая ментальные запасы магов, этот орк
    не внушительной комплекции может стать для врагов Орды большей угрозой, нежели самый атлетически сложенный
    воин. В то же время монах не лишён возможностей помощи своим союзникам. Благодаря особым мантрам,
    он способен увеличить ловкость и скорость своих союзников, что бывает незаменимо в стремительных стычках
    с врагом.
