source:
  data_sha256: 6ec26ba8496fd16e91d0cadd80d52fa0b140da1628ca97f344e6a2a78dd3ff3f
  original_url: https://db.bsfg.online/profession/moonknight/
profession:
  descriptions:
  - Защитники Белатто сильно отличаются от своих боевых товарищей Рыцарей Белатто. Защитники обучались
    совершенно другим навыкам, которые обладают более смертоносными свойствами. Они не уделяли времени
    тому, как расправляться с большим количеством монстров. Вместо этого они обучались убивать другие
    расы.
  - Лунные рыцари способны превозмогать свои силы и осыпать врага шквалом своих ударов на столько быстро,
    что устоять против них крайне сложно. Тренируя свое тело и дух Лунные рыцари обладают способностью
    противостоять различным эффектам контроля над собой, а используя оружие новолуния наносить сокрушительные
    удары врагам.
