source:
  data_sha256: 3117eb7895e9feb4dbf90e8db9569de66335cce96d009c8cb29a0537eec9f609
  original_url: https://db.bsfg.online/profession/mountainking/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Эти воины избрали для себя путь защитника, того, кто стоит в первых рядах в атаке, и прикрывает спины
    своих союзников при отступлении. Экипированные тяжёлой броней и щитом, они обучены особому мастерству
    защиты, которое позволяет им с лёгкостью отражать атаки с помощью щита, и легко переносят вред, причиняемый
    даже самыми сокрушительными заклинаниями. Это единственные воины, способные использовать свой щит,
    как оружие, но при этом они вынуждены использовать одноручное оружие, поэтому их атакующий потенциал
    меньше, чем у других воинов.
  - Эти непревзойдённые мастера защиты обучены древним боевым искусствам, передающимся из поколения в
    поколение на протяжении многих веков. Горные Короли способны довести защиту своего доспеха до идеальной,
    а их техника боя приспособлена для сражений в самой гуще боя. Горные Короли идут на передовой армии
    Союза, также они — первый рубеж обороны на пути противника, который может полностью разбить атаку
    врага, если тот допустит оплошность, недооценив их. Горные Короли способны замедлить любых врагов,
    которые находится неподалёку, и ослабить силу их атаки, используя особые техники боя и приспособления,
    которые специально создали для них инженеры Союза – так называемые ловушки.
