source:
  data_sha256: 32adf6ecd69c38fe99835b01bdb7f279902c21c26cbbf44dd628e5f7000b1eb0
  original_url: https://db.bsfg.online/profession/necromancer/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Призыв нежити — обычное явление в столице доминиона. Живые мертвецы уже несколько веков сражаются
    в армии темных эльфов, но подчиняются они только чародеям, которые освоили магию смерти. используйте
    силу мертвых, чтобы вселять в противников страх и обрушивать на них орды нежити во имя доминиона.
  - Некроманты — маги Темных Эльфов, чье ремесло вселяет ужас и страх в сердца иных рас. В искусстве управления
    нежитью им нет равных — они одинаково ловко могут призвать как души воинов, павших на полях сражений
    более сотни лет назад, так и стремительных Ведьм себе на подмогу.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/nekr.jpg
  schema_version: 1
