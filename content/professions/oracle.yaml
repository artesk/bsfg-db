source:
  data_sha256: 734a6fe23ee3f4155b1c89b1f970956f1854cc6939e1b3645aa8b4917a9897b9
  original_url: https://db.bsfg.online/profession/oracle/
profession:
  descriptions:
  - Лекари — воины поддержки. Они исцеляют раны воинов, которые те получают в сражении, снимают проклятия,
    устраняют яды, а также накладывают заклинания, увеличивающие силы воинов. Они — те, без кого ведение
    войны было бы просто невозможным, либо на войне всегда было бы столько потерь, что вскоре некому стало
    бы воевать. Лекари также имеют определённый набор дисциплин для самообороны, чтобы суметь противостоять
    врагу, если тот застигнет его врасплох.
  - Даже в самых жестоких битвах, когда вокруг льются реки крови, можно найти островок спокойствия и добра.
    Эта роль выпадает на долю эльфийских лекарей, смысл существования которых – посвящение себя служению
    Жизни. В их власти даровать воителям дополнительные силы, наделить оружие более мощными атаками, ведь
    зачастую мало просто попасть в противника, нужно ещё и пробить его броню. Исключительно благодаря
    оракулам воины эльфийской расы могут выходить из самых кровопролитных и тяжёлых боёв абсолютно готовыми
    для новых подвигов, и, что более важно, полными здоровья.
