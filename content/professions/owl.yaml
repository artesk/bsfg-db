profession:
  descriptions:
  - Новобранец Сов лечит союзников и повышает их боевую мораль. Поддержка Совы может дать значительное
    преимущество и решить исход битвы.
  - Мудрые и аккуратные Легионеры Сов стоят позади и наблюдают.. Их способность к перемещению предметов
    и существ с помощью одной только мысли выбьет из колеи любого противника, а навыки поддержки не дадут
    союзнику погибнуть и открыть фланг для атаки.
  parser_version: 1.0.0
