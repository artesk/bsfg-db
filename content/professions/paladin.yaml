source:
  data_sha256: fcb39137c5d7a47aa160bf38226b126b8b01bb42a2a3045e4e72ac7dbcbb576c
  original_url: https://db.bsfg.online/profession/paladin/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Тамплиеры — это священники, которые избрали для себя путь воина. Облачённые в тяжёлые доспехи, несущие
    в руках щит и меч, они используют знания магии света, чтобы помогать своим союзникам в бою, излечивая
    их раны в самой гуще битвы, они укрепляют волю воинов к сражению и их боевой дух. Тамплиеры, достигшие
    больших высот в своём искусстве, посвящаются в паладины.
  - Служитель света и добра, посвятивший себя божественной магии. Немногие обладают чистотой и религиозным
    рвением, необходимым для следования пути паладина. В любой группе ему будут рады, поскольку он может
    освящать оружие и броню, лечить и снимать проклятия с воинов.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/paladin.jpg
  schema_version: 1
