profession:
  descriptions:
  - Служитель Белатто — это Лекарь, который вместо магии предпочел физические тренировки. Одетый в легкую
    броню он неплохо защищен и мобилен. В качестве оружия же использует одноручный меч и боевую книгу,
    чем еще сильнее увеличивает свои характеристики.
  - Пастырь — Служители Белатто, которые помимо физических тренировок также изучили святую магию. Способны
    воскрешать мертвых союзников, усилять свое лечение и восстанавливать жизненные силы союзникам вокруг
    себя, просто находясь с ними рядом. У Пастырей появляются навыки, которые делают их еще мобильнее
    и даже позволяют избегать смерти.
