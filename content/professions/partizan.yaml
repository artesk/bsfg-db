source:
  data_sha256: b2a6299f0434504daf151d7d36ab8e48350c6c53f0ab3600b4df304a66edb512
  original_url: https://db.bsfg.online/profession/partizan/
profession:
  descriptions:
  - Разведчик Белатто — легкий воин Белатто, использующий одноручный меч для нанесения урона. Способен
    незаметно подкрадываться к своим врагам. Обладает обширными навыками нанесения урона противнику, а
    при правильном использовании своих умений способен обрушить бесконечный град атак по врагу.
  - Партизан — ловкий и изворотливый воин, способный часто уворачиваться от атак врагов, не восприимчив
    к обездвиживающим эффектам. Используя дымовую завесу наводит смуту на поле боя, а при помощи небольших
    перебежок быстро маневрирует по нему. Его атаки становятся еще более опасными для врагов.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2024/10/partizan.png
  schema_version: 1
