profession:
  descriptions:
  - Скауты — разведчики Альянса. Тихие, быстре, незаметные, они способны пробраться в тылы вражеской армии
    и разузнать обстановку, особо талантливые скауты служат альянсу как тихие убийцы в тылу врага. Их
    цель даже не поймёт, что произошло, а сам скаут успеет уйти до прибытия подкрепления.
  - Ни для кого не секрет, что эльфы — отличные ходоки. Однако, далеко не все эльфы способны сравнится
    в своей стремительности со Следопытами, которые развили своё умение быстро передвигаться до заоблачных
    высот. Видевшие Следопытов поговаривают, что при беге ступни эльфов не касаются земли, а ветер несёт
    их в своих потоках. В дополнение к своей быстроте, эти скороходы достаточно ловки для того, что бы
    неплохо обращаться с кинжалом. Следопыты, конечно же не столь сильны, как те бойцы, что целиком посвятили
    себя тренировкам с этим видом оружия, так как для достижения таких результатов в быстроте передвижения,
    Следопытам пришлось пожертвовать техникой боя, но несмотря на это, они весьма опасные противники,
    способные потрепать своим врагам нервы. Если же в бою ситуация сложится не в пользу Следопыта, то
    он может с лёгкостью выйти из сражения, совершив ловкий прыжок, или избежать смерти, притворившись
    мертвым.
