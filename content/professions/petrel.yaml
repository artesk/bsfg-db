profession:
  descriptions:
  - Вооруженные магическим варп-арбалетом рядовые Буревестников обеспечивают надежную поддержку с тыла.
    Их боевая магия не ведает скорби, их нрав не знает усталости.
  - Только частые тренировки и оттачивание навыков владения магией сделает из новичка — Легионера Буревестников.
    Способен ли ты приручить варп-арбалет и в сложный момент использовать правильный заряд? На эти и другие
    вопросы Легионер отвечает не задумываясь. Мастера магии способны на многое…
