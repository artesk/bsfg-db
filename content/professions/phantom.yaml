  original_url: https://db.bsfg.online/profession/phantom/
profession:
  descriptions:
  - Лучник-маг — лучник Доминиона, который научился вкладывать в свои стрелы магическую энергию, что позволяет
    ему наносить магический урон не только с умений, но и с обычных выстрелов. Поскольку одет он в робу
    у него есть навык отскока, чтоб отдалиться от противника и нанести ему мощные магические атаки.
  - Постоянные эксперименты с магией стихий послужили началом для нового класса бойцов, вобравших в себя
    2 способа ведения борьбы — стрельба из лука и нанесение магического урона. Способен наделять стрелы
    различными стихиями, которые при атаки проклинают врагов и усиливают самого Фантома. Один вид Темного
    Эльфа одетого в робу и вооруженного луком, вносит смятение во вражеские ряды. Любой, кто раз подвергался
    атакам фантома, знает, как опасен этот маг, прекрасно владеющий фантомными силами.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/fantom-1.jpg
  schema_version: 1
