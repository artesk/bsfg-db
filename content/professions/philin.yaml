source:
  data_sha256: 84deeabf3f78303d47d0c2803ba3b100d8411d6da68fc691bb80c29ef075321a
  original_url: https://db.bsfg.online/profession/philin/
profession:
  descriptions:
  - Новобранцы филинов наряду с беркутами врываются в бой наводя панику в рядах противника. Легион филинов
    один из самых молодых в армии легиона. Он был создан когда Легион столкнулся с непробиваемыми отрядами
    имперских рыцарей.
  - Используя пику или алебарду эти воины легиона предпочитают разить противников массово, а не по одиночке.
    Благодаря хорошей живучести филины рассекают отряды противника, позволяя арбалетчикам наносить максимальные
    повреждения противникам пока их стройные ряды превратились в хаос.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/filin.jpg
