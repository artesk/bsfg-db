      description: В крови Феникса течет энергия солнца, с помощью которой он может восстать из пепла
        и наносить ожоги своим врагам. Увеличивает физическую атаку на 21% и восстановление жизненных
        сил на 200. Время от времени на Феникса накладывается усиление, при котором его следующая атака
