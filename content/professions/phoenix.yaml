profession:
  descriptions:
  - Огненный мечник — это тяжелый воин Империи, использующий двуручный меч и облаченный в робу. Познавшие
    магию огня они способны наносить огромный урон врагам. Огненные мечники очень опасные противники для
    других тяжелых воинов, так как своими обжигающими заклинаниями игнорируют их защиту.
  - Братство огня, считающее огонь первоначалом всего сущего, подготавливают отличных бойцов во славу
    Императора. Фениксы — бойцы приученные сражаться против любого противника в любых условиях. Используя
    силу огня, становящуюся их естеством после посвящения, они способны сжигать группы противников, и
    даже целые армии, работая в строю. Огонь — стихия разрушения? Фениксы смеются над данным предположением.
    Даже будучи при смерти, они способны призвать силу огня для выживания и лечения собственных ран. Как
    и легендарная птица Феникс, эти воины могут обмануть смерть, и воскреснуть прямо на поле сражения
    без посторонней помощи. Фениксы наделяют свой верный меч и броню силой огня, их меч разит противников,
    не защищённых от огня, а зачарованная огнём броня обжигает атакующих Феникса врагов.
