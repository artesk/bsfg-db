profession:
  descriptions:
  - Шнырь — легкий воин банда, который использует парное оружие. Пушечное мясо, которое всегда находится
    в пылу битвы. Его атаки сильны и способны оставлять на прагах глубокие раны, которые так просто залечить.
    Выпив бутылку рома залпом становится полностью безбашенным и практически не чувствует боли.
  - ''
