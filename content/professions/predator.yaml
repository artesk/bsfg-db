source:
  data_sha256: 05c3b67a538557dbc6c94a7e77c70c5a78a57fdd5a4d55292936f15d2154054a
  original_url: https://db.bsfg.online/profession/predator/
profession:
  descriptions:
  - Адепты Доминиона, которые овладели мастерством обращения с парными кинжалами. Способны взывать к темным
    силам и наполнять ими свое оружие. Им подвластно древнее искусство, которое позволяет избегать вражеских
    проклятий и даже отражать их обратно врагу.
  - Хищники воистину опасные противники. Сливаясь с окружающей средой они способны быстро устранить практически
    любую цель, стоящую у них на пути. Используя древние техники они способны усиливать свои способности,
    выводя их на нечеловеческий уровень.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2020/09/predator.png
