profession:
  descriptions:
  - Чародей Белатто — колдуны Белатто это маги, которые прежде чем наносить массовый урон по врагам, очень
    сильно ослабляют противника. В их распоряжении есть большое количество проклятий, которые они смогут
    применить в разных ситуациях, а накопив достаточно энергии проклятий нанести летальный урон врагу.
  - Предсказатель — Предсказатели способны анализировать и предугадывать ход боя. Они обладают еще большим
    количеством различных проклятий. Но на ряду с этим они также владеют и защитными заклинаниями, которые
    помогут как и самим Предсказателям избежать большого урона или даже смерти, так и спасти членов своей
    группы.
