profession:
  descriptions:
  - Лекари — воины поддержки. Они исцеляют раны воинов, которые те поучают в сражении, снимают проклятия,
    устраняют яды, а также накладывают заклинания, увеличивающие силы воинов. Они — те, без кого ведение
    войны было бы просто невозможным, либо на войне всегда было бы столько потерь, что вскоре некому стало
    бы воевать. Лекари также имеют определённый набор дисциплин для самообороны, чтобы суметь противостоять
    врагу, если тот застигнет его врасплох.
  - Даже самая мирная раса, по внешнему виду или по своей политике, обязана вести войну. Однако, ни одна
    армия не обходится без добротных врачевателей, способных быстро и своевременно избавить своих товарищей
    по строю от приобретённых в сватках ран, или же, используя могущество Богов зачаровать как оружие
    ближнего боя, так и луки, для причинения более тяжких повреждений врагу или же добавить броне дополнительную
    прочность. Серьёзно ошибётся тот, кто посчитает Священника, чья основная задача, безусловно, поддерживать
    в воителях здоровье и силу, беззащитным перед опасностью. Магия лекаря может быть и весьма коварна,
    ведь он обладает даром лишать противников благословлений, дарованных им их собственными магами и жрецами.
