profession:
  descriptions:
  - После многолетней междоусобной войны, родной мир Белатто был практически уничтожен. Ненависть Белатто
    друг к другу и их уникальная магия привлекли взор древнего зла, таинственной сущности, пожирающей
    целые миры. Поскольку Белатто были разрозненны, им не удалось одолеть эту угрозу. Единственный выход
    был — покинуть свой родной мир. Маги Белатто — Друиды — открыли портал в неизведанный мир, но для
    них это была последняя надежда на спасение. Оказалось, что в их новом доме также не все спокойно и
    в нем идет война между шестью фракциями разных рас, которые увидели в Белатто сильных союзников и
    каждый хотел видеть их в своих рядах. Но даже объединение ради спасения расы не позволило забыть им
    о старом конфликте и Белатто начали присоединяться к другим расам, с которыми у них совпадали цели
    и убеждения. Лекари Белатто научились использовать магию природы для лечения своих союзников. Так
    как война в их мире не утихала уже долгие годы и каждая жизнь была на счету, Лекари Белатто не тратят
    время на лечение только одного союзника. Но они используют магию природы не только для помощи союзников,
    Лекари также применяют ее для обороны себя, ведь если они погибнут — кто будет защищать их братьев
    и сестер.
  - Псионик — Лекарь Белатто, который имеет огромный опыт в боевых условиях. Также, как и другие представители
    расы, способны призывать питомца, который оказывает помощь союзникам вместе с Псиоником, не забывая
    и о хозяине. Опыт в лечении достигает невероятных высот и каждый Псионик способен с огромной скоростью
    излечить даже самого безнадежно раненого товарища. В свою очередь боевой опыт позволяет им дать отпор
    врагу, нанося ему мощные атаки магией природы. Псионик будет сражаться с врагами и лечить союзников
    до последней капли крови и даже близость смерти его не остановит.
