  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Убийца Белатто — уникальный представитель своей профессии. Он обладает способностью наносить точные
    сильные удары по определенным слабым местам противника, при этом его атаки производятся практически
    без задержек. Владеет когтем и носит легкую броню.
  - Каратель — это Убийца Белатто, который преуспел не только в способностях наносить большой урон, но
    и обладает различными усилениями. Способен наделять свой клинок различными свойствами, что позволит
    покарать противника еще быстрее. Его невозможно обездвижить, а также двойной прыжок делают его очень
    мобильным. Даже смерть не погасит его жажду крови.
  parser_version: 1.0.0
