  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Дуэлист — легкий воин Альянса, вооруженный парными мечами. Его задачей является быстрое нанесение
    урона одиночной цели, используя обычные атаки. Способен навязать противнику бой лицом к лицу, используя
    только обычные атаки и забыть про применение умений и магии.
  - Налетчик — его цель одна — выбрать для себя цель и уничтожить ее. Быстро перемещается по полю боя,
    раскидывая по нему ловушки, которые обездвиживают врагов. Может войти в азарт и в состоянии Исступления
    забыть про защитные характеристики и все для того чтобы как можно быстрее убить противника перед собой.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2022/10/raider.png
