source:
  data_sha256: d409e4566079854c83485087a5861a763fdc4fa840d808146ecc03340e5db8f2
  original_url: https://db.bsfg.online/profession/raven/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Докажите свою преданность отряду Воронов взяв в руки древний меч. Докажите свою меткость достав арбалет
    из рюкзака и выстрелив в противника. Универсальный солдат Легиона заставит себя уважать.
  - Вы достойный противник с козырной картой в рукаве. Отражайте заклинания, контролируйте передвижения
    противника, лишите его возможности пользоваться заклинаниями, а напоследок — швырните меч ему в грудь…
    Все о чем жалеет Ворон-Легионер, о невозможности взлететь и догнать убегающего в страхе противника!
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/voron.jpg
