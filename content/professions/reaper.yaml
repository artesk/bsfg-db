profession:
  descriptions:
  - Гробовщик — легкий воин Доминиона, вооруженный парными мечами. Его задачей является быстрое нанесение
    урона одиночной цели, используя обычные атаки. Способен наносить глубокие кровоточащие раны врагам
    и даже поглощать их души, чтобы избежать смерти.
  - Жнец — все умения и навыки Жнецов направлены на уничтожение врага в самый короткий срок. Убивая врагов
    и поглощая при этом их души становится на некоторое время неуязвимым, что делает его опасным даже
    для группы врагов. Может отказаться от плоти и переместиться на очень большое расстояние, что позволяет
    застать жертву врасплох.
  parser_version: 1.0.0
