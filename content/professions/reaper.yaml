    - branch: base
      description: Вы вводите врага в состояние клинической смерти и поглощаете его душу. Во время поглощения
        Вы становитесь практически неуязвимым, защищенным от проклятий и эффектов контроля и быстро восстанавливаете
        жизненные силы и боевой дух. После поглощения Вы еще некторое время будете восстанавливать жизненные
        силы и боевой дух, а также получите *Заряд поглощенной души*. Если Вам нанесут смертельный удар
        под этим зарядом, то Вы его поглотите и не умрете, но на несколько секунд потеряете сознание,
        после чего еще несколько секунд будете полностью неуязвимы, но Вас нельзя будет излечить.
      effects:
      - kind: value
        text: Отменяет регенерацию здоровья
      - kind: value
        text: Отменяет регенерацию боевого духа
