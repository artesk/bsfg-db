profession:
  descriptions:
  - Вы никогда не слышали о драконах? Тогда Вы либо слепы, либо мертвы. Есть среди орков храбрецы, которые
    крадут яйца драконов и выращивают из них боевых соратников, на которых можно положиться как в бою
    против неприятеля, так и на охоте на монстров. Как только молодой дракон вырастет, мастер может его
    оседлать и проломить голову любому, кто встанет на пути.
  - Издавна орки используют огромных боевых ящеров, как в хозяйстве, так и в военных целях. Этих ящеров
    они называют страйдерами. Особая каста воинов-налётчиков особым образом дрессирует этих существ, развивая
    в них такие качества как скорость и сила, используя особую боевую породу ящеров. Эти существа способны
    развивать огромную скорость, а сила их атак настолько разрушительна, что даже броня воинов в тяжёлых
    доспехах не продержится долго под напором их неистовых атак, зубы этих страйдеров способны разорвать
    их доспех, как если бы он был сделан из ткани. Особая дрессировка позволяет этим существам наносить
    удары корпусом и хвостом во время сражения, разбрасывая противников во все стороны и расчищая дорогу
    для решающего прорыва Орды.
