  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Рядовой Рух — легкий воин Легиона, вооруженный рапирой. Владеет магией молнии, которая позволяет усиливать
    ей свои атаки или просто наносить огромный урон по противникам.
  - Легионер рух — очень опасный и грозный противник, способный своими мощнейшими атаками сбить с толку
    любого врага. Крайне мобилен, что позволяет ему с легкостью передвигаться по полю боя в поисках подходящей
    жертвы. Способен впадать в безумство и некоторое время наносить только критические атаки. Также хорошо
    защищен от атака в дальнем бою.
  parser_version: 1.0.0
