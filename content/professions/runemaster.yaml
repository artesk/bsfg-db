    - branch: base
      description: Накладывает на врага Руну огня. Если на враге была Руна земли, то их взаимодействие
        вызовет эффект Лавы, который нанесет врагам вокруг цели урон и подожжет землю под противниками
        и если они не покинут эту зону, то их здоровье очень быстро иссякнет. Если на враге была Руна
        ветра, то их взаимодействие вызовет эффект Возгорание, который нанесет врагу урон и подожжет его.
        Если на враге была Руна воды или Руна молнии, то взаимодействия не будет и руны пропадут.
