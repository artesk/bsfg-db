      description: Накладывает на врага Руну воды. Если на враге уже была Руна молнии, то их взаимодействие
        вызовет эффект Электрошока, который будет периодически кратковременно оглушать врага. Если на
        враге была Руна ветра, то их взаимодействие вызовет эффект Тайфуна, который замедлит врага и снизит
        его физическую защиту. Если на враге была Руна земли, то их взаимодействие вызовет эффект Болото,
        который обездвижет противника. Если на враге была Руна огня, то взаимодействия не будет и руны
        пропадут.
