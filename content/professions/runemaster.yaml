  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Мечник Белатто — тяжелый воин Белатто в тяжелой броне. Специализируется на обычных атаках по врагу
    и ослаблении его при помощи взаимодействия различных рун. Хорошо защищен от магических атак и способен
    ускоряться при получении магического урона.
  - Мастер рун — Мечники Белатто, которые углубились в изучение рун становятся Мастерами рун. Теперь в
    их арсенале появляются не только ослабляющие врага руны, но и усиливающие самого Мастера рун. Они
    способны быстро перемещаться к противнику и наносить ему огромный урон своим мечом. Также с помощью
    рун они способны защитить себя или повысить свои атакующие характеристики, к тому же знание рун позволяет
    им использовать базовые стихийные руны без задержек.
