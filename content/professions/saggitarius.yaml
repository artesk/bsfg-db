profession:
  descriptions:
  - Лучники Империи — это воины, специализирующиеся на использовании лука. Они были бы самыми обычными
    воинами, если бы не их особое умение вставать в стойку для прицеливания. Использую такую стойку, лучник
    увеличивает свою точность, силу и дальность стрельбы, но при этом не может передвигаться и следить
    за окружающей обстановкой, что уменьшает его защиту. За счёт этой стойки имперский лучник идеален
    для ведения обороны из-за укреплений или же строя пехоты.
  - 'Рейнджеры — это прирожденные убийцы, которые всю свою силу и мощь вкладывают в сам выстрел. Мало
    кто сможет устоять под градом стрел этого мастера лука: это настоящая машина, приносящая в мир смерть
    и разрушение. Но, концентрируя все свое внимание на самом ударе, рейнджеры немного теряют бдительность
    и быстроту движений, что порой доставляет им немало хлопот.'
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/reindger.jpg
  schema_version: 1
