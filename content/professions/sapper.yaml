profession:
  descriptions:
  - Мечники — это тяжёлая пехота, использующая двуручные мечи, как своё основное оружие. Их атаки всегда
    очень сильны и отличаются большой точностью, в сражении лицом к лицу мало кто сможет устоять против
    такого противника, который сочетает в себе хорошую защиту от ударов и большую атакующую мощь.
  - 'С давних времен, чтобы прикрывать тылы и оборонять свои земли от неприятелей, дварфы создавали разнообразные
    ловушки. Не так давно инженеры, используя ингредиенты, добываемые алхимиками, сделали прорыв в данной
    области. Их изобретение представляло собой небольшие механизмы, срабатывающие при малейшем приближении
    к ним. Эти механизмы начинены пятью видами зарядов, которые при взрыве повреждают и или нейтрализуют
    противника.Но не всем дано использовать их в бою. Мины — так их назвали изобретатели — имеют чуткий
    спусковой механизм, поэтому устанавливать их могут лишь обученные инженеры. Такие инженеры и зовутся
    саперами. Недавно сапёры получили новые технологии: взрывпакет с дистанционным управлением и голема-бомбу
    с тремя видами взрывчатки.'
