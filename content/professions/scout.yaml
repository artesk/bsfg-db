profession:
  descriptions:
  - Стрелки Альянса — это воины, получающие начальную подготовку в обращении с луком. Их обучают древнему
    искусству эльфов — стрельбе из луков, в котором им нет равных. После завершения начального обучения
    стрелки могут стать лучниками, разведчиками, либо охотниками.
  - Разведчики — специальный отряд, в обязанности которого входит патрулирование, составление карт, охрана
    поселков, разведка перед боем и навязывание правил сражения противнику. Навыки во владении луком отточены
    ими до совершенства. В отряды разведчиков вербуются самые быстрые эльфы и в тоже время спокойные,
    не мотивирующие свои действия жаждой мести. Способность обездвижить противника делает их особенно
    опасными врагами.
