profession:
  descriptions:
  - Воин света — легкий воин Альянса, вооруженный одноручным мечом и боевой книгой. Использует магию света
    как для нанесения урона по врагу и его ослабление, так и для усиления себя.
  - Серафим — Серафимы это истинные воины света, сравнимые с ангелами. Способны исцелять своих союзников,
    ослеплять врагов и совершать сокрушительные атаки магией света. Их задача поддерживать своих союзников
    и ослаблять врагов, но и при этом они могут стать серьезным противников в бою один на один.
  parser_version: 1.0.0
