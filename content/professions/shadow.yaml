profession:
  descriptions:
  - Лучники Доминиона славятся своим умением стрелять в самые незащищённые точки противника, нанося критические
    раны, но прицелиться в такие места крайне тяжело, и удаётся это сделать нечасто. Особый навык прицеливания
    помогаем им в этом. Продолжая свои тренировки, лучники могут освоить искусство Тени или Фантома.
  - Тени — таинственные стрелки Доминиона, использующие силы самой тьмы. Они обладают тайными знаниями
    о зачаровке стрел, делая их страшным оружием в бою с врагами. Тени окутывают себя аурой тьмы, которая
    делает их атаки крайне опасными и защищает их от проклятий, и даже ненадолго даёт теням полную неуязвимость.
  parser_version: 1.0.0
