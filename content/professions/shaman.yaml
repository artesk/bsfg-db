source:
  data_sha256: c3879908ae946ed146c548010ec2e9d2ce6ef3d332136d09cf02e5a28e7fe140
  original_url: https://db.bsfg.online/profession/shaman/
profession:
  descriptions:
  - Клан магов земли в Орде зародился в незапамятные времена. Они используют заклинания, направленные
    в основном на уничтожение противника в минимальное короткое время. Все их заклинания так или иначе
    предназначены для нанесения грубых прямых атак магией земли, и не отличаются особой хитростью и изощрённостью,
    но при этом весьма эффективны.
  - Проводя долгие часы в уединении, экспериментируя с самой опасной — и в тоже время самой сильной магией
    — магией крови, Шаманы научились приоткрывать дверь в мир духов. Немногие, пережившие знакомство с
    его обитателями, смогли постигнуть суть процесса умирания живых существ. Благодаря этому знанию, Шаманы
    научились улавливать выброс энергии, происходящий в момент смерти, и придавать этой энергии осязаемую
    форму. Манипулируя душами поверженных врагов и их энергией, они наносят сокрушительные удары по врагам
    Орды, высвобождая эти силы.
