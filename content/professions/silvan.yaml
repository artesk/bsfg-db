source:
  client_release: 2026.11.06.171000
profession:
  class_id: 6332
  descriptions:
  - 'Воитель Белатто — Нет никого в Беллато, кто мог бы быть столь же единённым с природой, как Сильваны.
    Основа их силы — в синергии с природой: они не пытаются подчинить её или доказать своё превосходство
    над ней, как некоторые, а, наоборот, максимально сливаются и черпают от неё силы в обмен на защиту
    лесов. В бою использует одноручный меч и боевую книгу, а тяжелый доспех позволяет защититься от сильных
    атак. Оставляя на противнике Клеймо леса способны усиливать свои умения.'
  - Сильван — Природа не столь беспечна и потому приставляет к Сильванам духов-спутников, которые не только
    помогают в бою, но и следят, чтобы сильваны защищали ее. Сильваны обладают обширными знаниями в боевых
    приемах и магии природы, из-за чего в бою осыпают врага градом умений и навыков.
