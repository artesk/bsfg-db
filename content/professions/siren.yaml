source:
  data_sha256: 9f985044a0bec52c9f38130301e45562d21213f57e4cb496ece20baf3337497f
  original_url: https://db.bsfg.online/profession/siren/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Менталисты Белатто специализируются на кратковременном усилении нескольких союзников и восстановлении
    боевого духа. Единственный менталист, который способен восстанавливать боевой дух всей своей группе
    или же снимать с нее все проклятия, не прилагая особых усилий.
  - Сирены используют комбинацию магии воды и магии природы, что делает их навыки разнообразными. Призывая
    своего помощника они без труда очень быстро вернут в бой одного из своих союзников, восстановив его
    боевой дух с повышенной силой. При помощи магии природы усиливают свои способности. При помощи магии
    воды защищают свою группу или выводят из строя врагов. Сирены обладают огромным количеством навыков,
    что делает их крайне полезными для всех.
