profession:
  descriptions:
  - Подмастерье — ученик кузнеца. Он обучается как искусству создания вещей и сбора материалов, так и
    боевому искусству владения щитом и одноручным топором. Подмастерье использует тяжёлую броня, что в
    сочетании со щитом делает его крепким противником для любого, кто попытается сразиться с ним. Усердные
    тренировки в кузнице делают его атаки сильнее и точнее, а его знание брони позволяет дополнительно
    увеличить свою защиту.
  - Кузнецами называют орков, которые посвятили свою жизнь ремеслу. Но каждый житель Орды — воин, и кузнец
    тому не исключение. Он управляется с булавой так же хорошо, как и с кузнечным молотом, нанося ею удары
    огромной силы, которые оглушают противников. Сам кузнец крайне невосприимчив к оглушающим атакам,
    поэтому в бою остановить его крайне тяжело. Все кузнецы обучаются искусству вызова осадных тотемов.
    Призывая силы земли и предков, эти тотемы обрушивают всю свою мощь на врага и разрушают его укрепления.
