source:
  data_sha256: d9b2851d6d85e342689ba4be86e8c93368e35177b9c93b370bd7baa138299d57
  original_url: https://db.bsfg.online/profession/sniper/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Стрелки Альянса — это воины, получающие начальную подготовку в обращении с луком. Их обучают древнему
    искусству эльфов — стрельбе из луков, в котором им нет равных. После завершения начального обучения
    стрелки могут стать лучниками, разведчиками, либо охотниками.
  - Снайперы очень дисциплинированные бойцы. Отличная выучка и служение в регулярной армии сделали их
    мастерами своего дела — нейтрализации противника на максимально возможном расстоянии. Вместе с разведчиками
    снайперы образуют костяк армии Альянса, армии, преимущество которой стало расстояние и скорость.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/sniper.jpg
  schema_version: 1
