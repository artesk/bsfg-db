source:
  data_sha256: f40122e59169422e56781f92dd7226882464c22b48bf96640aad7e6e7ecdb8a9
  original_url: https://db.bsfg.online/profession/specialist/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Техники обучаются искусству создания механизмов Адал и управлению ими, а также изучают основы дисциплин
    владения двуручными молотами и использования тяжёлых доспехов. Внутри механического Адала эти воины
    способны сражаться в самой гуще боя. В будущем из них выходят хорошие специалисты.
  - Мастерство специалистов передается из поколения в поколение. С ранних лет, под чутким присмотром мастера,
    они собирают причудливые механизмы и изучают чертежи. По окончанию обучения такой ремесленник, без
    особого труда может собрать боевого голема Адал Гранд, который способен разнести в щепки самые крепкие
    здания. Также специалист может отремонтировать неисправности в боевом механизме находу. Такие мастера
    незаменимы во время осады города неприятеля.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/specialist.jpg
  schema_version: 1
