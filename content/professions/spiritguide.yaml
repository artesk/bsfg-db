profession:
  descriptions:
  - Спиритуалист — маг Орды, специализирующийся на ближнем бою, с помощью своего посоха наносит магический
    урон врагам. Благодаря помощи различным духам стихий, способен прибегать к их помощи и не только усиливать
    себя, но и наносить урон врагам.
  - Проводник духов — Спиритуалист, заключивший договор с духами становится Проводником духов. Его способности
    становятся еще более разрушительными и полезными. Расширяя познания в шаманизме и спиритуализме у
    Проводника духов появляются еще больше различных умений, позволяющие ему, как наносить еще больше
    магических атак по массовому скоплению врагов, так и усовершенствованному владению посохом он способен
    противостоять сразу нескольким врагам.
  parser_version: 1.0.0
