  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Решала — менталист банды. Специализируется на восстановлении боевого духа союзников и членов группы.
    Способен быстро снимать с союзников любые проклятия и эффекты контроля, а в случае реальной опасности
    призывать врата на базу. Может быстро перемещаться по полю боя и ускорять своих союзников.
  - Старпом — это Решала, который прошел серьезную подготовку и обучился таким трюкам, которые делают
    его еще полезней для банды. По мимо вспомогательной магии Старпом активно принимает участие в бою
    и проклинает врагов. Но все же его основной задачей остается усиливать свою группу и своих союзников.
    Имеет хорошую выживаемость, а также он хорошо защищен. Даже когда он восстанавливает боевой дух союзникам,
    он также восстанавливает его и себе.
  parser_version: 1.0.0
