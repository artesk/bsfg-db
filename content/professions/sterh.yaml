profession:
  descriptions:
  - Рядовой Стерхов — Стрелок Легиона. Особое внимание уделяет обычным атакам по врагу, ведь считает,
    что какие-то особые атакующие навыки только усложняют ведение боя и это может пагубно повлиять на
    исход сражения.
  - Легионер Стерхов — продолжая совершенствовать свои навыки Рядовой Стерхов, наконец-то, становится
    полноценным Легионером и ценным воинов на поле боя. Помимо атакующих способностей, также натренировал
    и защитные характеристики. Способен максимально сконцентрироваться на атаках противника и увернуться
    от каждой их них, после чего нанести огромный урон на максимальной скорости.
