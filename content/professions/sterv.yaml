profession:
  descriptions:
  - Стервятники — мастера скрытных убийств. Эти любители рисковать вступают на тонкий путь ведущий их
    по острому лезвию. Крадитесь аккуратно, нападайте со спины и не оступитесь…
  - Рожденный убивать, Легионер Стервятников хорошо усвоил все заповеди охотника за головами, хитрость
    Стервятника ставит врагов в тупик и они сами того не подозревая подпускают его к своей спине. Жажда
    крови и богатой добычи — вот что движет стервятником всю его жизнь.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/stervyatnik.jpg
  schema_version: 1
