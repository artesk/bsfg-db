profession:
  descriptions:
  - Горец — Рыцарь Союза. Горцев тренируют по особой уникальной системе, в отличии от остальных Рыцарей
    их навыки больше направлены на несение урона, другими словами, главным принципом является «Лучшая
    защита — это нападение».
  - Каменный страж — Горцы, овладевшие древней магией камня, становятся Каменными стражами. Используя
    эти навыки они даже способны превратить себя в каменного голема, который особо эффективен против различных
    осадных построек. В трудные моменты может обратить в камень все вокруг, себя в том числе, что позволит
    более выгодно оценить ситуацию и принять верное решение.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2023/10/kamenii_straj.jpg
  schema_version: 1
