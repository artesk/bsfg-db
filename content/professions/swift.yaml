  original_url: https://db.bsfg.online/profession/swift/
profession:
  descriptions:
  - Рядовые Стрижей с детства обучались вести бой с несколькими противниками одновременно. Используя парные
    рапиры они с легкостью способны противостоять своим врагам. Обладают исключительной ловкостью, благодаря
    которой даже самым метким воинам будет сложно нанести им удар.
  - Совершенствую свои навыки Стрижи стали крайне серьезными противниками. Обладают способностями дезориентировать
    своих врагов, что позволяет им уворачиваться еще от большего количества атак. Стрижам не важно один
    враг перед ними или несколько, каждому их них придется выложиться на полную.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/orel.jpg
