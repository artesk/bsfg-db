source:
  data_sha256: e3d3632a5f9631a5087f618db6027b0b948216b2f9004df8ea8b58c82a6e1d70
  original_url: https://db.bsfg.online/profession/swordsinger/
profession:
  descriptions:
  - Поющие в Битве светлых эльфов обучены мастерству боя с парными клинками. Они сочетают это изящное
    искусство боя с боевыми песнями, ослабляющими врага и усиливающими союзников. Облачённые в лёгкие
    доспехи, быстро вклиниваясь в строй врага в пылу битвы, они способны подорвать силы противников и
    обеспечить победу для великого Альянса.
  - Издревле считалось, что слово — не просто звук, сотрясающий воздух и несет в себе определенную силу.
    Отдельная династия Менестрелей научилась управлять нитями энергии, обильно вплетенными в слова и звуки.
    Учитывая сложность существования в этом мире, все эльфы взяли в свои руки оружие, не стояла в стороне
    и династия талантливых Менестрелей. Пение в определенной тональности и ритмах заставляет клинок вибрировать
    в такт их слов, что и дает возможность повышать силу своих товарищей или наносить повреждения противникам.
    Но не только клинок может быть оружием, но и сама песня, менестрели способны сковать движения врагов
    и свести эффект вражеских заклинаний лечения на нет, искажая пространство вокруг себя звуками своих
    песен.
