profession:
  descriptions:
  - Волшебник Белатто — Маг Белатто с уникальными навыками. Использует одноручный меч и боевую книгу.
    Его уникальность заключается в том, что он на прямую наносит урон магией, а вкладывает ее силу в меч.
    Так как Волшебник Белатто предпочитает вести бой в ближнем бою, он также владеет разрушительной магией
    воздуха, которая наносит урон по нескольким противникам.
  - Сильф — овладев магией воздуха в совершенстве Волшебнику Белатто присваивается титул Сильфа, духа
    ветров. Повелевая всеми видами ветров, он способен использовать их для своих целей — нанести огромный
    урон по врагам, усилить себя, ускорить или даже излечить. Поскольку ему приходится всегда находиться
    в гуще событий, то он также очень хорошо защищен, а магия ветра помогает ему от атак с дальнего расстояния.
  parser_version: 1.0.0
