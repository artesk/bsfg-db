profession:
  descriptions:
  - Легкий воин Союза, который виртуозно владеет копьем и алебардой. Способен выбирать в какую именно
    часть тела врага нанести удар. Копейщик Союза крайне наблюдателен и может заметить врага на большом
    расстоянии и подготовиться к битве с ним. Превосходное владение пикой позволяет ему наносить серию
    ударов с максимальной скоростью.
  - Тактик — превосходный боец ближнего боя, специализирующийся на нанесении большого урона в одну цель.
    Развивая свои навыки способен провоцировать врага на атаку. Способен применять различные техники ведения
    боя, его способности позволяют в некоторых ситуациях использовать не только пику, но и ружье. Также
    может выбирать тактику ведения боя и узнавать слабые места конкретного врага, что позволяет наносить
    ему еще больше урона. Может использовать свое копье, как гарпун и притягивать противников к себе.
  parser_version: 1.0.0
