profession:
  descriptions:
  - Мастера клинков — это воины в тяжёлых доспехах, которые могут одинаково хорошо использовать как двуручные
    мечи, так и парные. Их атаки всегда очень сильны и отличаются большой точностью, в сражении лицом
    к лицу мало кто сможет устоять против такого противника, который сочетает в себе хорошую защиту от
    ударов и большую атакующую мощь.
  - Так же давно, как существуют рыцари, полагающиеся на крепость своего доспеха, существуют и воители,
    которые используют в бою древнее знание о контроле над созданиями, обитающими в других сферах. Имя
    этим воинам — Храмовники. Они научились вызывать из других миров существа, совершенно не похожие ни
    на одно из тех, что есть в этом мире. Призванные сущности приобретают форму крохотных кристаллов,
    левитирующих в воздухе. В силу своих особенностей они не могут находиться далеко от существа, к которому
    были прикреплены Храмовником, иначе их ждет развоплощение. Храмовники предпочитают тяжелую броню,
    так как она способна не раз сохранить своему хозяину жизнь. Их любимое оружие – тяжёлые двуручные
    мечи, которыми можно наносить сокрушительные удары.
