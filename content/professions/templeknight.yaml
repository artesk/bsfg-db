  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Эти воины избрали для себя путь защитника, того, кто стоит в первых рядах в атаке, и прикрывает спины
    своих союзников при отступлении. Экипированные тяжёлой броней и щитом, они обучены особому мастерству
    защиты, которое позволяет им с лёгкостью отражать атаки с помощью щита, и легко переносят вред, причиняемый
    даже самыми сокрушительными заклинаниями. Это единственные воины, способные использовать свой щит,
    как оружие, но при этом они вынуждены использовать одноручное оружие, поэтому их атакующий потенциал
    меньше, чем у других воинов.
  - Фанатичные Рыцари Света издавна служили религиозным культам альянса, сторожа покой монастырей, храмов
    и других святых для эльфов мест. Даже сейчас, когда жар бесконечных сражений и жажда крови вытеснили
    веру из сердец эльфов, Рыцари света остаются едва ли не единственными, кто продолжает нести слово
    Света в своих сердцах. Как яркий свет привлекает мотыльков, так и Рыцари Света способны привлекать
    к себе своих врагов. И точно так же обжигать их, не позволяя сбежать или изменить намерения. Их вера
    в Свет столь сильна, что в отчаянных ситуациях их способности увеличиваются на недосягаемую высоту,
    а яркий свет источаемый их оружием — обжигать врагов. Рыцари света носят лучшую броню Альянса, зачарованную
    особым образом для отражения вредоносных эффектов.
