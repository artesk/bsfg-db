source:
  data_sha256: cd69fd630c27732aa633809144d0cd4474c44e02a724832d7adf02c9dad9c20a
  original_url: https://db.bsfg.online/profession/thief/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Воры всегда существовали в Империи, но чтобы выживать в состоянии бесконечной войны, им приходилось
    адаптировать свои умения, чтобы суметь постоять за себя, когда враг придёт, и отступать будет некуда.
    Они способны незаметно и быстро подобраться к противнику и нанести серию подлых ударов кинжалом в
    спину, после которых слабо защищённый воин или маг вряд ли останется жив. Скрытность их скорость —
    это главное оружие воров.
  - Обычно авантюристы предпочитают атаковать неожиданно и подло. Они нападают только тогда, когда уверены
    в своем превосходстве. Затаившись в тени, вор будет выжидать удачного момента, чтобы всадить кинжал
    в спину своей жертвы. При малейшей опасности вор может притвориться мертвым и избежать возможных проблем.
    Будьте начеку, когда вор рядом, эти мастера карманных краж никогда не пройдут мимо полного кошелька.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/avanturist.jpg
