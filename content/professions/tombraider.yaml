profession:
  descriptions:
  - Могильщик — Тяжелый воин Доминиона, использующий в качестве оружия кастеты. В своем арсенале имеет
    большое количество атакующих умений, а также навыки, позволяющие наносить еще больше повреждений противнику.
    Исследуя древнюю гробницу был проклят и теперь способен вместо смерти обратиться в безмозглую нежить,
    неспособную не на что, кроме как наносить огромный урон своими лапами.
  - Расхититель гробниц — исследователь различный древних развалин, гробниц и захоронений. Опыт в исследованиях
    помогает ему лучше ориентироваться и быстрее передвигаться в закрытых помещениях, а также при исследовании
    мира или охотясь на монстров. Некоторые находки в гробницах Расхититель использует в бою, благодаря
    им, он способен становиться неуязвимым или накладывать проклятье разложения на врага. Из-за своего
    проклятия мумификации обладает глубокими познаниями в загробном мире, что позволяет ему вернуть союзника
    к жизни или же запретить такое действия в отношении врага.
