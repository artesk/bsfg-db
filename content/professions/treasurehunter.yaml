profession:
  descriptions:
  - Путешественник — особые воины Империи, убийцы. Владение одноручным кинжалом, способность быстро преодолевать
    расстояние — вот, что делает их крайне опасными для слабо защищенных бойцов. Они не когда не сидят
    на одном месте, их тянет на приключения и освоение мира. Путешествуя налегке, их трудно выследить
    и мало кто сможет их преследовать.
  - Искатели сокровищ всегда находятся в поиске различных артефактов и реликвий. Зарабатывая этим на жизнь,
    они приобрели различных знакомых среди торговцев, которые скупают предметы дороже. Также, считая себя
    самыми важными бойцами на поле боя, они требуют у Империи повышенного жалования. Искатели сокровищ
    отточили свой навык маскировки до такого уровня, что абсолютно никто не сможет их обнаружить. Их высокомерие
    и подлость проявляется не только в денежных отношениях. Они способны без сомнений воткнуть свой кинжал
    во врага и наблюдать за его мучениями, либо может смазать свой кинжал отравой, которая парализует
    противника. Но при всем этом Искатели сокровищ являются превосходными бойцами, которые способны нанести
    огромный урон врагу и при желании уклоняться от всех его атак.
