source:
  data_sha256: e08856ca1e402393ecdfccde4482ed58d134dfa6024a998ccac5abf1db7f2d02
  original_url: https://db.bsfg.online/profession/tyrant/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Некоторые воины Орды выбирают путь лучника. Телосложение орков не слишком подходит для этого ремесла,
    тем не менее мощь их выстрелов огромна и несёт с собою смерть и разрушения, а телосложение этих воинов
    делает их более крепкими в сравнении с лучниками других рас. Они — сила, с которой приходится считаться.
  - Изнурительные физические упражнения и тренировки духа, позволили тирану в совершенстве овладеть оружием
    дальнего боя. Благодаря тренировкам сознания, тиран фокусирует свою силу и делает мощнейшие выстрелы,
    оглушающие и даже отбрасывающие противника.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/tiran.jpg
