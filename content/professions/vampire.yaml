source:
  data_sha256: 829ebe9781bf9f1dcbc7508bb1f3c23760aa83f52ec9f6259c6d4ad53d4bb0d7
  original_url: https://db.bsfg.online/profession/vampire/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Эти воины используют острые когти, разрывающие броню и плоть своих врагов. Они отлично приспособлены
    для боёв против одиночных противников, но эффективно сражаться против нескольких противников не могут.
  - Воины, вышедшие из тьмы, способные стать оружием убийства, уничтожающим всё на своём пути, и при этом
    обладающие отличной скрытностью, и возможностью усыплять противника на время. Запретная техника темной
    магии позволяет им высасывать жизнь из противника. Они имеют отличные способности к быстрому передвижению,
    становясь идеальным оружием для уничтожения вражеских магов, лекарей и лучников. Лишь наступает ночь,
    и они выходят на охоту.
