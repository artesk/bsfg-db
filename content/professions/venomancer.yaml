source:
  data_sha256: 3d81c8afa037b4a954b69df982493c18af7a10c906c6ce00478df6b77b8c717b
  original_url: https://db.bsfg.online/profession/venomancer/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Знаток ядов — колдун Орды, который предпочитает чтобы их противник испытывал мучения в бою с ним.
    Насылает на врага болезни и проклятия, которые помогают ослабить противника.
  - Ядомант — Знатоки ядов, которые продолжили изучать свойства различных отравляющих веществ, достигли
    уровня Ядоманта. Из-за постоянных опытов сами они стали невосприимчивы ко всем видам ядов и кровотечений.
    Также Ядомантам удалось найти применение некоторым отравам для усиления своих характеристик, хоть
    и взамен потери небольшого количества здоровья. Каждый Ядомант приручает себе ядовитого паука, который
    помогает дополнительно насылать на врага еще одну болезнь.
  parser_version: 1.0.0
