  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Уже на начальном этапе новичку Грифов доступны навыки выживания в бою и кузнечного дела. Смельчаки
    прошедшие путь до Легионера Грифов получают уникальные способности, осадные сооружения и возможность
    повелевать чужими существами.
  - Легионер Грифов хорош в обороне и один из лучших бойцов на осадах. В его арсенале есть вызов огненного
    дракона и каменного стража, осадный потенциал которых чертовски велик. Универсальность опытного Грифы
    позволяет ему использовать магию поддержки и провокацию противника вместе с огненными и ошеломляющими
    ударами его осадных существ.
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/11/grif.jpg
