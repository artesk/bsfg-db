  client_release: 2026.11.06.171000
profession:
  descriptions:
  - После многолетней междоусобной войны, родной мир Белатто был практически уничтожен. Ненависть Белатто
    друг к другу и их уникальная магия привлекли взор древнего зла, таинственной сущности, пожирающей
    целые миры. Поскольку Белатто были разрозненны, им не удалось одолеть эту угрозу. Единственный выход
    был — покинуть свой родной мир. Маги Белатто — Друиды — открыли портал в неизведанный мир, но для
    них это была последняя надежда на спасение. Оказалось, что в их новом доме также не все спокойно и
    в нем идет война между шестью фракциями разных рас, которые увидели в Белатто сильных союзников и
    каждый хотел видеть их в своих рядах. Но даже объединение ради спасения расы не позволило забыть им
    о старом конфликте и Белатто начали присоединяться к другим расам, с которыми у них совпадали цели
    и убеждения. Ремесленник Белатто — профессия говорит сама за себя. Единственные из своей расы, кто
    овладел ремеслом создания предметов. Также кроме этих уникальных способностей, Ремесленники являются
    отличными лучниками. Способны наносить огромные повреждения противникам с большого расстояния, бить
    по больным точкам врага и производить атаки оглушающей силы.
  - Странники разбираются в оружие лучше всех в своей расе, ведь они его создают. Поэтому они способны
    выбирать тип лука, с которым они будут противостоять врагам, извлекая из каждого дополнительные свойства.
    Также они не когда не бросят своего союзника на поле боя, оказывая ему неотложную помощь, Странники
    снимают с него все проклятия и помогают залечить раны. Как и другие представители своей расы, Странник
    тесно связан с природой и способен призывать себе на помощь питомца, который всегда выручит в трудную
    минуту.
