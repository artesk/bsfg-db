profession:
  descriptions:
  - Пикейщики — это лёгкая пехота, быстрая и опасная. Застигая врага врасплох, даже один воин сможет задержать
    и оттеснить врага назад. Многие приёмы пикейщиков способны поражать сразу нескольких врагов, повреждая
    и оглушая их, а умение метать копья не позволит врагам сбежать.
  - Этот закалённый боями и сражениями воитель — мастер древкового оружия, такого как пики и алебарды.
    На всем материке мало кто может сравнится с ним в искусстве владения этим оружием. Недаром он носит
    прозвище Повелителя Битвы. Когда приходит час сражения, он превращается в жестокого берсерка, способного
    в одиночку сражаться сразу с несколькими противниками. Он привносит хаос во вражеские ряды, деморализуя
    врагов Империи леденящими душу боевыми кличами. Предпочитающий атаковать, а не защищаться, этот боец
    носит легкую броню, не стесняющую движений. В Империи нет более яростных и жестоких воинов, целиком
    и полностью отдающих себя сражению, воинов, которые упиваются звуками и красками битвы так, как если
    бы они наслаждались весёлой пирушкой.
