source:
  data_sha256: 2fe347145bfb6adafd00ad1968b07498d6fcf2715ec544fd18fa160a7218bdc0
  original_url: https://db.bsfg.online/profession/warsmith/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Мастера топора годами изучают древнее боевое искусство, проводя свои дни в битвах и усердных тренировках.
    Ко всему прочему, они изучают тактику ведения боя, и способны усиливать атакующие способности своих
    союзников и повышать их боевой дух. Эти воины в лёгкой броне могут быстро навести смуту и хаос в рядах
    врагов, и выбраться оттуда до того, как там станет слишком жарко.
  - Дварфы, чьи руки не лежат к работе в шахте, инженерии и алхимии, посвящают себя военному ремеслу.
    С ранних лет они тренируются в обращении с дробящим оружием и разучивают древнюю магию предков, магию
    грома и молнии. Военный мастер, изучивший такую магию, может без труда оглушить противника громом
    или создать вокруг себя щит молний, который увеличит жизненные силы и будет поглощать часть урона
    от магии неприятеля. Из экипировки Боевые Кузнецы предпочитают легкую броню, не сковывающую движений,
    чтобы быстрее наносить оглушающие и круговые удары.
