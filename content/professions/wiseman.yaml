  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Медиумы обучены базовым приёмам лечения, но больше специализируются на работе с магией. Они способны
    усилить способности магов в своём отряде, увеличивая их атакующую мощь и скорость чтения заклинаний.
    Они могут быстро восстанавливать боевой дух своей группы, и в случае необходимости открывать портал
    в столицу для экстренного отступления. В отличие от лекарей, их боевой потенциал несколько выше, поэтому
    медиумы могут причинить противнику ощутимый ущерб, если тот недооценит их.
  - Маги Альянса, научившиеся усиливать магические способности у своих собратьев с помощью только им известных
    заклинаний, они способны ускорить чтение магических заклинаний, силу магических атак, пополнить запас
    магической энергии. Мудрецы способны обнаружить недостатки в защите врага как обычной, так и в магической,
    и использовать их для увеличения повреждений по цели у всей своей группы.
