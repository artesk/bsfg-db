profession:
  descriptions:
  - Темные охотники — это тяжёлые воины Доминиона, которые отлично владеют одноручным мечом. Используя
    в своем арсенале боевые книги, Темные охотники приобретают знания, которые помогаю им либо сокрушить
    противника максимально быстро, либо защититься от их атак. Темные охотники владеют черной магией,
    которая дает им возможность осквернять землю вокруг себя. Внутри этой оскверненной зоны они усиливают
    свои способности, что делает их очень опасными в ближнем бою. Темные охотники не владеют проклятьями,
    которые можно было бы использовать на большом расстоянии. Но они владеют большим количеством атакующих
    способностей.
  - Ведьмаки искусно владеют как мечом, так и магией. Они долгое время изучали темную магию, некромантию
    и даже давно забытую, древнюю магию, что помогло им освоить более мощные магические силы — черную
    магию. С помощью нее Ведьмаки способны усиливать свои атакующие и защитные способности. По мимо владения
    магией Ведьмаки являются очень сильными бойцами, способными быстро перемещаться к противникам и наносить
    им сокрушительные удары. Все больше углубляясь в изучение черной магии, Ведьмаки научились высвобождать
    свое внутренне зло — исчадие подземного мира. Изучение некромантии также не прошло зря для Ведьмаков…
    Они способны взывать к духам умерших, которые помогают Ведьмакам на поле боя, усиливая или защищая
    их. Мало кому удавалось выжить после встречи с Ведьмаком, но тот кто выжил и скрылся от него — запомнил
    этот день навсегда…
