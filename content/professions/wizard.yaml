profession:
  descriptions:
  - Колдуны глубоко изучают не только магию воды, но и прочие магические дисциплины. В их арсенале есть
    немного заклинаний, направленных на уничтожение противника, и масса заклинаний, способных нейтрализовать
    как одного, так и нескольких противников сразу, сделать их слабыми и незащищёнными, заставить заснуть
    или бежать в страхе целый строй, или же сильно отравить и заморозить своего противника.
  - Заклинатели – приверженцы чистой линии гильдии магов Воды и Льда, все их заклинания – результат многих
    веков изучения водной стихии. Они способны быстро заморозить любого врага, и уничтожить его сокрушающей
    силой воды прежде, чем он поймёт, что произошло. Во все свои заклинания Заклинатели вплетают элементы
    льда, которые замораживают его врагов, снижая их скорость и атакующие способности, а их особое заклинание
    постепенно снижает сопротивление жертвы к стихии воды. Но это ещё не всё, на что способны Заклинатели,
    они окружают себя ледяной аурой, которая замораживает всех противников, которые пытаются атаковать
    Заклинателя, делая его очень тяжёлой целью для любого воина или мага.
