  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Эти воины используют острые когти, разрывающие броню и плоть своих врагов. Они отлично приспособлены
    для боёв против одиночных противников, но эффективно сражаться против нескольких противников не могут.
  - Одни из самых опасных воинов ближнего боя. Используя боевые когти, росомахи разрывают жертву в клочья.
    Посвятившие жизнь изучению энергии своего тела, они способны использовать кровь противника, как катализатор,
    для усиления метаболизма и повышения своих боевых качеств. Отсутствуют такие противники, которые в
    честном бою смогли б заставить росомаху отступить. Гордые, заносчивые и, зачастую, самоуверенные воины,
    презрев собственную защищённость, бьются на смерть и предпочитают легкую броню, не стесняющую движений.
    А как же иначе? Главное пустить кровь жертве, а первобытная мощь и идеальная боевая подготовка сделают
    свое жуткое дело.
