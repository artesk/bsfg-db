source:
  data_sha256: 4e2fc1c690635a7d7365ed216f15c0921ba8cc29e5d827db6b31cb5d00b4ca17
  original_url: https://db.bsfg.online/profession/zealot/
  client_release: 2026.11.06.171000
profession:
  descriptions:
  - Медиумы обучены базовым приёмам лечения, но больше специализируются на работе с магией. Они способны
    усилить способности магов в своём отряде, увеличивая их атакующую мощь и скорость чтения заклинаний.
    Они могут быстро восстанавливать боевой дух своей группы, и в случае необходимости открывать портал
    в столицу для экстренного отступления. В отличие от лекарей, их боевой потенциал несколько выше, поэтому
    медиумы могут причинить противнику ощутимый ущерб, если тот недооценит их.
  - 'Только истинный Фанатик волшебства может заставить виться магические нити так, как он этого захочет.
    Только Фанатик может воздействовать на магию Доминиона, ускоряя её вызов, разрушительную мощь, или
    восстанавливая ментальную силу своих братьев и сестер. Хотя они до конца не избавились от печати тьмы:
    они используют заклинание обмена жизнью, обмениваясь свои здоровьем с врагами. Находящийся на грани
    смерти жрец, может обменяться своим здоровьем с врагом, кардинально изменив положение, а затем и добить
    зарвавшегося бойца. Из-за этого заклинания Фанатиков опасаются многие воины на поле боя, поскольку
    счёт погибших из-за него самонадеянных юнцов исчисляется уже сотнями.'
  parser_version: 1.0.0
  photo: https://db.bsfg.online/wp-content/uploads/2018/10/fanatik.jpg
