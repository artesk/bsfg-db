  metrics:
  - name: Физическая защита стрелков
  - name: Физическая защита остальных классов
    scope: Убийцы, лёгкие и тяжёлые воины, мастера войны, рыцари, маги, лекари, менталисты и чародеи
  - name: Восстановление здоровья за 4 секунды
    scope: Любая броня
  - name: Запас здоровья
  - name: Запас стамины
  abilities:
  - level: 50
    name: Стальная оболочка
    audience: Воины
    description: Помогает выдерживать физический и магический урон от других игроков.
    effects:
    - [Магическая защита в PvP (любая броня), 7%]
    - [Физическая защита в PvP (любая броня), 7%]
  - level: 50
    name: Стальная оболочка
    audience: Магические профессии
    description: Помогает выдерживать физический и магический урон от других игроков.
    effects:
    - [Магическая защита в PvP (любая броня), 7%]
    - [Физическая защита в PvP (любая броня), 7%]
  - level: 100
    name: Здоровяк
    description: Повышает пределы здоровья и боевого духа и прибавляет жалование, дублоны или плеть за боевые действия расы.
    effects:
    - [Получаемое жалование, 5%]
    - [Запас здоровья, 10%]
    - [Запас боевого духа, 10%]
  - level: 150
    name: Непоколебимая стойкость
    description: Повышает базовую характеристику «Тело».
    effects: []
