- slug: intellect
  name: Интеллект
  role: Маг
  source: https://db.bsfg.online/spec/talent_intellect
  metrics:
  - name: Магическая атака
    scope: Любая броня
  - name: Скорость чтения заклинаний
    scope: Любая броня
  abilities:
  - level: 50
    name: Шипы
    audience: Воины
    description: У воинов периодически срабатывает дополнительный физический урон. Убийцы наносят фиксированный урон и ослабляют защиту цели от острого оружия. Рыцари получают дополнительный фиксированный урон.
    effects: []
  - level: 50
    name: Сильная мысль
    audience: Магические профессии
    description: Усиливает магические атаки против других игроков.
    effects:
    - [Сила магических умений в PvP, 3%]
  - level: 100
    name: Тайное знание
    description: Даёт магическую атаку, ускоряет атаки и применение заклинаний и повышает предел скорости чтения. В бою теряется меньше славы.
    effects:
    - [Уменьшение потери славы, 10 ед.]
    - [Магическая атака (любая броня), 10%]
    - [Скорость чтения заклинаний (любая броня), '2,5%']
    - [Скорость атаки (любая броня), '2,5%']
    - [Предел скорости чтения заклинаний, '50']
  - level: 150
    name: Непревзойденный интеллект
    description: Повышает базовую характеристику «Разум».
    effects: []
