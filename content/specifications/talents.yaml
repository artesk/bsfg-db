- slug: wisdom
  name: Мудрость
  role: Колдун
  source: https://db.bsfg.online/spec/talent_wisdom
  metrics:
  - name: Шанс магического крита
  - name: Сила магического крита
  - name: Магический вампиризм
  abilities:
  - level: 50
    name: Рваные доспехи
    audience: Воины
    description: При попадании атака ослабляет физическую защиту цели, замедляет её и снижает получаемое лечение и восстановление боевого духа.
    effects:
    - [Физическая защита (любая броня), −10%]
    - [Скорость бега (любая броня), −15%]
    - [Эффективность лечения, −8%]
    - [Эффективность восстановления боевого духа, −8%]
  - level: 50
    name: Печаль
    audience: Магические профессии
    description: Магические атаки ослабляют физическую и магическую атаку цели и силу её критов.
    effects:
    - [Магическая атака (любая броня), −10%]
    - [Физическая атака (любое оружие), −6%]
    - [Сила физического крита, −6%]
    - [Сила магического крита, −6%]
  - level: 100
    name: Острая магия
    description: Усиливает магические криты и повышает шанс их нанести. Увеличивает награды за задания в зоне высадки.
    effects:
    - [Сила магического крита, 5%]
    - [Шанс магического крита, 2 ед.]
    - [Бонус награды, 20%]
  - level: 150
    name: Необъятная мудрость
    description: Повышает базовую характеристику «Знания».
    effects: []
