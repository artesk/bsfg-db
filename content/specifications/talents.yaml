  name: Духовность
  role: Лекарь
  source: https://db.bsfg.online/spec/talent_spirit
  metrics:
  - name: Магическая защита
    scope: Любая броня
  - name: Эффективность лечения
  - name: Сила лечения
  - name: Шанс отменить умение
  - name: Перезарядка магических умений
  - name: Перезарядка физических умений
  - name: Эффективность восстановления боевого духа
  - name: Сила восстановления боевого духа
  - name: Запас стамины
  abilities:
  - level: 50
    name: Баланс жизни
    audience: Воины
    description: Усиливает физические атаки и защиту воина. Полученное лечение дополнительно повышает защиту.
    effects:
    - [Физический урон в PvP, 2%]
    - [Сила физических умений в PvP, 2%]
    - [Физическая защита (любая броня), 7%]
    - [Магическая защита (любая броня), 7%]
  - level: 50
    name: Баланс жизни
    audience: Магические профессии
    description: Усиливает магические атаки и защиту мага. Полученное лечение дополнительно повышает защиту.
    effects:
    - [Сила магических умений в PvP, 2%]
    - [Физическая защита (любая броня), 7%]
    - [Магическая защита (любая броня), 7%]
  - level: 100
    name: Восполнение
    description: Усиливает получаемое лечение и восстановление боевого духа. За боссов континента полагается повышенная награда.
    effects:
    - [Эффективность лечения, 15%]
    - [Эффективность восстановления боевого духа, 15%]
    - [Бонус награды, 20%]
  - level: 150
    name: Неподдельная духовность
    description: Повышает базовую характеристику «Дух».
    effects: []
