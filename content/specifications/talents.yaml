- slug: dexterity
  name: Ловкость
  role: Убийца
  source: https://db.bsfg.online/spec/talent_dexterity
  metrics:
  - name: Скорость бега
    scope: Любая броня
  - name: Скорость атаки
    scope: Любая броня
  - name: Шанс критического удара
  abilities:
  - level: 50
    name: Запах крови
    audience: Воины
    description: После нанесения урона воин быстрее бежит и чаще наносит критические удары. Пауза между выстрелами в лёгкой броне сокращается.
    effects:
    - [Задержка между выстрелами (лёгкая броня), −10%]
    - [Скорость бега (любая броня), 7 ед.]
    - [Шанс критического удара, 10%]
  - level: 50
    name: Сгусток
    audience: Магические профессии
    description: Ослабляет магическую защиту цели, замедляет её и ухудшает получаемое лечение и восстановление боевого духа.
    effects:
    - [Магическая защита (любая броня), −13%]
    - [Скорость бега (любая броня), −10%]
    - [Эффективность лечения, −13%]
    - [Эффективность восстановления боевого духа, −13%]
  - level: 100
    name: Стремительность
    description: Повышает обычную и предельную скорость атаки, а у убийц также силу критов. Даёт больше награды за убийство противника.
    effects:
    - [Предел скорости атаки, '35']
    - [Скорость атаки (любая броня), '2,5%']
    - [Бонус усиления, 20%]
  - level: 150
    name: Неповторимая ловкость
    description: Повышает базовую характеристику «Умения».
    effects: []
