  <template id="world-map-template">
    <section class="world-map">
      <div class="map-shell">
        <div id="map-viewport" class="map-viewport" tabindex="0" role="region" aria-label="Карта мира">
          <div id="map-stage" class="map-stage"></div>
        </div>
        <div class="map-hud">
          <header class="map-heading">
            <p class="eyebrow">Battles for Glory</p>
            <h1>Карта мира</h1>
            <div class="map-search">
              <label class="map-search-field">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
                <input id="map-search" type="search" autocomplete="off" placeholder="Найти место или босса" aria-label="Найти место или босса" aria-controls="map-matches">
              </label>
              <div id="map-matches" class="map-matches" role="group" aria-label="Результаты поиска" hidden></div>
            </div>
          </header>
          <div class="map-compass" aria-hidden="true"><span>N</span><span>✧</span></div>
          <div class="map-bottom">
            <div class="map-info" id="map-info" aria-live="polite" hidden></div>
            <div class="map-zoom" role="group" aria-label="Масштаб карты">
              <button id="map-zoom-in" type="button" aria-label="Увеличить масштаб">+</button>

              <button id="map-fit" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>Вся карта</button>
            </div>
          </div>
          <div class="map-layers">
            <div id="map-primary-layers" class="map-primary-layers" role="group" aria-label="Основные слои"></div>
            <details class="map-extra-layers">
              <summary>Ещё слои</summary>
              <div class="map-layer-menu">
                <div class="map-layer-actions">
                  <button id="map-all-layers" type="button">Все слои</button>
                  <button id="map-default-layers" type="button">По умолчанию</button>
                </div>
                <div id="map-layers"></div>
              </div>
            </details>
          </div>

      </dialog>

      <div id="jewelry-results" class="jewelry-results"></div>
      <div id="empty-jewelry" class="empty-state" hidden><p>Боссы и украшения по этому запросу не найдены.</p></div>
      <p class="enchant-source">Данные клиента BSFG <span id="jewelry-client-release"></span> · <a id="jewelry-source" target="_blank" rel="noreferrer">Архивная таблица BSFG ↗</a></p>
    </article>
  </template>

  <template id="catalog-template">
    <section class="hero">
      <p class="eyebrow">База знаний</p>
      <h1>Профессии BSFG</h1>
      <p class="hero-copy">Описания профессий, умения и ветки развития.</p>
    </section>
    <section class="catalog-shell">
      <div class="toolbar">
        <label class="search-box">
          <span class="visually-hidden">Найти профессию</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="profession-search" type="search" placeholder="Найти профессию…" autocomplete="off">
        </label>
        <label class="filter-box"><span>Фракция</span><select id="faction-filter"><option value="">Все</option></select></label>
        <p id="result-count" class="result-count" role="status"></p>
      </div>
      <fieldset id="class-filters" class="class-filters" hidden>
        <legend>Классы</legend>
        <div id="class-options" class="class-options"></div>
      </fieldset>
      <div id="profession-groups" class="profession-groups"></div>
      <div id="empty-catalog" class="empty-state" hidden>
        <h2>Ничего не найдено</h2><p>Попробуйте изменить запрос или фильтры.</p>
      </div>
    </section>
  </template>

  <template id="detail-template">
    <article class="profession-page">
      <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a href="#/professions">Все профессии</a><span>/</span><span id="crumb-title" aria-current="page"></span>
      </nav>
      <div class="profession-layout">
        <header class="profession-profile">
          <div id="profession-avatar" class="profession-avatar"></div>
          <div class="profession-heading">
            <p id="profession-class" class="eyebrow"></p>
            <h1 id="profession-title"></h1>
            <details class="profession-description">
              <summary>О профессии</summary>
              <div id="profession-descriptions"></div>
            </details>
          </div>
          <div class="profession-level-filter">
            <label for="profession-skill-level">Уровень всех умений</label>
            <select id="profession-skill-level" aria-describedby="profession-skill-level-hint">
              <option value="">Максимальный</option>
            </select>
            <p id="profession-skill-level-hint">Если уровня нет, показывается ближайший меньший или минимальный.</p>
          </div>
        </header>
        <section class="skills-shell" aria-labelledby="active-section-title">
          <h2 id="active-section-title" class="visually-hidden">Умения и уровни</h2>
          <div class="skills-heading">
            <div id="section-tabs" class="section-tabs" role="tablist" aria-label="Разделы умений"></div>
            <label class="search-box compact">
              <span class="visually-hidden">Найти умение</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
              <input id="skill-search" type="search" placeholder="Найти умение…" autocomplete="off">
            </label>
          </div>
          <div id="skills-list" class="skills-list"></div>
          <div id="empty-skills" class="empty-state" hidden><p>Умений с таким названием нет.</p></div>
        </section>
      </div>
    </article>
  </template>

  <script src="assets/map.js?v=map-expedition" defer></script>
  <script src="assets/app.js?v=minotaur-guide" defer></script>
</body>
</html>
