<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="База знаний BSFG о профессиях, умениях и характеристиках">
  <title>База знаний BSFG</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="База знаний BSFG, главная">
      <span class="brand-mark">B</span>
      <span><strong>BSFG</strong><small>база знаний</small></span>
    </a>
    <nav class="site-nav" aria-label="Разделы сайта">
      <a href="#/professions">Профессии</a>
      <a href="#/specifications">Характеристики</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer><p>Неофициальные данные, собранные сообществом.</p></footer>

  <template id="loading-template">
    <section class="loading-state" role="status">
      <div class="loader"></div><p>Загружаю страницу…</p>
    </section>
  </template>

  <template id="home-template">
    <section class="hero">
      <h1>База знаний BSFG</h1>
      <p class="hero-copy">Справочник по профессиям, умениям и характеристикам Battles for Glory.</p>
    </section>
    <div class="directory-grid">
      <a class="directory-link" href="#/professions">
        <h2>Профессии</h2>
        <p>Каталог по фракциям и классам с описаниями, умениями и ветками развития.</p>
      </a>
      <a class="directory-link" href="#/specifications">
        <h2>Характеристики</h2>
        <p>Улучшения умений и их эффекты по уровням.</p>
      </a>
    </div>
  </template>

  <template id="specifications-template">
    <section class="hero">
      <h1>Характеристики</h1>
      <p class="hero-copy">Улучшения умений и их эффекты по уровням.</p>
    </section>
    <div class="directory-grid">
      <a class="directory-link" href="#/specifications/enchant-skills">
        <h2>Заточка скиллов</h2>
        <p>Эффекты заточки для оружия, брони и других типов умений.</p>
      </a>
    </div>
  </template>

  <template id="enchant-template">
    <article class="enchant-page">
      <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a href="#/specifications">Характеристики</a><span>/</span><span aria-current="page">Заточка скиллов</span>
      </nav>
      <header class="hero">
        <h1>Заточка скиллов</h1>
        <p class="hero-copy">Выберите тип заточки, чтобы сравнить эффекты на разных уровнях.</p>
      </header>
      <fieldset class="class-filters">
        <legend>Тип заточки</legend>
        <div id="enchant-options" class="class-options"></div>
      </fieldset>
      <section id="enchant-category" aria-labelledby="enchant-title"></section>
      <p class="enchant-source"><a id="enchant-source" target="_blank" rel="noreferrer">Архивная таблица BSFG ↗</a></p>
    </article>
  </template>

  <template id="catalog-template">
    <section class="hero">
      <p class="eyebrow">База знаний</p>
      <h1>Профессии BSFG</h1>
      <p class="hero-copy">Описания профессий, умения и ветки развития.</p>
    </section>
    <section class="catalog-shell">
      <div class="toolbar">
        <label class="search-box">
          <span class="visually-hidden">Найти профессию</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="profession-search" type="search" placeholder="Найти профессию…" autocomplete="off">
        </label>
        <label class="filter-box"><span>Фракция</span><select id="faction-filter"><option value="">Все</option></select></label>
        <p id="result-count" class="result-count" role="status"></p>
      </div>
      <fieldset id="class-filters" class="class-filters" hidden>
        <legend>Классы</legend>
        <div id="class-options" class="class-options"></div>
      </fieldset>
      <div id="profession-groups" class="profession-groups"></div>
      <div id="empty-catalog" class="empty-state" hidden>
        <h2>Ничего не найдено</h2><p>Попробуйте изменить запрос или фильтры.</p>
      </div>
    </section>
  </template>

  <template id="detail-template">
    <article class="profession-page">
      <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a href="#/professions">Все профессии</a><span>/</span><span id="crumb-title" aria-current="page"></span>
      </nav>
      <div class="profession-layout">
        <aside class="profession-sidebar">
          <div class="profile-sticky">
            <section class="profession-profile">
              <div id="profession-avatar" class="profession-avatar"></div>
              <div class="profession-heading">
                <p id="profession-class" class="eyebrow"></p>
                <h1 id="profession-title"></h1>
                <p id="profession-summary"></p>
              </div>
            </section>
            <nav class="profession-nav" aria-label="Разделы профессии">
              <span>Разделы умений</span>
              <div id="section-tabs" class="section-tabs" role="tablist"></div>
            </nav>
          </div>
          <section id="profession-descriptions" class="description-panel"></section>
        </aside>
        <section class="skills-shell">
          <div class="skills-heading">
            <div>
              <p class="eyebrow">Полная карточка</p>
              <h2 id="active-section-title">Умения и уровни</h2>
            </div>
            <label class="search-box compact">
              <span class="visually-hidden">Найти умение</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
              <input id="skill-search" type="search" placeholder="Найти умение…" autocomplete="off">
            </label>
          </div>
          <div id="skills-list" class="skills-list"></div>
          <div id="empty-skills" class="empty-state" hidden><p>Умений с таким названием нет.</p></div>
        </section>
      </div>
    </article>
  </template>

  <script src="assets/app.js" defer></script>
</body>
</html>
