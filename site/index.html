<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="База знаний BSFG о профессиях, умениях, характеристиках и бижутерии пит-боссов. Гайды по игре.">
  <title>База знаний BSFG</title>
  <link rel="stylesheet" href="assets/styles.css?v=equipment-defense">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="База знаний BSFG, главная">
      <span class="brand-mark">B</span>
      <span><strong>BSFG</strong><small>база знаний</small></span>
    </a>
    <nav class="site-nav" aria-label="Разделы сайта">
      <a href="#/professions">Профессии</a>
      <a href="#/specifications">Характеристики</a>
      <a href="#/items/equipment">Экипировка</a>
      <a href="#/items/weapons">Оружие</a>
      <a href="#/items/pit-boss-jewelry">Бижутерия Пит-боссов</a>
      <a href="#/guides">Гайды</a>
      <a href="#/map">Карта</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer><p>Неофициальные данные, собранные сообществом.</p></footer>

  <template id="loading-template">
    <section class="loading-state" role="status">
      <div class="loader"></div><p>Загружаю страницу…</p>
    </section>
  </template>

  <template id="home-template">
    <section class="hero">
      <h1>База знаний BSFG</h1>
      <p class="hero-copy">Справочник по профессиям, умениям, характеристикам и экипировке Battles for Glory.</p>
    </section>
    <div class="home-grid">
      <div class="directory-grid">
        <a class="directory-link" href="#/professions">
          <h2>Профессии</h2>
          <p>Каталог по фракциям и классам с описаниями, умениями и ветками развития.</p>
        </a>
        <a class="directory-link" href="#/specifications">
          <h2>Характеристики</h2>
          <p>Заточка, свойства экипировки, знамёна, реликвии и военная служба.</p>
        </a>
        <a class="directory-link" href="#/items/equipment">
          <h2>Экипировка</h2>
          <p>Комплекты брони, украшения, щиты и другие предметы по рангам.</p>
        </a>
        <a class="directory-link" href="#/items/weapons">
          <h2>Оружие</h2>
          <p>Характеристики, эффекты и рецепты оружия по типам и рангам.</p>
        </a>
        <a class="directory-link" href="#/guides">
          <h2>Гайды</h2>
          <p>Руководства по строительству и игровым механикам.</p>
        </a>
        <a class="directory-link" href="#/map">
          <h2>Интерактивная карта</h2>
          <p>Боссы, города, аванпосты, книги секретов и точки сбора ресурсов.</p>
        </a>
      </div>
      <section class="home-stream" aria-labelledby="home-stream-title">
        <h2 id="home-stream-title">Автострим BSFG</h2>
        <div class="stream-screen">
          <video aria-labelledby="home-stream-title" playsinline preload="none"
            data-src="https://stream.bsfg-public.com/hls/stream/index.m3u8?cookieCheck=1"></video>
          <button class="stream-play" type="button">Смотреть эфир</button>
        </div>
        <p class="stream-status" role="status"></p>
        <a class="stream-link" href="https://www.bsfg.online/streams/" target="_blank" rel="noopener">Стримы на сайте BSFG ↗</a>
      </section>
    </div>
  </template>

  <template id="world-map-template">
    <section class="world-map">
      <header class="hero">
        <h1>Интерактивная карта BSFG</h1>
        <p class="hero-copy">Выберите слои или найдите метку по названию. Колёсико меняет масштаб, перетаскивание перемещает карту.</p>
      </header>
      <div class="map-layout">
        <aside class="map-controls" aria-label="Управление картой">
          <label class="progression-field"><span>Поиск метки</span><input id="map-search" type="search" autocomplete="off"></label>
          <label class="progression-field"><span>Результаты поиска</span><select id="map-matches"></select></label>
          <details class="map-layers" open>
            <summary>Слои карты</summary>
            <div class="class-options">
              <button id="map-all-layers" class="class-option" type="button">Все слои</button>
              <button id="map-default-layers" class="class-option" type="button">По умолчанию</button>
            </div>
            <div id="map-layers"></div>
          </details>
        </aside>
        <div class="map-panel">
          <div class="class-options map-zoom" role="group" aria-label="Масштаб карты">
            <button id="map-zoom-out" class="class-option" type="button" aria-label="Уменьшить масштаб">−</button>
            <button id="map-zoom-in" class="class-option" type="button" aria-label="Увеличить масштаб">+</button>
            <button id="map-fit" class="class-option" type="button">Вся карта</button>
          </div>
          <div id="map-viewport" class="map-viewport" tabindex="0" role="region" aria-label="Карта мира">
            <div id="map-stage" class="map-stage"></div>
          </div>
          <div id="map-info" class="map-info" aria-live="polite">Выберите метку на карте или в результатах поиска.</div>
        </div>
      </div>
      <p class="enchant-source"><a id="map-source" target="_blank" rel="noreferrer">Архивная карта BSFG ↗</a></p>
    </section>
  </template>

  <template id="equipment-template">
    <article class="enchant-page equipment-catalog">
      <nav id="equipment-categories" class="equipment-categories"></nav>
      <div class="equipment-content">
        <header class="hero">
          <h1 id="equipment-title"></h1>
          <p id="equipment-intro" class="hero-copy"></p>
        </header>
        <div class="progression-toolbar equipment-toolbar">
          <label class="progression-field">
            <span>Ранг</span>
            <select id="equipment-rank"></select>
          </label>
          <label class="progression-field equipment-search-field">
            <span class="visually-hidden">Название, пометка или ID</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
            <input id="equipment-search" type="search" placeholder="Название, пометка или ID" autocomplete="off">
          </label>
        </div>
        <section aria-labelledby="equipment-category-title">
          <div class="equipment-category-heading">
            <h2 id="equipment-category-title" class="enchant-title"></h2>
            <p id="equipment-count" class="equipment-count" role="status"></p>
          </div>
          <div id="equipment-results" class="equipment-results"></div>
        </section>
        <p class="enchant-source">Данные клиента BSFG <span id="equipment-release"></span>. Каталог показывает характеристики базового предмета и рецепты, записанные в клиенте.</p>
      </div>
      <dialog id="equipment-dialog" class="equipment-dialog" aria-labelledby="equipment-dialog-title">
        <header class="equipment-dialog-heading">
          <h2 id="equipment-dialog-title" class="enchant-title"></h2>
          <form method="dialog">
            <button class="class-option" type="submit" autofocus>Закрыть</button>
          </form>
        </header>
        <div class="equipment-dialog-content"></div>
      </dialog>
    </article>
  </template>

  <template id="guides-template">
    <section class="hero">
      <h1>Гайды</h1>
      <p class="hero-copy">Руководства по Battles for Glory в Google Документах.</p>
    </section>
    <div class="directory-grid">
      <a class="directory-link" href="https://docs.google.com/document/d/1qi_X7XW1xMKW1lPrjKJ94wJB7509lHSP5-ZV52TzYbE/edit?tab=t.0" target="_blank" rel="noreferrer">
        <h2>Строения гайд (для игроков) ↗</h2>
        <p>Как построить личный дом и какие бонусы он даёт.</p>
      </a>
      <a class="directory-link" href="https://docs.google.com/document/d/1nNq7HJVn_40CW4LXsckdDnjH-50g4O7XHGjK-ZPNwzc/edit?tab=t.0#heading=h.elyvbq7buhca" target="_blank" rel="noreferrer">
        <h2>Информация по игровым механикам ↗</h2>
        <p>Аспекты оружия и брони, манускрипты, маунты, Ловец и профессии.</p>
      </a>
    </div>
  </template>

  <template id="specifications-template">
    <section class="hero">
      <h1>Характеристики</h1>
      <p class="hero-copy">Эффекты заточки, свойства экипировки и бонусы по уровням.</p>
    </section>
    <div class="directory-grid">
      <a class="directory-link" href="#/specifications/enchant-skills">
        <h2>Заточка скиллов</h2>
        <p>Эффекты заточки для оружия, брони и других типов умений.</p>
      </a>
      <a class="directory-link" href="#/specifications/enchant-weapon">
        <h2>Улучшения оружия</h2>
        <p>Пассивные свойства оружия и щитов при улучшении до +4 по рангам BA–GM.</p>
      </a>
      <a class="directory-link" href="#/specifications/banners">
        <h2>Знамёна</h2>
        <p>Бонусы опыта, PvE и PvP по рангам знамён.</p>
      </a>
      <a class="directory-link" href="#/specifications/dragon-relics">
        <h2>Реликвии драконов</h2>
        <p>Пассивные бонусы и активные умения по уровням реликвий.</p>
      </a>
      <a class="directory-link" href="#/specifications/boss-trophies">
        <h2>Трофеи боссов</h2>
        <p>Базовые, объединённые и реликтовые трофеи с бонусами по уровням.</p>
      </a>
      <a class="directory-link" href="#/specifications/sibyl-cards">
        <h2>Карты Сивиллы</h2>
        <p>Пассивные бонусы, условия срабатывания и иконки карт из клиента.</p>
      </a>
      <a class="directory-link" href="#/specifications/equipment-properties">
        <h2>Свойства экипировки</h2>
        <p>Значения свойств по уровням с поиском по названию и эффекту.</p>
      </a>
      <a class="directory-link" href="#/specifications/military-service">
        <h2>Награды и медали за военную службу</h2>
        <p>Распределение лычек и таблицы эффектов по уровням.</p>
      </a>
    </div>
  </template>

  <template id="progression-template">
    <article class="enchant-page">
      <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a href="#/specifications">Характеристики</a><span>/</span><span id="progression-crumb" aria-current="page"></span>
      </nav>
      <header class="hero">
        <h1 id="progression-heading"></h1>
        <p id="progression-intro" class="hero-copy"></p>
      </header>
      <div id="progression-calculator"></div>
      <section aria-labelledby="progression-table-heading">
        <h2 id="progression-table-heading" class="enchant-title">Таблица эффектов</h2>
        <div class="progression-toolbar">
          <label id="progression-kind-field" class="progression-field" hidden>
            <span>Вид трофея</span>
            <select id="progression-kind"></select>
          </label>
          <label class="progression-field">
            <span>Поиск по названию или эффекту</span>
            <input id="progression-search" type="search" autocomplete="off">
          </label>
          <label class="progression-field">
            <span id="progression-group-label">Группа</span>
            <select id="progression-group"></select>
          </label>
        </div>
        <div id="progression-results"></div>
      </section>
      <p class="enchant-source">Данные клиента BSFG <span id="progression-release"></span></p>
    </article>
  </template>

  <template id="military-calculator-template">
    <section class="enchant-card military-calculator" aria-labelledby="military-heading">
      <h2 id="military-heading" class="enchant-title">Распределение лычек</h2>
      <div class="progression-toolbar">
        <span id="military-award-icon"></span>
        <label class="progression-field">
          <span>Награда</span>
          <select id="military-kind">
            <option value="order">Орден</option>
            <option value="insignia">Знак отличия</option>
            <option value="medal">Медаль</option>
          </select>
        </label>
        <label class="progression-field">
          <span>Ранг</span>
          <input id="military-rank" type="number" min="1" step="1" inputmode="numeric">
        </label>
      </div>
      <p id="military-budget" role="status"></p>
      <progress id="military-progress" aria-label="Использовано лычек"></progress>
      <ol id="military-slots" class="military-slots"></ol>
      <button id="military-reset" class="class-option" type="button">Сбросить все лычки</button>
      <p class="military-note">Планировщик считает одну лычку на ранг. Числовые подсказки взяты из клиентских таблиц наград и медалей. Для ветки PvP и уровней выше таблицы доступно распределение лычек. Лимиты отдельных веток для конкретного предмета задаёт сервер.</p>
    </section>
  </template>

  <template id="enchant-template">
    <article class="enchant-page">
      <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a href="#/specifications">Характеристики</a><span>/</span><span id="enchant-crumb" aria-current="page"></span>
      </nav>
      <header class="hero">
        <h1 id="enchant-heading"></h1>
        <p id="enchant-intro" class="hero-copy"></p>
      </header>
      <fieldset class="class-filters">
        <legend id="enchant-filter-label"></legend>
        <div id="enchant-options" class="class-options"></div>
      </fieldset>
      <section aria-labelledby="enchant-title">
        <h2 id="enchant-title" class="enchant-title"></h2>
        <div id="enchant-results"></div>
      </section>
      <p class="enchant-source"><a id="enchant-source" target="_blank" rel="noreferrer">Архивная таблица BSFG ↗</a></p>
    </article>
  </template>

  <template id="pit-jewelry-template">
    <article class="jewelry-page">
      <header class="hero">
        <h1>Бижутерия Пит-боссов</h1>
        <p class="hero-copy">Украшения рангов EL и MA. Выберите ранг или найдите нужного босса или предмет.</p>
      </header>
      <div class="jewelry-toolbar">
        <fieldset class="class-filters">
          <legend>Ранг</legend>
          <div id="jewelry-ranks" class="class-options"></div>
        </fieldset>
        <fieldset id="jewelry-variant-filter" class="class-filters" hidden>
          <legend>Качество</legend>
          <div class="class-options"></div>
        </fieldset>
        <label class="search-box">
          <span class="visually-hidden">Найти босса или украшение</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="jewelry-search" type="search" placeholder="Имя босса, название или ID предмета…" autocomplete="off">
        </label>
      </div>
      <div id="jewelry-results" class="jewelry-results"></div>
      <div id="empty-jewelry" class="empty-state" hidden><p>Боссы и украшения по этому запросу не найдены.</p></div>
      <p class="enchant-source">Данные клиента BSFG <span id="jewelry-client-release"></span> · <a id="jewelry-source" target="_blank" rel="noreferrer">Архивная таблица BSFG ↗</a></p>
    </article>
  </template>

  <template id="catalog-template">
    <section class="hero">
      <p class="eyebrow">База знаний</p>
      <h1>Профессии BSFG</h1>
      <p class="hero-copy">Описания профессий, умения и ветки развития.</p>
    </section>
    <section class="catalog-shell">
      <div class="toolbar">
        <label class="search-box">
          <span class="visually-hidden">Найти профессию</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="profession-search" type="search" placeholder="Найти профессию…" autocomplete="off">
        </label>
        <label class="filter-box"><span>Фракция</span><select id="faction-filter"><option value="">Все</option></select></label>
        <p id="result-count" class="result-count" role="status"></p>
      </div>
      <fieldset id="class-filters" class="class-filters" hidden>
        <legend>Классы</legend>
        <div id="class-options" class="class-options"></div>
      </fieldset>
      <div id="profession-groups" class="profession-groups"></div>
      <div id="empty-catalog" class="empty-state" hidden>
        <h2>Ничего не найдено</h2><p>Попробуйте изменить запрос или фильтры.</p>
      </div>
    </section>
  </template>

  <template id="detail-template">
    <article class="profession-page">
      <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a href="#/professions">Все профессии</a><span>/</span><span id="crumb-title" aria-current="page"></span>
      </nav>
      <div class="profession-layout">
        <header class="profession-profile">
          <div id="profession-avatar" class="profession-avatar"></div>
          <div class="profession-heading">
            <p id="profession-class" class="eyebrow"></p>
            <h1 id="profession-title"></h1>
            <details class="profession-description">
              <summary>О профессии</summary>
              <div id="profession-descriptions"></div>
            </details>
          </div>
          <div class="profession-level-filter">
            <label for="profession-skill-level">Уровень всех умений</label>
            <select id="profession-skill-level" aria-describedby="profession-skill-level-hint">
              <option value="">Максимальный</option>
            </select>
            <p id="profession-skill-level-hint">Если уровня нет, показывается ближайший меньший или минимальный.</p>
          </div>
        </header>
        <section class="skills-shell" aria-labelledby="active-section-title">
          <h2 id="active-section-title" class="visually-hidden">Умения и уровни</h2>
          <div class="skills-heading">
            <div id="section-tabs" class="section-tabs" role="tablist" aria-label="Разделы умений"></div>
            <label class="search-box compact">
              <span class="visually-hidden">Найти умение</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
              <input id="skill-search" type="search" placeholder="Найти умение…" autocomplete="off">
            </label>
          </div>
          <div id="skills-list" class="skills-list"></div>
          <div id="empty-skills" class="empty-state" hidden><p>Умений с таким названием нет.</p></div>
        </section>
      </div>
    </article>
  </template>

  <script src="assets/map.js" defer></script>
  <script src="assets/app.js?v=equipment-defense" defer></script>
</body>
</html>
